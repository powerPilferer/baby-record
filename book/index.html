<!doctype html>
<html lang="ko" class="boot">   <!-- 11-23: 표지가 다 놓이기 전엔 빈 책상만 (book.js reveal 이 뗀다) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece2cf">
<meta name="robots" content="noindex">   <!-- 11-25: 공유 링크(?s=토큰)로 열리는 쪽이라 검색에 잡히지 않게 -->
<title>성장앨범</title>
<!-- 11-26 공유 링크 미리보기(카톡 등). 크롤러는 JS 를 안 돌려 아기 이름은 못 넣는다 — 고정 문구(임시, 단비 몫). 그림은 img/og-book.png(1200×630, 가운데 정사각형 안에 다 들어 있음).
     그림을 바꾸면 ?v= 를 올린다(카톡은 그림 주소 기준으로 미리보기를 붙들고 있다). og:url 은 일부러 안 넣는다(토큰 주소마다 따로 긁히게) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="기특일기">
<meta property="og:title" content="기특일기 · 성장앨범">
<meta property="og:description" content="매일 쓴 일기와 사진이 책 한 권으로 쌓여요">
<meta property="og:image" content="https://powerpilferer.github.io/baby-record/img/og-book.png?v=1126">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="기특일기 · 성장앨범">
<meta name="twitter:description" content="매일 쓴 일기와 사진이 책 한 권으로 쌓여요">
<meta name="twitter:image" content="https://powerpilferer.github.io/baby-record/img/og-book.png?v=1126">
<meta name="description" content="매일 쓴 일기와 사진이 책 한 권으로 쌓여요">
<!-- 11-26 로딩: 책 파일(css·js)이 오기 전 첫 페인트부터 보이게 여기 안에 적는다. 앱 시작 로딩 화면(#splash)과 같은 캐릭터·점·글씨 값, 바탕만 책상색.
     앱 안(iframe)에서는 부모 창의 같은 로딩이 위를 덮고 있어 이쪽은 안 보인다. 공유 링크(?s=)·혼자 열 때는 이게 보인다. 걷는 일은 book.js reveal -->
<style>
html, body { background: #ece2cf; margin: 0; }
#bload { position: fixed; inset: 0; z-index: 90; background: #ece2cf; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .28s ease; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; }
#bload.out { opacity: 0; pointer-events: none; } #bload.out.q { transition-duration: .15s; }
#bload > * { animation: bl-in .24s cubic-bezier(.16,1,.3,1) both; }   /* 첫 프레임부터 보이되 툭 튀어나오지 않게 짧게 차오른다 */
@keyframes bl-in { from { opacity: 0; } }
#bload .roll { position: relative; width: 120px; height: 92px; margin-bottom: 12px; }
#bload .roll img { position: absolute; left: 50%; bottom: 0; height: 88px; width: auto; transform: translateX(-50%); visibility: hidden; }
#bload .roll img.on { visibility: visible; }
#bload .msg { font-size: 15px; font-weight: 400; line-height: 1.35; color: #655e54; letter-spacing: -.01em; margin: 0 0 12px; }
#bload .dots { display: flex; gap: 6px; }
#bload .dots i { width: 6px; height: 6px; border-radius: 50%; background: #655e54; opacity: .25; animation: bl-dot 1.2s ease-in-out infinite; }
#bload .dots i:nth-child(2) { animation-delay: .2s; } #bload .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes bl-dot { 0%, 100% { opacity: .25; } 40% { opacity: .9; } }
#bload .slow { position: absolute; left: 0; right: 0; top: calc(50% + 80px); text-align: center; color: #655e54; font-size: 13px; opacity: 0; transition: opacity .4s; }
#bload .slow.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #bload .dots i { animation: none; opacity: .6; } #bload > * { animation: none; } }
@media print { #bload { display: none; } }
</style>
<!-- 11-26 카카오톡 안에서 공유 링크(?s=)를 열면 기기 기본 브라우저로 넘긴다 (사장님 "카톡내에서 열어지니 좀 별로인듯"). 앱 본판 index.html 이 쓰는 것과 같은 스킴.
     · 책 파일·자료를 받기 전에 여기서 바로 넘기고, 넘기는 동안 이 창은 책을 받지 않는다(__kxHold — 아래 두 document.write 가 건너뛴다). 로딩 그림만 떠 있다.
     · 한 번만 시도한다. 1.5초 뒤에도 이 창이 그대로 보이면(스킴이 안 먹음) 또는 나중에 이 창으로 돌아오면 ?kx=1 을 붙여 여기서 그냥 책을 연다 — kx=1 이면 다시 넘기지 않는다.
     · 책상색 바탕을 칠하는 위 style 바로 다음에 둔다 — 넘기는 순간 이 창이 하얗게 번쩍이지 않게.
     · 카톡이 아닌 브라우저, 앱 안 책(iframe), ?s= 없는 주소에서는 아무 일도 없다. 닫기 스킴(inappbrowser/close)은 확인된 근거가 없어 쓰지 않는다. -->
<script>(function () { try {
  var q = location.search, top = false; try { top = window.top === window; } catch (_) {}
  if (!top || !/KAKAOTALK/i.test(navigator.userAgent) || !/[?&]s=[^&]/.test(q) || /[?&]kx=1(&|$)/.test(q)) return;
  window.__kxHold = true; window.__kxUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  var stay = function () { if (stay.done || document.hidden) return; stay.done = true; location.replace(location.href + '&kx=1'); };
  setTimeout(stay, 1500); document.addEventListener('visibilitychange', function () { setTimeout(stay, 300); });
  location.href = window.__kxUrl;
} catch (_) { window.__kxHold = false; } })();</script>
<!-- 11-26: 책 css·js 를 글꼴 css 보다 먼저, 한꺼번에 받기 시작한다. (전에는 글꼴 css → book.css → book.js 가 한 줄로 서서 차례로 받았다 — 앞 스타일시트가 끝나야 다음 document.write 가 돌았다) -->
<script>window.__bv = new URLSearchParams(location.search).get('v') || Date.now(); if (!window.__kxHold) document.write('<link rel="stylesheet" href="book.css?v=' + encodeURIComponent(__bv) + '"><link rel="preload" as="script" href="book.js?v=' + encodeURIComponent(__bv) + '">');</script>   <!-- 11-20: 앱 버전을 붙여 받아 폰 캐시에 옛 책이 남지 않게 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<div id="bload" role="status" aria-label="성장앨범 펴는 중"><div class="roll" id="bload-roll"><img class="on" src="../img/로딩-아기.webp" alt=""><img src="../img/로딩-엄마.webp" alt=""><img src="../img/로딩-아빠2.webp" alt=""></div><p class="msg">책 펴는 중</p><div class="dots"><i></i><i></i><i></i></div><div class="slow" id="bload-slow">연결이 조금 느려요. 잠시만요</div></div>   <!-- 문구는 임시 — 단비 몫 -->
<script>(function(){var r=document.getElementById('bload-roll').children,i=0;   // 아기 → 엄마 → 아빠 (앱 시작 로딩과 같은 박자)
var t=setInterval(function(){if(!document.getElementById('bload'))return clearInterval(t);r[i].className='';i=(i+1)%r.length;r[i].className='on';},500);
setTimeout(function(){var e=document.getElementById('bload-slow');if(e)e.classList.add('on');},6000);})();</script>
<div id="app">
  <header class="top">
    <button type="button" class="back" id="btn-back" aria-label="통계로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="ttl-h"><span class="nm" id="ttl"></span><span>의 성장앨범</span><img src="doodles/sprout.svg" alt=""></h1>
  </header>

  <!-- 첫 화면: 닫힌 책. 누르면 표지가 열리며 가장 최근 날이 펼쳐진다 -->
  <section id="cover" class="cover" aria-label="닫힌 책">
    <p class="cv-logo" id="cv-logo" aria-hidden="true"><span class="l1" id="cv-l1"></span><span class="l2">성장앨범</span></p>
    <button type="button" class="cbook" id="cbook">
      <span class="cb-shadow" aria-hidden="true"></span>
      <span class="cb-ribbon" aria-hidden="true"></span>
      <span class="cb-back" aria-hidden="true"></span>
      <span class="cb-pages" aria-hidden="true"></span>
      <span class="cb-cover" id="cb-cover">
        <span class="cb-front" id="cb-front"></span>   <!-- 표지 구성은 book.js drawCover 가 안(?design=a|b|c)에 따라 채운다 -->
        <span class="cb-in" aria-hidden="true"></span>
      </span>
    </button>
    <div class="cv-info" id="cv-info"><p class="tt" id="cv-tt"></p><p class="st" id="cv-st"></p><p class="hint">책을 누르면 가장 최근 날이 펼쳐져요</p></div>
  </section>

  <div id="view-book" class="view">
    <!-- 펼친 책: 왼쪽 쪽 = 사진, 오른쪽 쪽 = 날짜·일기. 펼침 한 면 = 하루 -->
    <section id="book" class="book" aria-live="polite" aria-roledescription="펼친 책">
      <div class="half hl" id="hl"></div>
      <div class="half hr" id="hr"></div>
      <div class="sheet" id="sheet" hidden><div class="face front" id="front"></div><div class="face back" id="back"></div></div>
      <div class="spine" aria-hidden="true"></div>
      <!-- 책갈피: 책 오른쪽 위 모서리에 끼운 캐릭터 책갈피. 누르면 아래로 길게 열려 장(일기·사진·숫자·성장)을 고른다 -->
      <span class="bm-head" aria-hidden="true"><img src="../img/아기-2g-전신-누끼.png" alt=""></span>
      <div class="bm" id="bm" hidden>
        <div class="bm-list" id="bm-list" role="menu"></div>
        <button type="button" class="bm-tog" id="bm-tog" aria-haspopup="menu" aria-expanded="false" aria-controls="bm-list" aria-label="책갈피 — 장 고르기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
      </div>
    </section>

    <nav class="bar" id="bar" aria-label="쪽 이동">
      <button type="button" class="chip" id="btn-month" aria-haspopup="dialog">
        <span id="lb-month">11월</span>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
      <span class="folio" id="folio"></span>
      <button type="button" class="chip ghost" id="btn-today">오늘 쪽
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
      </button>
    </nav>

    <!-- 책 아래: 긴 일기 이어 읽기 + 가족 댓글 -->
    <section class="under" aria-label="이 날의 글과 댓글">
      <div class="under-scroll" id="under"></div>
      <form class="cm-form" id="cm-form" autocomplete="off">
        <img src="../img/아빠-2g-b.png" alt="아빠" width="32" height="32">
        <input type="text" id="cm-name" class="gname" placeholder="이름" aria-label="이름 적기" maxlength="20" enterkeyhint="done" autocomplete="off" autocapitalize="off" hidden>   <!-- 11-26: 공유 링크 손님의 이름 칸 — 왼쪽 '이름' 알약을 누르면 그 자리에 열린다 (book.js nameShow) -->
        <p class="gtip" id="cm-tip" role="status" hidden>이름을 적으면 바로 남겨져요</p>
        <button type="button" class="pub" id="cm-pub" role="switch" aria-checked="false" aria-label="모두에게 보이기 — 켜면 링크로 온 손님도 이 댓글을 봐요" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c2.2 2 2.2 10.4 0 12.4M8 1.8c-2.2 2-2.2 10.4 0 12.4"/></svg><span>가족만</span></button>   <!-- 11-26: 앱에서만 보인다(공유 표가 서버에 있을 때). 기본 꺼짐 = 가족만 -->
        <input type="text" id="cm-input" placeholder="이 날에 한마디 남기기" aria-label="댓글 쓰기" maxlength="200" enterkeyhint="send">
        <button type="submit" id="cm-send" disabled>남기기</button>
      </form>
    </section>
  </div>

</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet-ui" id="sheet-mo" role="dialog" aria-modal="true" aria-labelledby="mo-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <header>
    <h2 id="mo-title">쪽 찾기</h2>
    <p>날짜를 누르면 그날이 펼쳐져요</p>
    <button type="button" class="x" data-close aria-label="닫기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
  </header>
  <div class="mo-list" id="mo-list"></div>
</section>

<div id="phview" class="phview" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기 — 누르면 닫혀요"><img alt=""><p></p></div>   <!-- 일기 쪽 사진을 누르면: 앱 다이어리의 사진 크게 보기(.phview)와 같은 모양·동작 -->
<script>if (!window.__kxHold) document.write('<script src="book.js?v=' + encodeURIComponent(__bv) + '"><\/script>');</script>
</body>
</html>
