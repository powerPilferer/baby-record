<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>성장 앨범</title>
<!-- 기특일기 돌 앨범 — 앱 안 화면 (춘봉 2026-11-11). index.html 이 전체 화면 iframe 으로 연다.
     만들기(표지·이름) → 만드는 중 → 뷰어(모선 틀) → PDF. 쪽 디자인 CSS(pages.css)·도장(stamp.js)·뷰어 CSS/JS 는 본판에서 빌드.py 가 뽑는다.
     iframe 인 이유: 앨범 CSS 의 전역 선택자(*·h1·.pg…)와 앱 CSS 가 서로 새지 않게, 그리고 앨범을 열 때만 받게(평소 앱 로딩 무게 0). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="pre">
<div id="src"></div>

<!-- 화면 1 · 앨범 만들기: 표지 4종 넘겨 고르기 + 표지에 쓸 이름 + (예약) 받을 날짜 -->
<section id="mk" class="scr hidden">
  <header class="mbar"><button type="button" data-mk="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h1 id="mk-title">앨범 만들기</h1><span class="sp"></span></header>
  <div class="mk-body">
    <div class="mk-lab">표지 <span id="mk-cvname"></span></div>
    <div class="cv-rail" id="cv-rail"></div>
    <div class="cv-chips" id="cv-chips"></div>
    <label class="mk-lab" for="mk-name">표지에 쓸 이름</label>
    <div class="mk-in"><input id="mk-name" maxlength="12" autocomplete="off" enterkeyhint="done"><button type="button" class="x hidden" id="mk-name-x" aria-label="지우기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="mk-help" id="mk-name-help">앱의 아기 이름은 그대로 두고, 앨범 표지에만 써요.</div>
    <div id="mk-date-wrap" class="hidden">
      <label class="mk-lab" for="mk-date">받을 날짜</label>
      <div class="mk-in"><input id="mk-date" type="date"></div>
      <div class="mk-help" id="mk-date-help">그날 아침에 완성돼요. 고른 날까지의 기록이 들어가요.</div>
    </div>
    <div class="mk-info" id="mk-info"></div>
  </div>
  <div class="mk-cta">
    <button type="button" class="btn" id="mk-go">앨범 만들기</button>
    <div class="mk-pay" id="mk-pay">출시 땐 여기서 <b>9,900원</b> 결제 · 지금은 리허설이라 결제 없이 만들어요</div>
  </div>
</section>

<!-- 화면 2 · 만드는 중 -->
<section id="prog" class="scr hidden">
  <div class="pg-cv" id="pg-cv"></div>
  <div class="pg-tt">앨범을 만드는 중</div>
  <div class="pg-st" id="pg-st">기록을 모으는 중</div>
  <div class="pg-bar"><i id="pg-bar"></i></div>
</section>

<!-- 화면 3 · 뷰어 (모선 틀.html 마크업 + 아래 동작 줄) -->
<header class="vbar top">
  <button type="button" data-act="back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl"><span id="v-title">첫 해</span><span class="cnt" id="count">1 / 1</span></div>
  <div class="r">
    <button type="button" data-act="toc" aria-label="쪽 지도" class="toc-btn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg></button>
  </div>
</header>
<div id="stage"><div id="enter"><div id="zoom"></div></div></div>
<footer class="vbar bot">
  <div class="prog"><i></i></div>
  <div class="acts">
    <button type="button" data-act="pdf"><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg><span>PDF 저장</span></button>
    <button type="button" data-act="img" class="soon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l4.5-4.5 3.5 3.5 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1.3"/></svg><span>쪽 이미지<small>준비 중</small></span></button>
    <button type="button" data-act="share" class="soon"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 11v7.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V11"/></svg><span>가족 링크<small>준비 중</small></span></button>
  </div>
</footer>
<div id="toast"></div>
<div id="sheet" aria-hidden="true"><div class="scrim"></div><div class="panel"><i class="grab"></i><div class="mt"><b>쪽 지도</b><span></span></div><div class="grid"></div></div></div>
<div id="tag"></div>

<!-- 인쇄(PDF) 전용 — 화면엔 안 보이고 print 때만 -->
<div id="print"></div>
<div id="pr-bar" class="hidden"><div><b>PDF로 저장</b><span>공유 ▸ "PDF 저장" 또는 프린터 고르기. 210×210mm 한 쪽씩 들어가요.</span></div><button type="button" id="pr-go">인쇄 창 열기</button></div>

<script src="who.js"></script>
<script src="stamp.js"></script>
<script src="build.js"></script>
<script src="viewer.js"></script>
<script src="app.js"></script>
</body>
</html>
