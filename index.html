<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>기특일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="img/icon-180-baby6.png">
<script>(function(){var p=localStorage.getItem("bb-theme")||"system";document.documentElement.dataset.theme=(p==="light"||(p==="system"&&matchMedia("(prefers-color-scheme: light)").matches))?"light":"dark";})();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0b0b0d; --card: #1f1f24; --card2: #2b2b32; --line: #303038;   /* 다크 박스 더 잘 보이게 (10-08 사장님) */
    --line2: #26262c; --fg: #f1f1f4; --fg2: #9a9aa4; --fg3: #6b6b75;   /* 다크 회색 글 살짝 밝게 (10-12 사장님, 전 #8f8f99·#55555e) */
    --feed: #6f9ee0; --diaper: #f2c94c; --sleep: #9d93d6; --temp: #d98079; --ok: #7fc39c;
    --kakao: #fee500;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  :root { --bg1: #151519; --dim: rgba(0,0,0,.6); color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f4f6; --bg1: #ececef; --card: #ffffff; --card2: #eeeef1; --line: #e4e4e9; --line2: #ededf1;
    --fg: #1b1b1f; --fg2: #6b6b75; --fg3: #9a9aa3;
    --feed: #3b7bd4; --diaper: #e8b10e; --sleep: #7565cf; --temp: #d4554d; --ok: #2f9e63;
    --dim: rgba(0,0,0,.35); color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; font-size: 17px; line-height: 1.35;
    letter-spacing: -.015em; }
  body { padding-top: var(--sat); min-height: 100dvh; overscroll-behavior-y: none; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }   /* 빠른 두 번 탭이 확대로 먹히지 않게 */
  html, body, * { touch-action: manipulation; }
  .hidden { display: none !important; }
  .screen { max-width: 480px; margin: 0 auto; padding: 0 16px calc(28px + var(--sab)); }

  /* ── 로그인 / 첫 설정 ── */
  /* 시작 로딩 화면 — 첫 show() 때 걷힌다 */
  #splash { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .28s ease; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .roll { position: relative; width: 120px; height: 92px; margin-bottom: 12px; }
  #splash .roll img { position: absolute; left: 50%; bottom: 0; height: 88px; width: auto; transform: translateX(-50%); visibility: hidden; }
  #splash .roll img.on { visibility: visible; }
  #splash .msg { font-size: 15px; font-weight: 400; color: var(--fg2); letter-spacing: -.01em; margin: 0 0 12px; }
  #splash .dots { display: flex; gap: 6px; }
  #splash .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg2); opacity: .25; animation: sp-dot 1.2s ease-in-out infinite; }
  #splash .dots i:nth-child(2) { animation-delay: .2s; } #splash .dots i:nth-child(3) { animation-delay: .4s; }
  #splash .slow { position: absolute; left: 0; right: 0; top: calc(50% + 80px); text-align: center; color: var(--fg2); font-size: 13px; opacity: 0; transition: opacity .4s; }
  #splash .slow.on { opacity: 1; }
  @keyframes sp-dot { 0%, 100% { opacity: .25; } 40% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { #splash .dots i { animation: none; opacity: .6; } }
  .onb { padding: 14vh 0 40px; max-width: 360px; margin: 0 auto; }
  #s-login .onb { text-align: center; padding-top: 18vh; }
  .onb h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.03em; }
  .onb > p, .onb > div > p:not(.msg) { color: var(--fg2); font-size: 15px; margin: 0 0 22px; }
  .family { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .family img { width: 76px; height: 76px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg); position: relative; }
  .family img:nth-child(1) { margin-right: -18px; z-index: 1; }
  .family img.baby { z-index: 3; }
  .family img:nth-child(3) { margin-left: -18px; z-index: 2; }
  #kakao-login { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 15px; border-radius: 999px; background: var(--kakao); color: #191600; font-weight: 700; font-size: 17px; }
  .foot { color: var(--fg3); font-size: 14px; margin-top: 14px; }
  .card { background: var(--card); border-radius: 16px; }
  :root:not([data-theme="light"]) :is(.card, .quick button, .status, .sum-pill) { box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }   /* 다크: 박스 테두리 살짝 */
  .card.form { padding: 6px 16px 14px; }
  .card.form label { display: block; font-size: 13px; color: var(--fg3); font-weight: 500; margin: 12px 0 6px; }
  .card.form label small { color: var(--fg3); font-weight: 400; margin-left: 4px; }
  .card.form input { width: 100%; background: var(--card2); border: 0; border-radius: 10px; padding: 12px 14px; font-size: 17px; outline: none; color: var(--fg); }
  .card.form input:focus { box-shadow: 0 0 0 1.5px var(--fg3); }
  .card.form input[type=date] { font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; min-height: 46px; }
  .card.form input.code-in { font-family: ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; font-size: 19px; }
  .photo-pick { display: flex; align-items: center; gap: 12px; }
  .photo-pick .pv { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--card2); }
  .pbtn { padding: 8px 14px; border-radius: 999px; background: var(--card2); color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pbtn.ghost { background: none; color: var(--fg2); }
  .card.form label.pbtn { display: inline-block; margin: 0; font-size: 14px; color: var(--fg); font-weight: 600; }
  header .who { cursor: pointer; border-radius: 999px; }
  header .who:active { opacity: .7; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 17px; margin-top: 4px; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .btn:disabled { opacity: .4; }
  .or { color: var(--fg3); font-size: 14px; margin: 26px 0 8px; text-align: center; }
  .msg { color: var(--temp); font-size: 14px; min-height: 18px; margin: 8px 2px; }

  /* ── 홈 ── */
  header { display: flex; align-items: center; justify-content: space-between; height: 46px; margin: 12px 0 10px; padding: 0; }
  header .who { display: flex; align-items: center; }
  #s-home header .who, #s-stats header .who { position: fixed; top: calc(var(--sat) + 12px); left: 16px; z-index: 31; max-width: calc(100% - 150px); height: 46px; padding: 0 14px 0 6px; border-radius: 999px; background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  :root[data-theme="light"] #s-stats header .who { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  :root[data-theme="light"] #s-home header .who { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  #s-stats header .bf, #s-home header .who .bf { width: 34px; height: 34px; margin-right: 9px; }
  #s-home header .who, #s-stats header .who { padding: 0 6px; }   /* 좌상단 알약: 얼굴·D+n 칩 둘레 상하좌우 6px 균일 (10-08 사장님) */
  #s-stats header .bf, #s-home header .who .bf { width: 32px; height: 32px; margin-right: 10px; }
  #s-home header .who .dday, #s-stats header .who .dday { margin-left: 8px; }
  /* ── 홈 상단 (10-07): 큰 프로필은 흐름 안에 그대로, 위로 사라지면 좌상단 알약이 나타남 */
  #s-home header { display: block; height: auto; margin: 0 0 6px; padding: 64px 0 0; }   /* .tabbed header의 오른쪽 56px 여백 무효 — 가운데 정렬 */
  #s-home header .hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 22px; }
  /* 프로필 위 왕관 (10-07, 미지 클레이 — 남아 A·여아 B) */
  #s-home header .hav { position: relative; }
  #s-home header .hav .bf { position: relative; z-index: 1; }
  #s-home header .hav .crown { position: absolute; z-index: 2; left: 50%; top: -30px; width: 44px; height: auto; transform: translateX(-50%) rotate(-12deg); filter: drop-shadow(0 3px 6px rgba(0,0,0,.25)); pointer-events: none; }
  #s-home header .hero .bf { width: 112px; height: 112px; margin: 0 0 10px; box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 6px 18px rgba(0,0,0,.35); }
  :root[data-theme="light"] #s-home header .hero .bf { box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0,0,0,.14); }
  #s-home header .hero .wl { display: flex; align-items: center; gap: 8px; height: 34px; white-space: nowrap; }
  #s-home header .hero .name { font-size: 27px; }
  #s-home header .hero .dday { margin-left: 0; }
  #s-home header .sub { font-size: 13px; color: var(--fg2); white-space: nowrap; line-height: 18px; }
  /* 홈 판 (10-12 사장님 "메인도 성장처럼 밑에 내용을 탭형식으로 스크롤 내리면 프로필 위로 덮어지게… 프로필 상단 부분의 배경컬러만 살짝 더 회색") — 판 = 원래 바탕색 그대로(카드색 안 바뀜), 프로필 뒤만 회색 */
  :root { --htop: #050507; --hpanel: #131317; } :root[data-theme="light"] { --htop: #e6e6ea; --hpanel: var(--bg); }   /* 다크: 올라오는 판이 프로필 배경보다 밝게 (10-13 사장님) */
  :root:not([data-theme="light"]) #s-home .h-panel, :root:not([data-theme="light"]) .g-panel { --card: #27272e; --card2: #35353e; --line: #3d3d47; --line2: #2f2f37; --bg1: #222228; }   /* 밝아진 판 위 박스·버튼 한 단계 올림 (10-13 사장님) */
  /* 다크 홈 다듬기 (10-14 사장님): 상단 알림 상자 배경 더 어둡게(테두리 유지) · 기록표 시각칩/줄 또렷하게 · 한마디 입력칸 검정 → 카드에 어울리게 */
  :root:not([data-theme="light"]) #s-home .h-panel .status { background: #1a1a1f; }   /* #0e0e12는 너무 진해 튐 (10-14 사장님) → 판과 박스 사이 */
  :root:not([data-theme="light"]) #s-home .h-panel .status .chip b { background: color-mix(in srgb, var(--c) 16%, #1a1a1f); }
  :root:not([data-theme="light"]) #s-home .h-panel :is(.row.feed, .row.diaper, .row.sleep) .t { background: color-mix(in srgb, var(--c) 24%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  :root:not([data-theme="light"]) #s-home .h-panel .row .t { font-weight: 600; }
  :root:not([data-theme="light"]) #s-home .h-panel .row :is(.d, .w) { border-top-color: rgba(255,255,255,.08); }
  :root:not([data-theme="light"]) #s-home .h-panel .row .gap, :root:not([data-theme="light"]) #s-home .h-panel .row .d small { color: var(--fg2); }
  :root:not([data-theme="light"]) #s-home .h-panel .row .rl::before { background: rgba(255,255,255,.14); }
  :root:not([data-theme="light"]) #s-home .h-panel .noteform input { background: #1c1c22; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  :root:not([data-theme="light"]) :is(#s-home .h-panel, .g-panel) :is(.card, .quick button, .status, .sum-pill, .stat-card) { box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  html:has(#s-home:not(.hidden)), html:has(#s-home:not(.hidden)) body { background: var(--htop); }
  #s-home.tabbed { padding-bottom: 0 !important; }
  #s-home header { display: contents; }   /* 헤더 상자를 없애야 프로필이 화면 전체에서 고정됨(헤더 안에선 헤더 끝에서 같이 올라감). 알약은 헤더 안 그대로 */
  #s-home .hero { position: sticky; top: calc(var(--sat) + 64px); z-index: 0; margin-top: 64px; padding-bottom: 28px !important; }
  #s-home .h-panel { position: relative; z-index: 2; margin: 0 -16px; padding: 2px 16px calc(112px + var(--sab)); min-height: 100dvh; background: var(--hpanel); border-radius: 30px 30px 0 0; border-top: 1px solid rgba(255,255,255,.06); box-shadow: 0 -10px 30px rgba(0,0,0,.35); }
  :root[data-theme="light"] #s-home .h-panel { border-top-color: rgba(0,0,0,.03); box-shadow: 0 -8px 28px rgba(0,0,0,.06); }
  #s-home header .who { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .22s ease, transform .22s ease; }
  #s-home header .who.on { opacity: 1; transform: none; pointer-events: auto; }
  header .bf { width: 31px; height: 31px; border-radius: 50%; margin-right: 10px; }
  header .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  header .dday { color: var(--ok); font-size: 13px; margin-left: 8px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 14%, var(--bg)); font-variant-numeric: tabular-nums; }
  header .gear { width: 40px; height: 40px; margin-right: -8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg2); }
  header .gear svg { width: 25px; height: 25px; fill: currentColor; }
  header .gear:active { background: var(--card); }
  .daynav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 21px; }
  #s-diary .daynav { position: sticky; top: calc(var(--sat) + 68px); z-index: 5; margin: 4px -16px 13px; padding: 8px 16px; background: var(--bg); box-shadow: 0 12px 10px -8px var(--bg); }   /* 위 버튼(자온·더보기) 밑에 붙고, 그 위 띠도 배경으로 덮음 */
  #s-diary header { position: sticky; top: 0; z-index: 6; box-sizing: content-box; margin: 0 -16px; padding: calc(12px + var(--sat)) 16px 10px; background: var(--bg); }   /* "다이어리" 제목도 고정 (10-14 사장님 "갈거면 고정으로 둬") */   /* 달 바꾸기 줄 고정 (10-14 사장님 "맨위로 올라가는게 불편") */
  #s-home .daynav { margin-top: 24px; }   /* 고정 알약과 날짜 줄 사이 10→24px (v0.17, 사장님 "여백이 너무 좁아") */
  .daynav button { color: var(--fg2); width: 44px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .daynav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .daynav button:active { background: var(--card); }
  .daynav button:disabled { color: var(--fg3); opacity: .35; }
  .daynav .date { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .date-pick { position: relative; display: flex; align-items: center; gap: 3px; padding: 8px 10px; margin: -8px -10px; border-radius: 10px; }
  .date-pick:active { background: var(--card); }
  .date-pick .dd { width: 16px; height: 16px; fill: none; stroke: var(--fg3); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .date-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0; -webkit-appearance: none; appearance: none; }
  .daynav .date small { color: var(--fg3); font-weight: 400; margin-left: 5px; font-size: 14px; }
  /* 홈 날짜 줄 키움 (10-08 사장님 "조금더 크게… 상하 여백 좀더 주고 컨트롤하는 부분이라") */
  #s-home .daynav { margin: 34px 0 30px; }
  #s-home .daynav button, #s-diary .daynav button { width: 42px; height: 42px; border-radius: 50%; background: color-mix(in srgb, var(--card) 50%, transparent); }   /* 바탕 흐리게 (10-08 사장님) */   /* 화살표 = 둥근 버튼으로 눌리는 곳임을 보이게 */
  #s-home .daynav button:active, #s-diary .daynav button:active { background: var(--card2); }
  #s-home .daynav button:disabled, #s-diary .daynav button:disabled { background: none; }
  #s-home .daynav button svg, #s-diary .daynav button svg { width: 21px; height: 21px; }   /* 52→42 (10-08 사장님 "화살표가 좀 크다") */
  #s-home .daynav .date, #s-diary .daynav .date { font-size: 19px; font-weight: 600; }
  #s-home .daynav .date small { font-size: 15.5px; margin-left: 6px; }
  #s-home .date-pick, #s-diary .date-pick { padding: 12px 14px; margin: -12px -14px; border-radius: 14px; }
  #s-home .date-pick .dd, #s-diary .date-pick .dd { width: 18px; height: 18px; }
  .dn-mid { display: flex; align-items: center; gap: 10px; }
  #s-home .daynav .today-chip, #s-diary .daynav .today-chip { width: auto; height: 30px; padding: 0 12px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 16%, var(--card)); color: var(--ok); font-size: 14px; font-weight: 600; }   /* 지난 날일 때만 */
  #s-home .daynav .today-chip.hidden, #s-diary .daynav .today-chip.hidden { display: none; }

  /* 간편 상태 두 칸 */
  .status { background: var(--bg1); border-radius: 14px; padding: 13px 15px; margin-bottom: 19px; display: flex; flex-direction: column; gap: 8px; }
  .status .chip { display: flex; align-items: center; gap: 10px; }
  .status .chip b { display: inline-flex; align-items: center; font-size: 13px; color: var(--c); font-weight: 500; flex: none; padding: 4px 9px; border-radius: 7px; background: color-mix(in srgb, var(--c) 14%, var(--bg1)); }
  .status .chip span { font-size: 15px; font-weight: 500; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .status .chip span small { color: var(--fg3); font-weight: 400; font-size: 13px; margin-left: 5px; }
  .status .chip.feed { --c: var(--feed); } .status .chip.sleep { --c: var(--sleep); } .status .chip.diaper { --c: var(--diaper); }
  :root[data-theme="light"] .status .chip.diaper b { color: #9a7400; }
  .sheet-title h2 { flex: none; }
  .sum-pill { display: flex; gap: 16px; margin: 0 0 10px; padding: 11px 15px; border-radius: 12px; background: var(--card); white-space: nowrap; overflow: hidden; }   /* 오늘의 표 제목 아래 한 줄 (v0.20, 사장님 "오늘의 표 아래로 한줄로") */
  .sum-pill::-webkit-scrollbar { display: none; }
  .sum-pill i { font-style: normal; font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; flex: none; }
  .sum-pill b { color: var(--fg2); font-weight: 600; }
  .sum-pill .feed b { color: var(--feed); } .sum-pill .diaper b { color: var(--diaper); } .sum-pill .sleep b { color: var(--sleep); }   /* 굵은 숫자만 항목 색 (사장님) */
  :root[data-theme="light"] .sum-pill .diaper b { color: #9a7400; }

  /* 카테고리 버튼 2×2 */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }

  /* 오늘의 표 */

  .clock .ck.sleep { fill: color-mix(in srgb, var(--sleep) 55%, var(--card)); } .clock .ck.sleep.open { fill: color-mix(in srgb, var(--sleep) 35%, var(--card)); }

  .rows { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 22px; }
  .row { --c: var(--fg2); display: grid; grid-template-columns: 52px 22px 1fr auto; gap: 0 8px; align-items: stretch; padding: 0 15px 0 13px; width: 100%; text-align: left; }
  .row:active { background: var(--card2); }

  /* 기저귀 = 버터 옐로 (v0.17, 사장님 "너무 똥색" → 추천 A). 라이트에선 노란 글자가 흐려서 글자만 한 단계 진하게, 노란 채움 위 글자는 검정 */

    background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }

  #s-settings header.sub { display: flex; justify-content: center; align-items: center; height: 46px; margin: 12px 0 10px; padding: 0; }
  .gear-fab:active { background: var(--card2); }
  .ai-fab { right: 70px; padding: 3px; }   /* 설정 버튼 왼쪽, 같은 유리 원형 */

  .ai-log { height: min(52vh, 440px); overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; margin: 0 -2px; overscroll-behavior: contain; }

  .ai-msg { display: flex; gap: 8px; align-items: flex-end; }

  .ai-dots { display: flex; gap: 4px; padding: 14px 16px; } .ai-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); animation: aiDot 1s infinite ease-in-out; }
  .ai-dots i:nth-child(2) { animation-delay: .15s; } .ai-dots i:nth-child(3) { animation-delay: .3s; }

    background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);

  .cal .d .tx { line-height: 17px; margin-top: 8px; font-family: "Poor Story", cursive; font-size: 13.5px; }   /* 칸 글씨도 공책과 같은 손글씨 (10-13 사장님 "손글씨 적용안으로") */
  .cal .d .m { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; max-height: 13px; overflow: hidden; }
  .cal .d .m i { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .cal .d .m i.feed { --c: var(--feed); } .cal .d .m i.diaper { --c: var(--diaper); } .cal .d .m i.sleep { --c: var(--sleep); } .cal .d .m i.nt { --c: var(--ok); }
  .cal .d .stk { position: absolute; right: -4px; top: -8px; font-size: 30px; line-height: 1; filter: drop-shadow(0 1.5px 2px rgba(0,0,0,.35)); pointer-events: none; }
  /* 다이어리 하루 = 꽉 찬 공책 한 장 (10-13 사장님 "화면이 꽉차서 일기처럼… 옅은 공책의 라인… 펜 느낌의 감성적인 폰트… 중간중간 이모지") */
  .dpage { position: fixed; left: 0; right: 0; top: 0; height: 100dvh; z-index: 60; display: flex; flex-direction: column; --paper: #fffdf6; --rule: rgba(70, 110, 190, .16); --ink: #45444d; --hand: "Poor Story";   /* 10-13 사장님 "푸어스토리로 하자" (펜 → 연필 느낌) */ background: var(--paper); padding-top: var(--sat); animation: dpIn .26s ease-out; }
  :root:not([data-theme="light"]) .dpage { --paper: #19181d; --rule: rgba(255, 255, 255, .075); --ink: #dddce4; }
  @keyframes dpIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dpage.hidden { display: none; }
  .dp-top { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px; }
  .dp-top button { height: 40px; border-radius: 999px; color: var(--fg2); font-size: 15px; font-weight: 600; }
  .dp-top .x { width: 40px; display: flex; align-items: center; justify-content: center; } .dp-top .x svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .dp-top .ok { margin-left: auto; padding: 0 16px; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .dp-head { padding: 4px 26px 2px; display: flex; align-items: flex-end; gap: 10px; }
  .dp-date { font-family: var(--hand), cursive; font-size: 32px; line-height: 1; color: var(--ink); letter-spacing: -.01em; }
  .dp-sub { font-size: 12.5px; color: var(--fg3); padding-bottom: 5px; }
  .dp-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; display: flex; flex-direction: column; padding-bottom: calc(16px + var(--sab)); }   /* 날짜·사진·일기·이날의 기록이 한 장으로 같이 스크롤 (10-15 사장님 "일기 가장밑으로") */
  .dpage:has(.dp-text:focus) .dp-body { padding-bottom: 8px; }
  .dp-text { flex: 1 0 auto; min-height: 158px; overflow: hidden; width: 100%; border: 0; outline: none; resize: none; padding: 6px 26px 0; margin-top: 26px; color: var(--ink); background-color: transparent;
    font-family: var(--hand), cursive; font-size: 23px; line-height: 38px;
    background-image: var(--lines); background-size: 100% 152px; background-position: 0 6px; }

  .dp-text::placeholder { color: color-mix(in srgb, var(--ink) 32%, transparent); }
  /* 그날 기록 요약 — 달력 점으로만 보이던 걸 공책 맨 아래에 (10-14 사장님). 글 쓰는 중(키보드)엔 숨김 */
  .dp-text { margin-bottom: 14px; }
  .dp-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: auto 18px 10px;   /* 글이 짧으면 맨 아래, 길면 글 끝 다음 (10-15 사장님) */ padding: 11px 14px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 5%, transparent); border: 1px dashed color-mix(in srgb, var(--ink) 16%, transparent); font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .dp-info em { font-style: normal; font-size: 11.5px; color: var(--fg3); width: 100%; margin-bottom: 1px; }
  .dp-info span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dp-info span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--fg3)); }
  .dp-info b { color: var(--fg); font-weight: 600; }
  .dpage:has(.dp-text:focus) .dp-info { display: none; }
  /* 주 1장 사진 (10-15 사장님 "주 한장으로 우선") — 공책에 테이프로 붙인 폴라로이드 */
  .dp-ph { margin: 16px 26px 0; align-self: flex-start; position: relative; padding: 8px 8px 22px; background: #fff; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.12); transform: rotate(-2deg); }
  .dp-ph img { display: block; width: 168px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 2px; }
  .dp-ph::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 20px; margin-left: -32px; background: rgba(240, 220, 170, .7); transform: rotate(3deg); }
  .dp-ph .wk { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: var(--hand), cursive; font-size: 13px; color: #8a8790; }

  :root:not([data-theme="light"]) .vx-next :is(.now, .soon) .vx-d, :root:not([data-theme="light"]) .vx-next .vx-cat:not(.chk):not(.own) { background: color-mix(in srgb, var(--ok) 20%, var(--bg)); }   /* 같은 바탕 위라 칩은 한 단계 진하게 */
  :root:not([data-theme="light"]) .vx-item.done .vx-ck { background: #2f9e63; border-color: #2f9e63; color: #fff; }   /* 체크 초록 진하게 (사장님 "체크 녹색도 좀더 진해야") */
  :root:not([data-theme="light"]) :is(.vx-item.now, .vx-item.soon) .vx-ck { border-color: #2f9e63; border-width: 2px; }
  :root:not([data-theme="light"]) :is(.now, .soon, .late) .vx-d { padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 16%, var(--bg)); }
  :root:not([data-theme="light"]) .late .vx-d { background: color-mix(in srgb, var(--temp) 16%, var(--bg)); }
  :root:not([data-theme="light"]) .vx-cat { background: color-mix(in srgb, var(--ok) 16%, var(--bg)); }

  :root:not([data-theme="light"]) .vx-cat.own { background: color-mix(in srgb, var(--sleep) 16%, var(--bg)); }
  .vx-ck { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .vx-item.done .vx-ck { background: var(--ok); border-color: var(--ok); color: var(--bg); }

  .vx-gh span { font-size: 13px; font-weight: 700; color: var(--fg); }
  .vx-gh small { font-size: 12px; color: var(--fg3); }
  .vx-own { font-style: normal; font-size: 11px; font-weight: 600; color: var(--sleep); margin-left: 6px; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--sleep) 14%, var(--card)); vertical-align: 1px; }
  .vx-cat.own { color: var(--sleep); background: color-mix(in srgb, var(--sleep) 14%, var(--card)); }
  .xv-sug { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .xv-sug button { padding: 6px 11px; border-radius: 999px; background: var(--bg); color: var(--fg2); font-size: 13px; font-weight: 500; }
  .vx-info { font-size: 13px; color: var(--fg2); line-height: 1.5; margin: -6px 0 12px; }
  .status .chip.vx { --c: var(--ok); width: 100%; text-align: left; padding: 0; }
  .status.vx-box { margin-top: -9px; padding: 11px 15px; }   /* 안내 상자 바로 아래 같은 모양 상자, 간격 10px */
  .stat-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 14px; }
  .stat-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .g-quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .g-quick button { position: relative; min-height: 78px; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding: 12px 13px; text-align: left; }
  .g-quick button:active { background: var(--card2); }
  .g-quick .k { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .g-quick .v { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .g-quick .v.none { color: var(--fg3); }
  .g-quick .p { font-size: 11px; color: var(--ok); font-weight: 600; }
  .g-quick .plus { position: absolute; top: 9px; right: 11px; width: 20px; height: 20px; border-radius: 50%; background: var(--card2); color: var(--fg2); font-size: 15px; line-height: 20px; text-align: center; font-weight: 500; }
  .frow.focus label { color: var(--ok); font-weight: 600; }
  .g-src { font-size: 11px; color: var(--fg3); margin-top: 6px; }
  .g-list { margin-top: 10px; border-top: 1px solid var(--line); }
  .g-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .g-row:last-child { border-bottom: 0; }
  .g-row .dt { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .g-row .v { font-size: 15px; font-variant-numeric: tabular-nums; grid-column: 1; }
  .g-row .nt { font-size: 12px; color: var(--fg3); grid-column: 1; }
  .g-row .av { grid-column: 2; grid-row: 1 / span 3; }
  .g-empty { padding: 4px 0 8px; color: var(--fg3); font-size: 14px; }
  .g-more { display: block; width: 100%; padding: 10px 0 2px; color: var(--fg3); font-size: 13px; }
  .sheet h3.grow { --c: var(--ok); }
  .stat-empty { padding: 30px 0; text-align: center; color: var(--fg3); font-size: 14px; }

  /* ── 바텀 시트 ── */
  .dim { position: fixed; inset: 0; background: var(--dim); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 22px 22px 0 0;
    padding: 14px 20px calc(20px + var(--sab)); max-width: 480px; margin: 0 auto; }
  .sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--fg3); opacity: .45; margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .sheet h3 { display: flex; align-items: center; gap: 8px; }
  .sheet h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .sheet h3.feed { --c: var(--feed); } .sheet h3.diaper { --c: var(--diaper); } .sheet h3.sleep { --c: var(--sleep); } .sheet h3.temp { --c: var(--temp); }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 10px 0; border-radius: 999px; font-weight: 600; color: var(--fg2); }
  .seg button.on { background: var(--card2); color: var(--fg); }
  .frow { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); }
  .frow label { color: var(--fg2); font-size: 16px; }
  .frow input { background: var(--bg); border: 0; border-radius: 10px; padding: 10px 12px; width: 140px; text-align: right; font-size: 20px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums; }
  .frow input[type=time] { width: 150px; }
  .frow input.wide { width: 100%; text-align: left; font-size: 17px; font-weight: 400; }
  .frow.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .ml { display: flex; gap: 6px; margin: 6px 0 4px; }
  .ml button { flex: 1; padding: 12px 0; border-radius: 999px; background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg2); }
  .ml button.on { background: var(--card2); color: var(--fg); }
  .ml button.clr { flex: 1.1; color: var(--fg2); font-size: 14px; }
  /* 시트 안 선택 표시 = 그 항목 색으로 채움 (v0.16, 사장님 "선택된건지 잘 모르겠음") */
  .sheet { --c: var(--ok); --on-fg: #0b0b0d; }
  :root[data-theme="light"] .sheet { --on-fg: #fff; }
  .sheet[data-kind="feed"] { --c: var(--feed); } .sheet[data-kind="diaper"] { --c: var(--diaper); } .sheet[data-kind="sleep"] { --c: var(--sleep); } .sheet[data-kind="temp"] { --c: var(--temp); }
  .sheet .seg button, .sheet .ml button { transition: background .12s, color .12s; }
  .sheet .seg button.on, .sheet .ml button.on { background: var(--c); color: var(--on-fg); font-weight: 700; box-shadow: 0 3px 10px color-mix(in srgb, var(--c) 30%, transparent); }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts button { flex: 1; padding: 15px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  .acts .save { background: var(--fg); color: var(--bg); flex: 2; }
  .sheet[data-kind="vax"] .acts button { padding: 15px 6px; font-size: 16px; white-space: nowrap; }   /* 버튼 3개(닫기·메모·완료로 표시)가 한 줄에 (10-08) */
  .sheet[data-kind="vax"] .acts .save { flex: 1.4; }   /* 완료로 표시 폭 줄임 (10-08 사장님) */
  .acts .cancel { background: var(--bg); color: var(--fg2); white-space: nowrap; }
  .acts .del { background: none; color: var(--temp); flex: 0 0 auto; padding: 14px 12px; }

  /* 설정 */
  .menu { background: var(--card); border-radius: 16px; margin: 12px 0; padding: 0 16px; }
  .menu > button, .menu > div { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 0; border-top: 1px solid var(--line2); text-align: left; font-size: 16px; }
  .menu > :first-child { border-top: 0; }
  .menu .v { color: var(--fg2); font-size: 15px; }
  .menu .lab { color: var(--fg); }
  .seg.mini { margin: -6px 0; padding: 3px; gap: 2px; background: var(--card2); }
  .seg.mini button { flex: none; white-space: nowrap; padding: 6px 12px; font-size: 15px; }
  .seg.mini button.on { background: var(--card); }
  .menu > .pick-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .pick { display: flex; justify-content: center; gap: 28px; padding: 4px 0 6px; }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg3); font-size: 14px; font-weight: 500; }
  .pick button img { width: 72px; height: 72px; border-radius: 50%; opacity: .45; transition: opacity .15s, box-shadow .15s; }
  .pick button.on { color: var(--fg); }
  .pick button.on img { opacity: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--fg); }
  .seg.mini button img { width: 20px; height: 20px; border-radius: 50%; margin-right: 6px; vertical-align: -5px; }
  :root[data-theme="light"] .seg.mini button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  /* 시트 안 작은 세그먼트(성별 등)도 선택 = 항목 색 채움. 위 .seg.mini 규칙이 배경만 카드색으로 덮어 글자가 안 보이던 것 (v0.21, 사장님 "성별 고르는 탭이 이상해") */
  .sheet .seg.mini button.on { background: var(--c); color: var(--on-fg); }
  .back { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .back svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .back:active { background: var(--card); }
  #s-settings .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .inl { display: inline-flex; align-items: center; gap: 8px; }
  .copy { padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--fg2); font-size: 13px; font-weight: 600; }
  .copy:active { background: var(--fg); color: var(--bg); }
  .pen { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--fg3); background: var(--card2); }
  .pen svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .inl input { width: 120px; background: var(--card2); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 16px; outline: none; text-align: right; color: var(--fg); }
  .inl .ok { padding: 6px 12px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600; }
  .ver { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 18px; }
  .menu-title { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 22px 2px 6px; }
  .menu-title:first-of-type { margin-top: 10px; }
  #logout { color: var(--temp); justify-content: center; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; font-weight: 600; color: var(--fg); font-size: 16px; }
  .cropper { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 10px) 16px calc(24px + var(--sab)); }
  .cr-top { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 17px; }

  .cr-view.rect .cr-mask { border-radius: 4px; }
  .cr-mask { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 999px rgba(0,0,0,.62); pointer-events: none; outline: 1.5px solid rgba(255,255,255,.55); outline-offset: -1px; }
  .cr-zoom { display: flex; align-items: center; gap: 12px; width: min(320px, calc(100vw - 32px)); margin-top: 22px; color: #999; font-size: 19px; }

<body>

<!-- 시작 로딩 -->
<div id="splash" aria-label="불러오는 중"><div class="roll" id="splash-roll"><img class="on" src="img/로딩-아기.webp" alt=""><img src="img/로딩-엄마.webp" alt=""><img src="img/로딩-아빠2.webp" alt=""></div><p class="msg">깨우는 중</p><div class="dots"><i></i><i></i><i></i></div><div class="slow" id="splash-slow">연결이 조금 느려요. 잠시만요</div></div>
<script>(function(){var r=document.getElementById('splash-roll').children,i=0;   // 아기 → 엄마 → 아빠 → 아기 …
var t=setInterval(function(){if(!document.getElementById('splash'))return clearInterval(t);r[i].className='';i=(i+1)%r.length;r[i].className='on';},500);
setTimeout(function(){var e=document.getElementById('splash-slow');if(e)e.classList.add('on');},6000);})();</script>

<!-- 로그인 -->
<section id="s-login" class="screen hidden">
  <div class="onb">
    <div class="family"><img src="img/아빠-2g-b.png" alt=""><img class="baby" src="img/아기-2g-원형.png" alt=""><img src="img/엄마-2g-b.png" alt=""></div>
    <h1>기특일기</h1>

      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#191600" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.2 4.6 6.6L5.5 21l4.4-2.9c.7.1 1.4.2 2.1.2 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>

<!-- 첫 설정: 닉네임 → 아기 만들기 / 초대 코드 -->

<!-- 홈: 오늘의 표 -->
<section id="s-home" class="screen tabbed hidden">

    <div class="hero" id="h-hero"><div class="hav"><img class="crown" id="h-crown" src="img/왕관-남.png" alt=""><img class="bf" src="img/아기-2g-원형.png" alt=""></div><div class="wl"><span class="name" id="h-name">아기</span><span class="dday" id="h-dday"></span></div><div class="sub" id="h-sub"></div></div>

  </header>

    <button type="button" id="day-next" aria-label="다음 날"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="status">
    <div class="chip feed"><b>마지막 수유</b><span id="st-feed">—</span></div>
    <button type="button" class="chip sleep" id="st-sleep-chip"><b>잠</b><span id="st-sleep">—</span></button>
  </div>
  <div class="status vx-box hidden" id="st-vax-wrap"></div>
  <div class="quick">

[-0.1872,8.7192,0.12247],[-0.2024,8.9481,0.12268],[-0.2158,9.1699,0.12283],[-0.2278,9.387,0.12294],[-0.2384,9.6008,0.12299],[-0.2478,9.8124,0.12303],[-0.2562,10.0226,0.12306],[-0.2637,10.2315,0.12309],[-0.2703,10.4393,0.12315],[-0.2762,10.6464,0.12323],[-0.2815,10.8534,0.12335],[-0.2862,11.0608,0.1235],[-0.2903,11.2688,0.12369],[-0.2941,11.4775,0.1239]],"fl":[[1.0,49.1477,0.0379],[1.0,53.6872,0.0364],[1.0,57.0673,0.03568],[1.0,59.8029,0.0352],[1.0,62.0899,0.03486],[1.0,64.0301,0.03463],[1.0,65.7311,0.03448],[1.0,67.2873,0.03441],[1.0,68.7498,0.0344],[1.0,70.1435,0.03444],[1.0,71.4818,0.03452],[1.0,72.771,0.03464],[1.0,74.015,0.03479],[1.0,75.2176,0.03496],[1.0,76.3817,0.03514],[1.0,77.5099,0.03534],[1.0,78.6055,0.03555],[1.0,79.671,0.03576],[1.0,80.7079,0.03598],[1.0,81.7182,0.0362],[1.0,82.7036,0.03643],[1.0,83.6654,0.03666],[1.0,84.604,0.03688],[1.0,85.5202,0.03711],[1.0,86.4153,0.03734]],"fh":[[1.0,33.8787,0.03496],[1.0,36.5463,0.0321],[1.0,38.2521,0.03168],[1.0,39.5328,0.0314],[1.0,40.5817,0.03119],[1.0,41.459,0.03102],[1.0,42.1995,0.03087],[1.0,42.829,0.03075],[1.0,43.3671,0.03063],[1.0,43.83,0.03053],[1.0,44.2319,0.03044],[1.0,44.5844,0.03035],[1.0,44.8965,0.03027],[1.0,45.1752,0.03019],[1.0,45.4265,0.03012],[1.0,45.6551,0.03006],[1.0,45.865,0.02999],[1.0,46.0598,0.02993],[1.0,46.2424,0.02987],[1.0,46.4152,0.02982],[1.0,46.5801,0.02977],[1.0,46.7384,0.02972],[1.0,46.8913,0.02967],[1.0,47.0391,0.02962],[1.0,47.1822,0.02957]]};
const GM = { w: { label: '몸무게', unit: 'kg', key: 'weight_kg', dig: 2 }, l: { label: '키', unit: 'cm', key: 'length_cm', dig: 1 }, h: { label: '머리둘레', unit: 'cm', key: 'head_cm', dig: 1 } };
let gMetric = localStorage.getItem('bb-gm') || 'w';
let gShowAll = true;   // 성장 탭 단독 화면이라 기록 전부 보임
const MON = 30.4375;
const ageMon = ds => (new Date(ds + 'T00:00') - new Date(baby.birth_date + 'T00:00')) / 86400000 / MON;
function lmsAt(sex, m, mo) {                       // 월 사이는 선형 보간, 0~24 밖은 끝값
  const t = WHO_LMS[sex + m]; if (!t) return null;
  const x = Math.max(0, Math.min(24, mo)), i = Math.min(23, Math.floor(x)), f = x - i;
  return t[i].map((v, k) => v + (t[i + 1][k] - v) * f);
}
const valAtZ = ([L, M, S], z) => L ? M * Math.pow(1 + L * S * z, 1 / L) : M * Math.exp(S * z);
const zOf = ([L, M, S], x) => L ? (Math.pow(x / M, L) - 1) / (L * S) : Math.log(x / M) / S;
function ncdf(z) { const t = 1 / (1 + .2316419 * Math.abs(z)), d = .3989423 * Math.exp(-z * z / 2);
  const p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
const pctOf = (m, ds, v) => { if (!baby.sex || !v) return null; const a = ageMon(ds); if (a < 0 || a > 24.5) return null; return Math.min(99.9, Math.max(.1, ncdf(zOf(lmsAt(baby.sex, m, a), v)) * 100)); };
const fmtPct = p => p == null ? '' : p < 1 ? '1 미만' : p > 99 ? '99 초과' : String(Math.round(p));
const fmtV = (m, v) => (+v).toFixed(GM[m].dig).replace(/\.?0+$/, '') + GM[m].unit;

function growthChart(m, pts) {
  const W = 320, H = 250, pl = 30, pr = 26, pt = 10, pb = 22;
  const nowA = ageMon(dstr(new Date()));
  const lastA = pts.length ? ageMon(pts[pts.length - 1].day) : 0;
  const xmax = Math.min(24, Math.max(3, Math.ceil(Math.max(nowA, lastA) + 1)));
  const Z = { 3: -1.8808, 15: -1.0364, 50: 0, 85: 1.0364, 97: 1.8808 };
  const sex = baby.sex, lines = {};
  if (sex) for (const [k, z] of Object.entries(Z)) { lines[k] = []; for (let a = 0; a <= xmax + 1e-9; a += xmax / 48) lines[k].push([a, valAtZ(lmsAt(sex, m, a), z)]); }
  let lo = Infinity, hi = -Infinity;
  for (const k in lines) for (const [, v] of lines[k]) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for (const p of pts) { lo = Math.min(lo, +p[GM[m].key]); hi = Math.max(hi, +p[GM[m].key]); }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const padY = (hi - lo) * .06 || 1; lo -= padY; hi += padY;
  const X = a => pl + a / xmax * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const path = arr => arr.map(([a, v], i) => (i ? 'L' : 'M') + X(a).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const band = (a, b) => path(lines[a]) + [...lines[b]].reverse().map(([x, v]) => 'L' + X(x).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + 'Z';
  let g = '';
  // 눈금: 세로 = 개월, 가로 = 값
  const step = xmax <= 6 ? 1 : xmax <= 12 ? 2 : 3;
  for (let a = 0; a <= xmax; a += step) g += `<line x1="${X(a)}" x2="${X(a)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)" stroke-width="1"/><text x="${X(a)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--fg3)">${a ? a + '개월' : '출생'}</text>`;
  const ys = (hi - lo) > 8 ? Math.ceil((hi - lo) / 4) : (hi - lo) > 3 ? 1 : .5;
  for (let v = Math.ceil(lo / ys) * ys; v <= hi; v += ys) g += `<text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--fg3)">${+v.toFixed(1)}</text>`;
  if (sex) {
    g += `<path d="${band(3, 97)}" fill="var(--ok)" opacity=".07"/><path d="${band(15, 85)}" fill="var(--ok)" opacity=".10"/>`;
    for (const k of [3, 97]) g += `<path d="${path(lines[k])}" fill="none" stroke="var(--fg3)" stroke-width="1" opacity=".5"/>`;
    g += `<path d="${path(lines[50])}" fill="none" stroke="var(--fg3)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    for (const k of [3, 50, 97]) { const e = lines[k][lines[k].length - 1]; g += `<text x="${W - pr + 4}" y="${Y(e[1]) + 3}" font-size="10" fill="var(--fg3)">${k}</text>`; }
  }
  if (nowA <= xmax) g += `<line x1="${X(nowA)}" x2="${X(nowA)}" y1="${pt}" y2="${H - pb}" stroke="var(--temp)" stroke-width="1" opacity=".5"/>`;
  const pp = pts.map(p => [ageMon(p.day), +p[GM[m].key]]).filter(([a]) => a >= 0 && a <= xmax);
  if (pp.length > 1) g += `<path d="${path(pp)}" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pp.forEach(([a, v], i) => { const last = i === pp.length - 1; g += `<circle cx="${X(a)}" cy="${Y(v)}" r="${last ? 5 : 3.5}" fill="${last ? 'var(--ok)' : 'var(--card)'}" stroke="var(--ok)" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function renderGrowth() {
  const el = $('growth'); if (!el) return;
  const m = gMetric, key = GM[m].key;
  const pts = growth.filter(r => r[key] != null && r[key] !== '').sort((a, b) => a.day < b.day ? -1 : 1);
  const last = pts[pts.length - 1], prev = pts[pts.length - 2];
  let now = `<div class="g-empty">${GM[m].label} 기록이 아직 없어요</div>`;
  if (last) {
    const p = pctOf(m, last.day, +last[key]);
    let dl = '';
    if (prev) { const dv = +last[key] - +prev[key], dd = Math.round((new Date(last.day) - new Date(prev.day)) / 86400000);
      dl = `${dv >= 0 ? '+' : '−'}${m === 'w' ? Math.round(Math.abs(dv) * 1000) + 'g' : Math.abs(dv).toFixed(1) + 'cm'} · ${dd}일 동안`; }
    now = `<div class="g-now"><b>${fmtV(m, last[key])}</b>${p != null ? `<span class="pc">백분위 ${fmtPct(p)}</span>` : ''}<span class="dl">${fmtDate(last.day).replace(/<[^>]+>/g, ' ')} · D+${dayNo(last.day)}</span></div>${dl ? `<div class="sub" style="margin:0 0 8px">${dl}</div>` : ''}`;
  }
  const sexAsk = baby.sex ? '' : `<div class="g-sex">성별을 고르면 WHO 기준 곡선과 백분위가 같이 보여요<div class="gs-btns"><button type="button" data-sex="m">남아</button><button type="button" data-sex="f">여아</button></div></div>`;
  const rows = [...growth].sort((a, b) => a.day < b.day ? 1 : -1);
  const shown = gShowAll ? rows : rows.slice(0, 3);
  const list = rows.length ? `<div class="g-list" style="border-top:0;margin-top:0">${shown.map(r => `<button type="button" class="g-row" data-id="${r.id}">
      <span class="dt">${fmtDate(r.day).replace(/<[^>]+>/g, ' ')} · D+${dayNo(r.day)}</span>
      <span class="v">${['w', 'l', 'h'].filter(k => r[GM[k].key] != null).map(k => fmtV(k, r[GM[k].key])).join(' · ')}</span>
      ${r.note ? `<span class="nt">${esc(r.note)}</span>` : ''}${avatar(r.user_id)}</button>`).join('')}</div>
      ${rows.length > 3 && !gShowAll ? `<button type="button" class="g-more" id="g-more">이전 기록 ${rows.length - 3}개 더 보기</button>` : ''}` : '';
  const lastOf = k => growth.filter(r => r[GM[k].key] != null).sort((a, b) => a.day < b.day ? -1 : 1).pop();
  // 측정 버튼 3개 = v0.13 카드 디자인 그대로 (사장님 "버튼은 기존 디자인대로 밑으로")
  const quick = ['w', 'l', 'h'].map(k => { const g = GM[k], lp = lastOf(k), pc = lp ? pctOf(k, lp.day, +lp[g.key]) : null;
    return `<button type="button" data-gq="${k}"><span class="plus">+</span><span class="k">${g.label}</span><span class="v ${lp ? '' : 'none'}">${lp ? fmtV(k, lp[g.key]) : '기록 없음'}</span>${pc != null ? `<span class="p">백분위 ${fmtPct(pc)}</span>` : ''}</button>`; }).join('');
  const bd = new Date(baby.birth_date + 'T00:00');
  // 프로필 = 사진 + 이름·D+n·설명 (v0.18)
  const profile = `<div class="gp"><div class="gp-top"><button type="button" class="gp-av" id="gp-av" aria-label="아기 정보"><img src="${esc(babyFace())}" alt=""></button>
      <div class="gp-info"><div class="gp-name">${esc(baby.name)}<span class="dday">D+${dayNo(dstr(new Date()))}</span></div>
      <div class="gp-bio">${bd.getFullYear()}년 ${bd.getMonth() + 1}월 ${bd.getDate()}일생 · ${baby.sex === 'f' ? '여아' : baby.sex === 'm' ? '남아' : '성별 미정'}</div></div></div></div>`;
  $('g-prof').innerHTML = profile;
  el.innerHTML = `<div class="g-quick" id="g-quick">${quick}</div><div class="stat-card grow">
    <div class="g-head"><h3>성장곡선</h3></div>
    <div class="seg mini g-metric" id="g-metric">${Object.entries(GM).map(([k, v]) => `<button type="button" data-v="${k}" class="${k === m ? 'on' : ''}">${v.label}</button>`).join('')}</div>
    ${now}${sexAsk}${growthChart(m, pts)}
    ${baby.sex ? `<div class="g-src">점선 = 50백분위 · 띠 = 3~97 / 15~85 · WHO 성장기준(0~24개월)</div>` : ''}</div>
    <div class="stat-card grow"><div class="g-head" style="margin-bottom:4px"><h3>측정 기록</h3><span class="g-cnt">${rows.length ? rows.length + '회' : ''}</span></div>
    ${list || '<div class="g-empty">아직 측정 기록이 없어요. 맨 위 버튼으로 시작해요</div>'}</div>`;
  el.querySelectorAll('[data-gq]').forEach(b => b.onclick = () => openGrowthSheet(null, b.dataset.gq));
  $('gp-av').onclick = () => openBabySheet();
  $('g-metric').onclick = e => { const b = e.target.closest('button'); if (!b) return; gMetric = b.dataset.v; localStorage.setItem('bb-gm', gMetric); renderGrowth(); };
  el.querySelectorAll('.g-row').forEach(b => b.onclick = () => openGrowthSheet(growth.find(r => r.id === b.dataset.id)));
  el.querySelectorAll('[data-sex]').forEach(b => b.onclick = async () => { try { await db.updBaby({ sex: b.dataset.sex }); renderGrowth(); toast('기준 곡선을 켰어요'); } catch (e) { alert('저장 실패: ' + e.message); } });
  if ($('g-more')) $('g-more').onclick = () => { gShowAll = true; renderGrowth(); };
}

function openGrowthSheet(rec, focus) {
  // 두 모드 (v0.15 버그 수정): ① 입력(focus 있음, 상단 버튼) = 날짜가 대상을 정한다. 그날 기록이 있으면 불러와 이어 적고, 없으면 새 줄.
  //   날짜를 바꿔도 다른 날 기록을 옮기거나 덮지 않는다. ② 고치기(목록에서) = 그 한 줄만 고친다. 기록 있는 다른 날로 옮기기는 막는다.
  const entry = !!focus, today = dstr(new Date());
  let target = entry ? (growth.find(r => r.day === today) || null) : rec;
  const val = (r, k) => r && r[GM[k].key] != null ? +r[GM[k].key] : '';
  $('sheet').innerHTML = `<h3 class="grow" id="g-title"></h3>
    <div class="frow"><label>날짜</label><input type="date" id="g-day" value="${entry ? today : rec.day}" max="${today}" style="width:170px"></div>
    <div class="frow${focus === 'w' ? ' focus' : ''}"><label>몸무게 <small style="color:var(--fg3)">kg</small></label><input type="number" inputmode="decimal" step="0.01" id="g-w" placeholder="3.52"></div>
    <div class="frow${focus === 'l' ? ' focus' : ''}"><label>키 <small style="color:var(--fg3)">cm</small></label><input type="number" inputmode="decimal" step="0.1" id="g-l" placeholder="51.5"></div>
    <div class="frow${focus === 'h' ? ' focus' : ''}"><label>머리둘레 <small style="color:var(--fg3)">cm</small></label><input type="number" inputmode="decimal" step="0.1" id="g-h" placeholder="35.0"></div>
    <div class="frow col"><label>메모</label><input class="wide" id="g-note" maxlength="60" placeholder="1차 검진, 소아과, 집 체중계…"></div>
    <div class="foot" style="margin:2px 0 0" id="g-foot">재지 않은 칸은 비워두세요</div>
    <div class="acts">${!entry ? '<button type="button" class="del" id="sh-del">삭제</button>' : ''}<button type="button" class="cancel" id="sh-cancel">취소</button><button type="button" class="save" id="sh-save"></button></div>`;
  const fill = r => { for (const k of ['w', 'l', 'h']) $('g-' + k).value = val(r, k); $('g-note').value = r ? r.note || '' : '';
    $('g-title').textContent = !entry ? '성장 측정 고치기' : r ? (r.day === today ? '오늘 측정 이어 적기' : '이날 측정 이어 적기') : '성장 측정';
    $('sh-save').textContent = entry && !r ? '기록' : '저장';
    $('g-foot').textContent = entry && r ? '이날 적어둔 값이에요. 바꾸거나 빈칸을 채워주세요' : '재지 않은 칸은 비워두세요'; };
  fill(target);
  if (entry) $('g-day').addEventListener('change', () => { target = growth.find(r => r.day === $('g-day').value) || null; fill(target); });
  $('sheet').dataset.kind = 'growth';
  $('dim').classList.remove('hidden'); $('sheet').classList.remove('hidden'); $('dim').onclick = closeSheet; $('sh-cancel').onclick = closeSheet;
  if (focus) { const f = $('g-' + focus); f.focus(); if (f.value) f.select(); }   // 누른 항목 칸에 바로 커서 (같은 탭 제스처 안이라 iOS 키보드도 뜸)
  if ($('sh-del')) $('sh-del').onclick = async () => { if (!confirm('이 측정 기록을 지울까요?')) return; try { await db.delGrowth(rec.id); closeSheet(); renderGrowth(); toast('지웠어요'); } catch (e) { alert('삭제 실패: ' + e.message); } };
  $('sh-save').onclick = async () => {
    const num = id => { const x = $(id).value.trim().replace(',', '.'); return x === '' ? null : +x; };
    const w = num('g-w'), l = num('g-l'), h = num('g-h'), dayV = $('g-day').value;
