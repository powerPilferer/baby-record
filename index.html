    if ($('vx-unresv')) $('vx-unresv').onclick = async () => { try { await db.setCheck(it.id, null); closeSheet(); renderVax(); render(); toast('예약을 지웠어요'); } catch (e) { alert('실패: ' + e.message); } };
    if ($('vx-undo')) $('vx-undo').onclick = async () => { if (!confirm('완료 표시를 지울까요?')) return; const n = $('vx-note').value.trim();   // 메모·예약일은 남김
      try { await db.setCheck(it.id, (n || c.plan_on) ? { done_on: null, note: n } : null); closeSheet(); renderVax(); render(); toast('완료를 취소했어요'); } catch (e) { alert('실패: ' + e.message); } };
  };
  draw();
  $('sheet').dataset.kind = 'vax';
  $('dim').classList.remove('hidden'); $('sheet').classList.remove('hidden'); $('dim').onclick = closeSheet;
}
// 홈 안내 상자: 7일 안에 시작하거나 지금 기간이거나 지난 것 중 가장 급한 하나
// 직접 추가: 필수 말고 선택접종(유료) 등. 맞은 날 또는 예정일 하나만 적는다 (v0.19, 사장님 "돈 더내고 맞는 주사도 직접 기입")
function openExtraSheet(rec) {
  const done = rec ? !!rec.done_on : true;
  $('sheet').innerHTML = `<h3 class="grow">${rec ? '직접 추가한 항목' : '접종·검진 직접 추가'}</h3>
    <div class="frow col"><label>이름</label><input class="wide" id="xv-name" maxlength="24" placeholder="예: 수막구균, 인플루엔자" value="${esc(rec ? rec.name : '')}"></div>
    <div class="xv-sug">${['수막구균', '인플루엔자', 'RSV 항체주사', '로타바이러스'].map(n => `<button type="button" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="frow"><label>차수</label><input id="xv-dose" maxlength="8" placeholder="1차" value="${esc(rec ? rec.dose || '' : '')}" style="width:120px"></div>
    <div class="seg" id="xv-kind" style="margin:12px 0 0"><button type="button" data-v="done" class="${done ? 'on' : ''}">맞았어요</button><button type="button" data-v="due" class="${done ? '' : 'on'}">예정이에요</button></div>
    <div class="frow"><label id="xv-dl">${done ? '맞은 날' : '예정일'}</label><input type="date" id="xv-day" value="${rec ? rec.done_on || rec.due_on : dstr(new Date())}" min="${baby.birth_date}" ${done ? `max="${dstr(new Date())}"` : ''} style="width:170px"></div>
    <div class="frow col"><label>메모</label><input class="wide" id="xv-note" maxlength="60" placeholder="병원 이름, 비용 등" value="${esc(rec ? rec.note || '' : '')}"></div>
    <div class="acts">${rec ? '<button type="button" class="del" id="xv-del">삭제</button>' : ''}<button type="button" class="cancel" id="sh-cancel">취소</button><button type="button" class="save" id="xv-save">${rec ? '저장' : '추가'}</button></div>`;
  $('sheet').dataset.kind = 'vax';
  $('dim').classList.remove('hidden'); $('sheet').classList.remove('hidden'); $('dim').onclick = closeSheet; $('sh-cancel').onclick = closeSheet;
  $('sheet').querySelector('.xv-sug').onclick = e => { const b = e.target.closest('button'); if (b) { $('xv-name').value = b.dataset.n; $('xv-dose').focus(); } };
  $('xv-kind').onclick = e => { const b = e.target.closest('button'); if (!b) return; for (const x of $('xv-kind').children) x.classList.toggle('on', x === b);
    const d = b.dataset.v === 'done'; $('xv-dl').textContent = d ? '맞은 날' : '예정일'; if (d) $('xv-day').max = dstr(new Date()); else $('xv-day').removeAttribute('max'); };
  if ($('xv-del')) $('xv-del').onclick = async () => { if (!confirm('이 항목을 지울까요?')) return; try { await db.delExtra(rec.id); closeSheet(); renderVax(); render(); toast('지웠어요'); } catch (e) { alert('삭제 실패: ' + e.message); } };
  $('xv-save').onclick = async () => {
    const name = $('xv-name').value.trim(), day = $('xv-day').value, isDone = $('xv-kind').querySelector('.on').dataset.v === 'done';
    if (!name) { toast('이름을 적어주세요'); return; } if (!day) { toast('날짜를 골라주세요'); return; }
    if (isDone && day > dstr(new Date())) { toast('맞은 날은 오늘까지만 돼요'); return; }
    const row = { name, dose: $('xv-dose').value.trim(), done_on: isDone ? day : null, due_on: isDone ? null : day, note: $('xv-note').value.trim() };
    try { if (rec) await db.updExtra(rec.id, row); else await db.addExtra(row); closeSheet(); renderVax(); render(); toast(rec ? '고쳤어요' : `${name} 추가했어요`); }
    catch (e) { alert('저장 실패: ' + e.message); }
  };
}
function homeVaxLine() {
  const it = upcomingVax(1)[0]; if (!it) return '';
  const st = vaxState(it); if (st === 'later') return '';
  const t0 = new Date(dstr(new Date()) + 'T00:00'); if (st === 'soon' && (A(it) - t0) / 86400000 > 7) return '';
  return `<button type="button" class="chip vx" id="st-vax"><b>${it.cat === 'chk' ? '검진' : '접종'}</b><span>${esc(it.name.length > 10 ? it.name.replace(/\(.*\)/, '') : it.name)} ${it.dose}<small>${(resvOf(it) && resvDday(resvOf(it))) || vaxDday(it) || vaxWhen(it)}</small></span></button>`;
}
function setGSub(v) { gSub = v; localStorage.setItem('bb-gsub', v); for (const b of $('g-sub').children) b.classList.toggle('on', b.dataset.v === v);
  $('growth').classList.toggle('hidden', v !== 'grow'); $('g-vax').classList.toggle('hidden', v !== 'vax'); $('g-info').classList.toggle('hidden', v !== 'info');
  if (v === 'vax') renderVax(); else if (v === 'info') { renderGrowth(); renderInfo(); } else renderGrowth(); }

// ═══ 월별정보 (v0.24) — 개월별 "이 시기의 아기는? / 엄마와 아빠는?" ═══
// 내용: 임신육아종합포털 아이사랑 등 공공 자료를 확인해 짧게 다시 씀(각 달 sources). 평균 키·몸무게는 WHO 50백분위(WHO_LMS).
const MONTHLY = /*MONTHLY*/[{"m":0,"headline":"엄마 배 속을 떠나 세상에 적응하는 중이에요","feed":{"count":"8~12회","interval":"2~3시간","amount":"1회 50~100ml","note":"밤에도 아기가 원할 때마다 먹여요. 모유는 시간을 재기보다 배고파할 때 물려요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["갓 태어난 아기는 20~30cm 거리를 가장 잘 봐요. 안았을 때 엄마·아빠 얼굴이 딱 그쯤이라, 가까이서 눈을 맞춰 주면 좋아요. 목소리도 벌써 구분해서 2~3주쯤이면 익숙한 목소리를 알아들어요.","지금은 울음이 아기의 유일한 말이에요. 처음엔 왜 우는지 헷갈려도, 지내다 보면 배고픈 울음과 졸린 울음이 조금씩 구분돼요. 밤낮 구분 없이 2~3시간씩 자고 깨는 게 보통이에요.","탯줄은 보통 1~2주면 말라서 떨어져요. 그때까지는 깨끗하고 뽀송하게만 지켜 주면 돼요. 첫 영유아건강검진은 생후 14~35일 사이에 있으니 미리 챙겨 두세요."],"parent_headline":"몸이 회복되는 산욕기예요","parent":["출산 후 4~6주는 몸이 임신 전으로 돌아가는 산욕기예요. 오로가 몇 주 이어지고 훗배앓이가 있을 수 있어요. 지금은 다이어트보다 잘 먹고 쉬는 게 먼저예요.","밤중 수유는 한 사람이 다 떠안지 않게 나눠요. 수유하는 사람에게 물과 베개를 챙기고, 아기를 건네주거나 다시 재우는 것만 맡아도 큰 힘이 돼요. 기분이 가라앉는 날이 2주 넘게 이어지면 함께 전문의를 찾아가 보세요."],"sources":["https://www.childcare.go.kr/?menuno=420","https://www.childcare.go.kr/?menuno=422","https://www.childcare.go.kr/?menuno=423","https://www.childcare.go.kr/?menuno=424","https://www.childcare.go.kr/?menuno=276","https://www.childcare.go.kr/?menuno=416","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":1,"headline":"엄마·아빠 목소리에 반응하기 시작해요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유는 2~3시간마다 하루 8~12번쯤 먹어요. 1~6개월 모유 섭취량은 하루 평균 750~800ml지만 아기마다 달라요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["꼭 쥐고 있던 손이 조금씩 펴지고 손가락을 빨기도 해요. 팔다리 움직임이 활발해지고, 엎드린 자세에서 고개를 좌우로 돌리기도 해요. 목은 아직 완전히 가누지 못하니 안을 때 꼭 받쳐 주세요.","생후 4주 무렵 BCG와 B형간염 예방접종이 있어요. 첫 검진 때 함께 챙기면 편해요. 체중은 한 번 재는 것보다 일주일~열흘 간격으로 꾸준히 재서 흐름을 보는 게 좋아요.","수유, 목욕, 기저귀 갈기 같은 일상 속에서 말을 걸어 주세요. 아기는 따로 가르치지 않아도 함께 있는 시간 속에서 가장 잘 배워요."],"parent_headline":"엄마도 함께 검진받는 달이에요","parent":["생후 1개월쯤엔 아기만이 아니라 엄마도 산후 회복을 확인받는 게 좋아요. 궁금한 점을 미리 메모해 가면 진료 때 놓치지 않아요.","요리·빨래 같은 집안일은 수유하지 않는 쪽이 최대한 맡아 주세요. 수유가 끝나면 트림시키기나 기저귀 갈기를 번갈아 하면서 두 사람 모두 아기와 가까워질 수 있어요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=429","https://www.childcare.go.kr/?menuno=431","https://www.childcare.go.kr/?menuno=432","https://www.childcare.go.kr/?menuno=433","https://www.childcare.go.kr/?menuno=422","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":2,"headline":"첫 사회적 미소를 보여 줘요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유는 2개월이 지나면 하루 5~8번 정도로 줄어들어요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["엄마·아빠 얼굴을 보고 방긋 웃는 사회적 미소가 나타나요. 기분이 좋으면 옹알이도 하고, 대답해 주면 더 신나서 소리를 내요. 소리 나는 쪽으로 고개를 돌리기도 해요.","이 무렵 아기 울음이 가장 많아져요. 이유 없이 오래, 특히 늦은 오후나 저녁에 우는 경우가 많은데 3~5개월쯤이면 줄어드는 게 보통이에요.","2개월에는 DTaP, 소아마비, 폐렴구균, b형 헤모필루스 인플루엔자 예방접종이 있어요. 로타바이러스는 선택접종이에요. 땀이 많아지는 시기라 시원하고 청결하게 해 주면 땀띠 예방에 좋아요."],"parent_headline":"울음이 가장 힘든 시기예요","parent":["아무리 달래도 울음이 안 그칠 때가 있어요. 부모 탓이 아니에요. 너무 지치면 아기를 안전한 침대에 눕혀 두고 잠깐 다른 방에서 숨을 돌려도 괜찮아요.","아무리 힘들어도 아기를 흔들면 안 돼요. 한 사람이 한계에 다다르면 다른 한 사람이 바로 교대하기로 미리 약속해 두세요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=427","https://www.childcare.go.kr/?menuno=428","https://www.childcare.go.kr/?menuno=429","https://www.childcare.go.kr/?menuno=432","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":3,"headline":"목에 힘이 생기고 밤잠이 길어져요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"수유 횟수와 양이 조금씩 규칙적으로 잡혀 가요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["눈앞에서 천천히 움직이는 물건을 180도까지 따라 봐요. 차츰 목을 가누고, 3개월쯤부터는 뒤집기를 시도하는 아기도 있어요. 머리 위에 딸랑이를 들어 손을 뻗게 해 보세요.","2~3개월부터 밤낮 수면 패턴이 생기기 시작해요. 3개월이 되면 자다가 덜 깨고, 저녁에 4~5시간 정도 이어서 자기도 해요. 밤에는 어둡고 조용하게, 수유도 간단하게 해 주세요.","하루에 잠깐씩 엎드려 놀기를 하면 목과 등 근육이 튼튼해져요. 영아산통은 대개 3~4개월이 지나면 자연스럽게 줄어들어요."],"parent_headline":"몸과 마음의 변화를 살필 때예요","parent":["출산 후 2~5개월 사이에 머리카락이 많이 빠질 수 있어요. 호르몬 변화 때문이고 보통 6개월이 지나면 회복돼요.","산후우울증은 출산 후 1년 안에 언제든 올 수 있어요. 잠을 못 이루거나 눈물이 잦고 쉽게 화가 나는 날이 2주 넘게 이어지면 혼자 참지 말고 함께 상담을 받아 보세요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=427","https://www.childcare.go.kr/?menuno=431","https://www.childcare.go.kr/?menuno=433","https://www.childcare.go.kr/?menuno=276","https://www.childcare.go.kr/?menuno=415","https://www.childcare.go.kr/?menuno=416","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":4,"headline":"뒤집기를 시작하고 까꿍에 까르르 웃어요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유수유라면 생후 6개월까지는 모유만 먹이는 걸 권해요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["색을 구별할 만큼 눈이 좋아지고 자기 이름에 반응하기도 해요. 누워 있다가 뒤집기를 시작하고, 장난감을 양손으로 잡고 입으로 가져가요.","사물이 안 보여도 있다는 걸 조금씩 알게 돼서 까꿍 놀이를 정말 좋아해요. 소리 내어 웃고, 옹알이로 엄마·아빠와 주고받기를 즐겨요.","4개월에는 2개월 때 맞은 접종의 2차가 있어요. 4~6개월 사이에 2차 영유아건강검진도 있으니 일정을 확인해 두세요."],"parent_headline":"역할을 다시 나눠 볼 때예요","parent":["하루 동안 집에서 하는 일을 적어 보고, 아이를 위한 일과 어른을 위한 일로 나눠 보세요. 누가 더 하느냐보다 각자 잘하는 일로 나누는 게 오래가요.","배우자가 아기를 보는 시간은 온전히 내 휴식으로 써도 괜찮아요. 서로 그런 시간을 일주일에 한 번이라도 만들어 주세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=439","https://www.childcare.go.kr/?menuno=440","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":5,"headline":"낯가림이 시작되고 감정 표현이 풍부해져요","feed":{"count":"4~6회","interval":"4~6시간 (낮 시간)","amount":"1회 160~200ml (하루 800~1,000ml)","note":"이유식을 시작했다면 하루 1번 정도예요. 아직은 수유가 주된 영양이에요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["가족 얼굴을 알아보고 낯선 사람을 구분하기 시작해요. 즐거우면 환하게 웃고 싫으면 울면서 감정을 잘 드러내요. 거울 속 자기 모습을 보고 웃기도 해요.","‘아, 에, 오’ 같은 모음 옹알이에 ‘ㅁ, ㅂ’ 같은 자음 소리가 섞이기 시작해요. 아기가 소리를 내면 따라 해 주세요.","이유식은 서두르지 않아도 돼요. 시작한다면 묽은 미음 한 숟가락부터, 새 재료는 한 번에 한 가지씩 며칠 두고 살펴보며 늘려 가요. 시작 시기는 검진 때 상의해 보세요."],"parent_headline":"몸은 천천히 돌아와도 괜찮아요","parent":["임신 전 몸무게로는 보통 6개월에 걸쳐 천천히 돌아와요. 모유수유 중이라면 무리한 다이어트보다 끼니를 거르지 않는 게 더 중요해요.","나들이는 보통 이 무렵부터 시작해요. 아기 기분이 좋고 열이 없는 날, 가까운 공원처럼 짧은 외출부터 해 보세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=439","https://www.childcare.go.kr/?menuno=277","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":6,"headline":"잠깐 앉고 첫니가 보이기 시작해요","feed":{"count":"4~6회","interval":"4~6시간 (낮 시간)","amount":"1회 160~200ml (하루 800~1,000ml)","note":"고기는 만 6개월부터 줄 수 있어요. 과일주스는 6개월 전에는 주지 않아요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["목을 완전히 가눠서 잠깐 앉아 있을 수 있고, 엎드리면 상체를 번쩍 들어요. 슬슬 기려는 시도를 하는 아기도 있어요.","첫니는 보통 6~8개월 사이 아래 앞니부터 나와요. 이 나는 시기는 아기마다 많이 달라서 돌 전에만 나면 괜찮아요. 이가 나면 바로 닦기 시작해요. 젖은 가제나 아기 칫솔에 불소 치약을 쌀알만큼 묻혀 하루 두 번 닦아 주세요.","6개월에는 DTaP·소아마비·폐렴구균·b형 헤모필루스 인플루엔자 3차와 B형간염 3차 접종이 있어요. 가을 이후라면 독감 접종도 챙겨요. 밤에 6시간쯤 길게 자는 날도 생겨요."],"parent_headline":"복직과 밤중 수유를 계획해 볼 때예요","parent":["밤중 수유는 아기가 잘 크고 있다면 이 무렵부터 천천히 줄여 볼 수 있어요. 꼭 끊어야 하는 건 아니니 두 사람에게 맞는 방법을 골라요.","복직을 앞두고 있다면 2주 전부터 회사에서 유축할 시간에 맞춰 연습해 두면 좋아요. 아빠가 하루를 통째로 맡아 보는 날도 만들어 보세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=282","https://www.nhs.uk/baby/babys-development/teething/looking-after-your-babys-teeth/","https://www.healthychildren.org/English/healthy-living/oral-health/Pages/FAQ-Fluoride-and-Children.aspx","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":7,"headline":"혼자 앉고 배밀이를 시작해요","feed":{"count":"3~5회","interval":"5~6시간","amount":"1회 160~240ml (하루 700~800ml)","note":"이유식은 하루 2번, 간식은 1번 정도예요. 혀로 으깰 수 있는 정도로 부드럽게 만들어요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["많은 아기가 기대지 않고 혼자 앉을 수 있어요. 배밀이를 시작하고, 물건을 한 손에서 다른 손으로 옮겨 쥐어요.","엄마·아빠가 안 보이면 불안해서 우는 분리불안이 나타나요. 애착이 잘 생겼다는 자연스러운 신호예요. 자주 안아 주고 까꿍·숨바꼭질 놀이를 해 주세요.","갑자기 이유식을 덜 먹는 때가 있는데 흔한 일이에요. 잘 놀고 변을 잘 보면 억지로 먹이지 않아도 돼요."],"parent_headline":"서로 다른 육아 방식을 맞춰 가요","parent":["자란 환경이 다르니 육아 방식이 다른 건 당연해요. 다만 아기 앞에서 다투거나 서로 다른 지시를 하지 않도록, 둘만 있을 때 차분히 이야기해 보세요.","대화할 땐 휴대폰을 내려놓고 상대에게 집중해요. 몸이 지치면 말이 날카로워지기 쉬우니 피곤한 날엔 쉬고 나서 이야기해도 돼요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=442","https://www.childcare.go.kr/?menuno=443","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":8,"headline":"가구를 잡고 일어서요","feed":{"count":"3~5회","interval":"5~6시간","amount":"1회 160~240ml (하루 700~800ml)","note":"새 재료는 2~3일 간격으로 한 가지씩 더해요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["가구를 붙잡고 일어서는 아기가 많아요. 빠른 아기는 손을 잡고 한두 걸음 떼기도 하는데, 이때 넘어지기 쉬우니 주변을 잘 살펴 주세요.","8개월이 되면 대부분 부모 도움 없이도 잠들 수 있어요. 대신 기어 다니기 시작하고 분리불안이 생기면서 잠투정이 늘기도 해요.","위쪽 앞니 2개가 나와 이가 4개쯤 되는 시기예요. 기어 다니며 뭐든 입에 넣으니 바닥에 작은 물건이 없는지 한번 엎드려서 살펴봐 주세요."],"parent_headline":"각자의 시간을 확보해요","parent":["두 사람의 하루 일과를 각자 적어 보고 비교해 보세요. 누가 더 많이 하느냐보다 서로의 시간이 어디로 가는지 보는 게 먼저예요.","일주일 중 각자 아기와 노는 시간을 정하고, 그동안 다른 한 사람은 쉬거나 하고 싶은 일을 해요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=443","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=448","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":9,"headline":"말의 뜻을 조금씩 알아들어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 이유식 하루 3번, 간식 1번 정도로 진밥처럼 조금 되게 만들어요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["9개월쯤이면 단어의 뜻을 이해하기 시작해요. 이름을 부르면 돌아보고, 손가락으로 가리키기도 해요. 짝짜꿍, 바이바이 놀이를 좋아해요.","숟가락을 휘젓고 손으로 음식을 만지느라 반은 흘리지만, 스스로 먹는 걸 배우는 과정이에요. 새 음식을 거부하면 다음 날 다시 줘 보세요. 열 번 넘게 시도해야 받아들이기도 해요.","9~12개월 사이에 3차 영유아건강검진이 있어요. 이유식 진행과 빈혈 여부를 살펴봐요."],"parent_headline":"함께 밥 먹는 시간을 만들어요","parent":["아기 밥을 먼저 먹이고 어른은 따로 먹기 쉬운데, 이유식 시간을 온 가족 식사 시간으로 삼아 보세요. 일주일에 한두 번이라도 좋아요.","먹이는 일에만 집중하기보다 함께 식탁에 앉는 경험을 쌓아 가면 아기의 식습관에도 도움이 돼요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=446","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":10,"headline":"잡고 걷고 손끝으로 집어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 생우유는 돌 전에는 삼가요."},"sleep":{"total":"12~15시간","nap":null,"source":"미국수면재단"},"baby":["혼자 일어나고 가구나 손을 잡고 걸어요. 엄지와 검지로 작은 것을 집을 수 있게 되고, 컵을 들고 마셔 보기도 해요.","칭찬과 꾸중을 구별하고, 자주 보는 사람은 며칠이 지나도 알아봐요. 물건을 통에 넣었다 빼는 놀이를 한참 해요.","보행기는 되도록 쓰지 않는 게 좋아요. 대신 매트 위에서 마음껏 움직이게 해 주세요. 계단이 있다면 안전문을 달고, 약과 세제는 손이 닿지 않는 곳에 둬요."],"parent_headline":"아기와 1:1 시간을 챙겨요","parent":["함께하는 시간이 짧은 쪽이라면 퇴근 후 짧게라도 아기와 둘만의 시간을 정해 두세요. 그림책을 읽거나 마사지를 해 주며 이야기하는 걸로 충분해요.","아기가 빠르게 움직이는 만큼 집 안 점검은 두 사람이 같이 해요. 조부모님 댁처럼 자주 가는 곳도 함께 살펴봐 주세요."],"sources":["https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=448","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":11,"headline":"엄마 아빠 말고도 단어가 늘어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 이유식은 하루 3번, 간식 1번 정도예요."},"sleep":{"total":"12~15시간","nap":null,"source":"미국수면재단"},"baby":["‘엄마’, ‘아빠’ 말고도 단어 몇 개를 말하기 시작해요. 고개 젓기, 손 흔들기 같은 몸짓으로도 뜻을 전해요.","아래 앞니 양옆으로 2개가 더 나서 이가 6개쯤 돼요. 분유병을 문 채 잠들면 충치가 생기기 쉬우니 돌 전후로 병 수유를 줄여 가요.","좋아하는 사람과 물건이 뚜렷해지고 엄마·아빠가 떠나면 울기도 해요. 책을 가져와 읽어 달라고 건네기도 해요."],"parent_headline":"내 감정도 돌봐 주세요","parent":["몸이 지치면 상대의 말을 나쁘게 받아들이기 쉬워요. 육아 스트레스를 배우자에게 쏟고 있지는 않은지 가끔 돌아봐요.","말수나 감정 표현은 사람마다 달라요. 내 기준 대신 상대의 성향을 이해하려고 하면 대화가 한결 편해져요."],"sources":["https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=452","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":12,"headline":"첫 걸음을 향해 가는 돌이에요","feed":{"count":"2회","interval":null,"amount":"하루 400~600ml","note":"오전·오후에 먹어요. 식사 3번, 간식 2번으로 점차 가족 식사 시간에 맞춰 가요."},"sleep":{"total":"11~14시간","nap":null,"source":"미국수면재단"},"baby":["빠른 아기는 혼자 걷기 시작해요. 아직 잡고 걷는 아기도 많으니 조급해하지 않아도 돼요. 공 주고받기처럼 간단한 놀이를 할 수 있어요.","돌 무렵이면 가족과 같은 건강한 음식을 조금 부드럽고 작게 해서 먹을 수 있어요. 땅콩, 포도, 사탕처럼 목에 걸리기 쉬운 음식은 조심해 주세요.","MMR(홍역·유행성이하선염·풍진) 1차는 12~15개월, A형간염 1차는 12개월 이후에 맞아요. 할 줄 알던 것을 못 하게 되는 등 걱정되는 변화가 있으면 소아청소년과에 상담해 보세요."],"parent_headline":"1년을 함께 해낸 두 사람이에요","parent":["아기가 커 갈수록 정해야 할 일이 늘어나요. 놀아 주는 것뿐 아니라 육아의 방향을 정하는 일도 두 사람이 함께해요.","1년 동안 서로 수고 많았다고 말해 주세요. 앞으로도 가족 식사와 각자의 쉬는 시간을 계속 지켜 가요."],"sources":["https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=282","https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1107","https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1109","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]}]/*END*/;
let infoM = null;
const TIPS = /*TIPS*/[{"m":0,"tips":[{"q":"딸꾹질을 자주 해요","a":"아기 딸꾹질은 흔하고, 대개 아기보다 부모가 더 신경 쓰여요. 5~10분 지나면 저절로 멎는 경우가 많으니 감싸 안아 따뜻하게 해 주세요. 자주 한다면 너무 배고파지기 전, 차분할 때 먹여 보세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/baby-burping-hiccups-and-spit-up.aspx","https://neo.amc.seoul.kr/asan/depts/neo/K/bbsDetail.do?menuId=4833&contentId=267028"]},{"q":"초록색 변을 봐요","a":"초록 변은 흔한 일이라 놀라지 않아도 돼요. 처음엔 검푸른 끈적한 태변이 나오고, 그 뒤 노랑·초록빛 변으로 바뀌어요. 분유 먹는 아기는 초록 변이 특히 흔해요.","warn":"변에 피나 코 같은 점액, 물이 많이 섞여 나오면 소아청소년과에 바로 가요","src":["https://www.healthychildren.org/english/ages-stages/baby/pages/babys-first-days-bowel-movements-and-urination.aspx"]},{"q":"얼굴이 오돌토돌해요","a":"흔히 태열이라 부르는 신생아 여드름은 많은 아기가 겪는 일이에요. 보통 생후 2~4주에 올라와 4~6개월이면 저절로 사라져요. 오일이나 연고는 오히려 심해지게 하니 바르지 말고 두세요.","warn":"작은 물집이 잡히거나 생후 3개월 전에 열이 나면 소아청소년과에 바로 가요","src":["https://www.healthychildren.org/English/tips-tools/Symptom-Checker/Pages/symptomviewer.aspx?symptom=Newborn+Rashes+and+Birthmarks"]},{"q":"밤낮이 바뀐 것 같아요","a":"밤마다 말똥말똥하면 정말 지치죠. 낮잠은 생활 소리가 나는 거실에서 재워도 괜찮아요. 밤에는 불을 어둡게, 목소리는 낮게 하고 수유·트림·기저귀 갈기만 조용히 해 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/Reversing-Day-Night-Reversal.aspx"]},{"q":"얼굴이 노래졌어요","a":"신생아 황달은 흔하고 대부분 저절로 좋아져요. 보통 3일째쯤 가장 눈에 띄고 2주쯤이면 옅어져요. 밝은 햇빛 아래에서 흰자위와 입안, 코끝을 살짝 눌러 본 피부색을 살펴보세요.","warn":"생후 24시간 안에 노래지거나, 변이 허옇고 소변이 진하거나, 잘 안 먹고 축 처지면 바로 병원에 가요","src":["https://www.nhs.uk/conditions/jaundice-newborn/"]}]},{"m":1,"tips":[{"q":"먹고 나면 자꾸 게워요","a":"아기 때 게우는 건 흔하고 대개 걱정할 일이 아니에요. 먹는 중간중간 트림을 시키고, 다 먹은 뒤엔 되도록 오래 세워 안아 주세요. 잘 때는 자주 게워도 머리 쪽을 높이지 말고 평평하게 바로 눕혀요.","warn":"초록·노란 물이나 피를 토하거나, 뿜듯이 토하거나, 먹기를 거부하면 소아청소년과에 바로 가요","src":["https://www.nhs.uk/conditions/reflux-in-babies/","https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/baby-burping-hiccups-and-spit-up.aspx"]},{"q":"열이 나는 것 같아요","a":"이마나 몸을 만져 보는 건 정확하지 않으니 꼭 체온계로 재 주세요. 귀 체온계는 6개월 전엔 정확하지 않을 수 있어요. 3개월 전 아기는 다른 증상이 없어도 38도가 넘으면 바로 진료가 필요해요.","warn":"생후 3개월 전에 38도 이상이면 다른 증상이 없어도 소아청소년과나 응급실에 바로 가요","src":["https://www.healthychildren.org/English/health-issues/conditions/fever/Pages/Fever-and-Your-Baby.aspx"]},{"q":"코가 막혀 그르렁거려요","a":"코가 막히면 먹고 자기가 힘들어 안쓰럽죠. 약이 들지 않은 식염수를 콧구멍에 두 방울씩 넣어 불린 뒤, 먹이기 전에 흡인기로 살살 빼 주세요. 잘 때 베개나 수건으로 받쳐 올리지 말고 평평하게 바로 눕혀요.","warn":"숨 쉴 때마다 헐떡이거나 입술·얼굴이 파래지면 119에 연락하거나 응급실에 바로 가요","src":["https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/my-baby-has-a-stuffy-nose-how-can-i-help-them-sleep-safely.aspx"]},{"q":"머리에 노란 딱지가 생겼어요","a":"지루성 두피 딱지는 가렵거나 아프지 않고 옮지도 않아요. 보습제를 살살 문질러 딱지를 불린 뒤 부드러운 솔로 빗고 아기 샴푸로 씻어 주세요. 억지로 떼면 덧날 수 있고, 올리브유·땅콩기름은 피해요.","warn":"딱지에서 피나 진물이 나거나, 붓거나, 몸에 넓게 번지면 소아청소년과 진료를 받아요","src":["https://www.nhs.uk/conditions/cradle-cap/"]},{"q":"며칠째 변을 안 봐요","a":"모유 먹는 아기는 6주쯤 지나면 며칠, 길게는 일주일까지 변을 안 보기도 해요. 힘주며 얼굴이 빨개지는 것도 흔해요. 변이 딱딱한 알갱이 같으면 바로 눕혀 다리를 자전거 타듯 움직이고 배를 살살 문질러 주세요.","warn":"생후 첫 달에 하루 한 번도 변을 안 보거나, 딱딱한 변에 피가 묻어 나오면 소아청소년과 상담을 받아요","src":["https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Infant-Constipation.aspx","https://www.nhs.uk/start4life/baby/feeding-your-baby/breastfeeding/breastfeeding-challenges/constipation/"]}]},{"m":2,"tips":[{"q":"저녁마다 자지러지게 울어요","a":"아무리 달래도 우는 저녁엔 부모도 지치죠. 영아산통은 보통 6주쯤 가장 심하고 3~4개월이면 사라져요. 안아서 천천히 살살 흔들어 주고, 안고 먹인 뒤 꼭 트림시키고, 조용한 곳에서 따뜻하게 목욕도 해 보세요.","warn":"계속 토하거나 변에 피가 섞이거나, 울음소리가 힘없거나 평소와 다르게 높으면 바로 병원에 가요","src":["https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000469","https://www.nhs.uk/conditions/colic/"]},{"q":"땀띠가 났어요","a":"목·겨드랑이처럼 접히는 곳에 잘 생겨요. 시원한 물로 씻기거나 젖은 수건으로 식힌 뒤 물기를 완전히 말리고, 얇고 헐렁한 면옷을 입혀 주세요. 두껍고 끈적한 연고는 땀구멍을 막아 오히려 안 좋아요.","warn":"고름이 잡히거나 열이 나거나, 3일이 지나도 안 낫고 심해지면 소아청소년과 진료를 받아요","src":["https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Heat-Rash.aspx"]},{"q":"접종 후 열나고 보채요","a":"접종 뒤 보채거나 열이 조금 나는 건 흔한 반응이에요. 접종 부위가 붉게 붓고 아파하면 찬 물수건을 대 주고, 옷을 너무 껴입히지 말고 자주 먹여 주세요. 접종 후 최소 3일은 잘 지켜봐요.","warn":"고열이 나거나 경련을 하면 소아청소년과에 바로 가요","src":["https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=114","https://www.nhs.uk/vaccinations/vaccination-tips-for-parents/"]},{"q":"머리 한쪽이 납작해요","a":"아기 머리뼈는 말랑해서 한 자세로 오래 누우면 납작해질 수 있어요. 깨어 있을 때 엎드려 놀게 하고, 장난감 위치와 안고 먹이는 방향을 번갈아 바꿔 주세요. 잠은 지금처럼 꼭 바로 눕혀 재워요.","warn":"고개가 늘 한쪽으로 기울어 있거나 반대로 돌리기 힘들어하면 소아청소년과 진료를 받아요","src":["https://www.nhs.uk/conditions/plagiocephaly-brachycephaly/"]},{"q":"기저귀 발진이 생겼어요","a":"빨갛게 짓무르면 보는 마음도 아프죠. 젖은 기저귀는 바로 갈고, 틈틈이 기저귀를 벗겨 바람을 쐬어 주세요. 물이나 향 없는 물티슈로 닦아 톡톡 말린 뒤 보호 크림을 얇게 발라요. 비누·파우더는 피해요.","warn":"열이 나거나 많이 아파하거나, 낫지 않고 번지면 소아청소년과 진료를 받아요","src":["https://www.nhs.uk/baby/caring-for-a-newborn/nappy-rash/"]}]},{"m":3,"tips":[{"q":"엎드리는 걸 싫어해요","a":"처음엔 싫어하는 아기가 많아요. 하루 두세 번, 3~5분씩 짧게 시작해 보세요. 엄마·아빠가 누워 가슴 위에 엎드리게 하면 얼굴을 보려고 고개를 들어요. 꼭 깨어 있을 때 곁에서 지켜봐 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/back-to-sleep-tummy-to-play.aspx"]},{"q":"손을 쪽쪽 빨아요","a":"빠는 건 타고난 욕구라, 먹을 때뿐 아니라 스스로 마음을 달랠 때도 빨아요. 지금은 억지로 떼어 낼 필요 없어요. 대부분 영구 앞니가 나기 전에 스스로 그만두고, 침에 젖은 손은 물 묻힌 부드러운 천으로 닦아 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Pacifiers-and-Thumb-Sucking.aspx"]},{"q":"눈곱이 자꾸 껴요","a":"아기 다섯 중 한 명꼴로 눈물길이 덜 열려 눈물과 눈곱이 잘 생겨요. 끓여 식힌 물에 적신 솜으로 살살 닦아 주세요. 열에 아홉은 돌 전에 저절로 뚫려요.","warn":"흰자위가 빨갛게 되고 며칠이 지나도 가라앉지 않으면 소아청소년과 진료를 받아요","src":["https://www.hey.nhs.uk/patient-leaflet/blocked-tear-ducts-in-babies/","https://www.healthychildren.org/English/health-issues/conditions/eyes/Pages/Warning-Signs-of-Vison-Problems-in-Children.aspx"]},{"q":"침을 너무 많이 흘려요","a":"2~3개월쯤 침샘이 바빠지는데, 아직 삼키는 힘이 약해 흘러나와요. 턱과 목을 자주 닦아 주고, 흡수 잘 되는 면 턱받이를 젖는 대로 갈아 주세요. 잘 때는 숨쉬기 안전하게 턱받이를 꼭 벗겨요.","warn":"침을 많이 흘리면서 아파 보이거나 열이 나고 삼키기 힘들어하면 소아청소년과에 바로 가요","src":["https://www.healthychildren.org/English/ages-stages/baby/teething-tooth-care/Pages/Drooling-and-Your-Baby.aspx"]},{"q":"쪽쪽이 써도 될까요?","a":"써도 괜찮아요. 낮잠·밤잠에 물리면 영아돌연사 위험을 낮추는 데 도움이 될 수 있어요. 모유 수유 중이면 수유가 자리 잡은 뒤(보통 3~4주) 시작하고, 억지로 물리지는 마세요. 줄로 침대나 목에 묶으면 절대 안 돼요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Pacifiers-and-Thumb-Sucking.aspx"]}]},{"m":4,"tips":[{"q":"잘 자다 다시 자주 깨요","a":"3개월쯤 길게 자던 아기도 4~5개월에 밤에 다시 깨는 경우가 많아요. 깨면 너무 울기 전에 달래 주세요. 매일 같은 시간에 하루를 시작하고 아침에 커튼을 열어 햇빛을 들이면 몸 시계를 잡는 데 도움이 돼요.","warn":null,"src":["https://www.newcastle-hospitals.nhs.uk/services/great-north-childrens-hospital/childrens-sleep-service/sleep-infants-0-12-months/"]},{"q":"먹다가 자꾸 딴짓해요","a":"덜 먹은 것 같아 애가 타죠. 먹다 말고 꼼지락거리거나 딴 데를 보면 배가 찼다는 신호일 때가 많아요. 끝까지 먹이려 애쓰기보다 아기 신호를 믿어 주고, 조용하고 덜 산만한 곳에서 먹여 보세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/formula-feeding/Pages/amount-and-schedule-of-formula-feedings.aspx","https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Breastfeeding-Mealtime-Milestones.aspx"]},{"q":"이유식 언제 시작해요?","a":"6개월 무렵, 앉은 자세로 고개를 가누고, 음식을 집어 입에 가져가고, 뱉지 않고 삼킬 수 있을 때가 좋아요. 주먹을 빨거나 밤에 더 깨는 건 준비 신호가 아니에요. 이유식을 시작해도 밤잠이 길어지진 않아요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/babys-first-solid-foods/"]},{"q":"안아야만 자요","a":"안겨서 잠들었다가 내려놓으면 깨는 건 정말 흔해요. 4개월부터는 완전히 잠들기 전 졸려 할 때 눕혀 보세요. 안거나 흔들어 재우면 밤에 깼을 때 다시 잠들기 어려울 수 있어요. 잠은 늘 바로 눕혀요.","warn":null,"src":["https://www.nhs.uk/start-for-life/baby/baby-basics/newborn-and-baby-sleeping-advice-for-parents/helping-your-baby-sleep/","https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/getting-your-baby-to-sleep.aspx"]},{"q":"눈이 몰려 보여요","a":"갓난아기 때는 눈이 가끔 어긋나 보이는 일이 흔해요. 다만 4개월이 지나서도 눈이 자주 안쪽으로 몰리거나 바깥으로 벗어나면 정상이 아닐 수 있으니 검진 때 꼭 말씀해 주세요.","warn":"눈동자가 하얗거나 회색빛으로 보이거나, 눈이 빠르게 떨리면 소아청소년과 진료를 받아요","src":["https://www.healthychildren.org/English/health-issues/conditions/eyes/Pages/Warning-Signs-of-Vison-Problems-in-Children.aspx"]}]},{"m":5,"tips":[{"q":"자다가 엎드려 있어요","a":"깜짝 놀라셨죠. 재울 땐 늘 바로 눕히는 게 원칙이에요. 엎드렸다 바로 눕기까지 양쪽으로 스스로 뒤집는 아기라면 계속 돌려 놓지 않아도 돼요. 대신 침대엔 판판한 매트와 시트만 두고, 뒤집으려 하면 속싸개는 그만해요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/a-parents-guide-to-safe-sleep.aspx"]},{"q":"할머니만 봐도 울어요","a":"서운하실 수 있지만, 낯익은 사람과 낯선 사람을 처음으로 구분하게 됐다는 자연스러운 신호예요. 익숙한 가족에게도 울 수 있어요. 어른들께 서두르지 말고 천천히 다가와 달라고 부탁하고, 엄마·아빠 품에서 지켜보게 해 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Emotional-and-Social-Development-8-12-Months.aspx"]},{"q":"물 먹여도 돼요?","a":"모유만 먹는 아기는 이유식을 시작하기 전까지 물이 따로 필요 없어요. 더운 날엔 평소보다 자주 물려 주면 돼요. 분유 먹는 아기는 더운 날 끓여 식힌 물을 조금씩 줄 수 있고, 6개월부터는 식사 때 컵으로 몇 모금씩 줘요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/drinks-and-cups-for-babies-and-young-children/"]},{"q":"아직 못 뒤집어요","a":"뒤집는 시기는 아기마다 꽤 달라요. 보통 엎드린 상태에서 바로 눕는 쪽을 먼저 하고, 7개월 무렵까지 양쪽으로 뒤집게 돼요. 깨어 있을 때 엎드려 놀게 하고, 좋아하는 장난감을 눈앞에서 보여 주며 고개와 팔에 힘을 쓰게 해 보세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Movement-4-to-7-Months.aspx"]},{"q":"뒤통수 머리가 빠져요","a":"3~6개월 아기에게 흔한 일이에요. 누워서 고개를 이리저리 돌리다 매트에 쓸려 빠진 거라, 앉기 시작하면 다시 자라요. 다 자라기까지 몇 달 걸릴 수 있으니 느긋하게 기다려 주세요.","warn":"앉기 시작하고 6개월이 지나도 머리가 안 나면 소아청소년과에 가 봐요","src":["https://www.healthychildren.org/English/tips-tools/symptom-checker/Pages/symptomviewer.aspx?symptom=Hair+Loss"]}]},{"m":6,"tips":[{"q":"이유식을 안 먹어요","a":"처음엔 뱉고 인상 쓰는 게 당연해요. 싫어서라기보다 새 맛과 질감에 적응하는 중이에요. 억지로 먹이지 말고 다른 날 다시 줘 보세요. 한 끼보다 일주일 단위로 보고, 가족이 먹는 자리에 함께 앉히면 보고 배워요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/help-your-baby-enjoy-new-foods/"]},{"q":"이 나느라 보채요","a":"잇몸이 근질거려 침을 흘리고 뭐든 씹으려 해요. 손을 씻고 잇몸을 살살 문질러 주거나, 차갑게 한 젖은 가제 수건이나 고무 치발기를 쥐여 주세요. 꽁꽁 언 것과 호박·나무 치아 목걸이는 질식 위험이 있어 피해요.","warn":"이가 날 때는 열이 나지 않아요. 열이 나거나 설사가 하루 넘게 가면 다른 병일 수 있으니 소아청소년과에 가요","src":["https://www.healthychildren.org/English/ages-stages/baby/teething-tooth-care/Pages/Teething-Pain.aspx"]},{"q":"먹고 두드러기가 났어요","a":"놀라셨죠. 새 재료는 한 번에 한 가지씩, 조금만 줘야 무엇 때문인지 알 수 있어요. 반응은 보통 몇 분에서 2시간 안에 나타나요. 두드러기나 입술 붓기, 구토가 있었다면 사진을 찍어 두고, 그 재료를 다시 주기 전에 진료 때 상의해요.","warn":"숨쉬기 힘들어하거나 혀·목이 붓고 축 처지면 바로 119를 불러요","src":["https://www.nhs.uk/baby/weaning-and-feeding/food-allergies-in-babies-and-young-children/","https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Food-Allergies-in-Children.aspx"]},{"q":"이유식 후 변이 딱딱해요","a":"새 음식을 소화하느라 변이 단단해지는 일이 흔해요. 사과·배·자두처럼 섬유질 많은 과일을 이유식에 넣어 보세요. 등을 대고 눕혀 다리를 자전거 타듯 움직이거나, 배를 살살 문질러 줘도 좋아요.","warn":"며칠 해 봐도 나아지지 않거나 아기가 아파 보이면 소아청소년과에 가요","src":["https://www.nhs.uk/best-start-in-life/baby/feeding-your-baby/breastfeeding/breastfeeding-challenges/constipation/"]},{"q":"먹다가 웩웩해요","a":"구역질은 새 질감을 배우면서 생기는 정상 반사예요. 웩웩 소리를 내고 얼굴이 빨개져도 스스로 밀어내도록 차분히 지켜봐 주세요. 먹을 땐 늘 곁에 있고, 똑바로 앉혀서 먹여요.","warn":"소리를 못 내고 숨을 못 쉬거나 입술이 파래지면 질식이에요. 바로 119를 부르고 등 두드리기 응급처치를 해요","src":["https://cambspborochildrenshealth.nhs.uk/feeding-and-eating/weaning-and-introducing-solid-foods/choking-and-gagging-on-food/","https://www.nhs.uk/baby/weaning-and-feeding/babys-first-solid-foods/"]}]},{"m":7,"tips":[{"q":"엄마만 찾아 울어요","a":"애착이 잘 자라고 있다는 뜻이라 너무 걱정 마세요. 외출은 아기가 자고 먹은 뒤로 잡고, 인사는 짧게 하고 떠나는 게 오히려 나아요. 집에서 잠깐씩 다른 방에 가서 달려가는 대신 목소리로 불러 주는 연습도 도움이 돼요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Emotional-and-Social-Development-8-12-Months.aspx"]},{"q":"밤중 수유 끊어야 해요?","a":"정해진 때는 없어요. 6개월~돌 사이엔 밤중 수유가 더 필요 없는 아기도 있지만, 배고프거나 이가 나서 깨는 아기도 있어요. 밤엔 불을 어둡게 하고 조용히 먹인 뒤 바로 눕혀서, 밤은 자는 시간이라는 걸 알려 주세요.","warn":null,"src":["https://www.nhs.uk/baby/caring-for-a-newborn/helping-your-baby-to-sleep/"]},{"q":"콧물·기침 감기에 걸렸어요","a":"첫 감기는 보는 부모가 더 힘들죠. 콧물은 1~2주, 기침은 2~3주까지 갈 수 있어요. 식염수를 코에 넣고 수유 전에 빼 주면 먹기가 편해져요. 모유·분유를 자주 먹이고, 방이 건조하면 가습기를 써요.","warn":"숨쉴 때 갈비뼈 사이가 쑥쑥 들어가거나 쌕쌕거리며 숨이 가빠지면, 또 먹는 양이 평소 절반 아래로 줄면 소아청소년과에 바로 가요","src":["https://www.healthychildren.org/English/tips-tools/symptom-checker/Pages/symptomviewer.aspx?symptom=Colds+%280-12+Months%29"]},{"q":"설사를 해요","a":"물 같은 변을 자주 보면 무엇보다 탈수가 걱정이에요. 모유는 평소처럼 계속 먹이고, 분유 먹는 아기는 진료 때 수분 보충 방법을 안내받아요. 기저귀가 평소보다 덜 젖지 않는지 꼭 살펴봐 주세요.","warn":"기저귀가 하루 6장보다 적게 젖거나, 울 때 눈물이 적고 입이 마르거나, 숨구멍이 꺼져 보이면, 또 변에 피가 섞이거나 열이 나면 소아청소년과에 바로 가요","src":["https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Diarrhea-in-Babies.aspx","https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/dehydration.aspx"]},{"q":"배밀이를 안 해요","a":"기는 건 보통 7~10개월 사이에 익혀요. 엉덩이로 밀거나 배로 미끄러지듯 가는 아기, 기기를 건너뛰는 아기도 있어요. 팔다리를 양쪽 고르게 쓰면 괜찮아요. 장난감을 손 닿을 듯 말 듯한 곳에 두면 움직이고 싶어 해요.","warn":"한쪽 팔다리만 쓰는 것처럼 보이면 소아청소년과에서 상담해요","src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Movement-8-to-12-Months.aspx"]}]},{"m":8,"tips":[{"q":"뭐든 입에 넣어요","a":"입으로 세상을 알아 가는 시기라 막을 수는 없어요. 대신 소파 쿠션 사이와 가구 밑을 자주 살펴 동전·단추형 전지 같은 작은 물건을 치우고, 작은 부품이 떨어지는 장난감은 피해요. 장난감은 포장의 사용 연령을 확인해요.","warn":"단추형 전지는 삼키면 몸속에 화상을 입혀요. 삼킨 것 같으면 바로 응급실에 가요","src":["https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/Choking-Prevention.aspx"]},{"q":"침대에서 떨어졌어요","a":"많이 놀라셨죠. 먼저 꼭 안아 달래고, 부딪힌 곳은 수건에 싼 얼음팩으로 잠깐씩 식혀 주세요. 증상이 늦게 나타날 수 있어서, 하루는 어른이 곁에서 평소처럼 먹고 노는지 지켜봐 주세요.","warn":"돌 전 아기 머리에 멍·혹·상처가 생겼거나, 토를 반복하거나, 달래도 계속 울거나, 먹지 않거나, 유난히 처져 잘 안 깨면 바로 응급실에 가요","src":["https://www.nhs.uk/conditions/head-injury-and-concussion/","https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/concussions-in-babies-what-to-do-if-your-infant-or-toddler-hits-their-head.aspx"]},{"q":"손으로 먹으려 해요","a":"스스로 먹고 싶다는 좋은 신호예요. 푹 익힌 채소나 부드러운 과일을 주먹에 쥐면 조금 삐져나올 만큼, 어른 손가락 크기로 잘라 줘 보세요. 포도·방울토마토처럼 작고 동그란 건 4등분하고, 먹는 동안엔 꼭 곁에 있어요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/babys-first-solid-foods/","https://www.nhs.uk/start-for-life/baby/weaning/what-to-feed-your-baby/7-to-9-months/"]},{"q":"잡고 서서 못 앉아 울어요","a":"일어서는 법을 먼저 익히고 내려오는 법은 아직 몰라서 생기는 일이에요. 울 때마다 앉혀 주기만 하기보다, 무릎을 굽혀 엉덩이를 천천히 내리는 걸 손으로 함께 해 보여 주세요. 계단에는 위아래로 안전문을 달아요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Movement-8-to-12-Months.aspx"]},{"q":"꿀 먹여도 돼요?","a":"꿀은 돌이 지나서부터 줘요. 꿀에 드물게 든 균이 아기 장 속에서 독소를 만들어 '영아 보툴리누스증'이라는 심한 병을 일으킬 수 있어서예요. 조금이라도 돌 전엔 주지 않아요.","warn":"꿀을 먹은 뒤 변비와 함께 잘 못 빨고, 울음이 약해지고, 몸이 축 처지면 소아청소년과에 바로 가요","src":["https://www.nhs.uk/baby/weaning-and-feeding/foods-to-avoid-giving-babies-and-young-children/","https://www.healthychildren.org/English/health-issues/conditions/infections/Pages/Botulism.aspx"]}]},{"m":9,"tips":[{"q":"음식을 자꾸 던져요","a":"떨어뜨리고 던지면서 물건이 어떻게 되는지 알아보는 시기라 자연스러운 모습이에요. 크게 반응하기보다 '음식은 식탁에' 하고 짧게 말해 주세요. 그래도 계속 던지면 배가 찼다는 신호일 수 있으니 식사를 마무리해요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Cognitive-Development-8-to-12-Months.aspx","https://www.healthychildren.org/English/ages-stages/baby/Pages/Developmental-Milestones-12-Months.aspx","https://www.cuh.nhs.uk/patient-information/mealtime-routines/"]},{"q":"'안 돼'를 어떻게 알려줘요?","a":"알아들어도 또 만지는 게 이 시기 아기예요. '안 돼'는 위험한 일에만 아껴 쓰고, 위험한 물건은 미리 손 닿지 않게 치워 두세요. 대신 놀아도 되는 물건으로 바꿔 주는 게 가장 잘 통해요. 때리는 건 어떤 경우에도 하지 않아요.","warn":null,"src":["https://www.healthychildren.org/English/family-life/family-dynamics/communication-discipline/Pages/Disciplining-Your-Child.aspx","https://www.healthychildren.org/English/ages-stages/baby/Pages/Emotional-and-Social-Development-8-12-Months.aspx"]},{"q":"컵으로 마시는 연습, 해야 해요?","a":"이유식을 시작했다면 식사 때 컵으로 물 몇 모금씩 연습해 봐요. 처음엔 흘리는 게 당연해요. 평소 먹던 모유나 분유를 담아 주면 더 쉽게 받아들이고, 밸브 없는 열린 컵이 홀짝이는 연습과 치아에 좋아요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/drinks-and-cups-for-babies-and-young-children/","https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Discontinuing-the-Bottle.aspx"]},{"q":"고기 꼭 먹여야 해요?","a":"자라는 아기에게 철분은 꼭 필요하고, 고기·생선의 철분이 몸에 더 잘 흡수돼요. 그래서 이유식에 고기를 자주 넣어 주면 좋아요. 고기를 잘 안 먹는다면 달걀, 콩·두부, 초록 잎채소처럼 철분 있는 음식을 골고루 챙겨 주세요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/what-to-feed-young-children/","https://www.nhs.uk/best-start-in-life/baby/weaning/what-to-feed-your-baby/from-around-6-months/"]},{"q":"이 닦아 줘야 해요?","a":"첫니가 보이면 바로 닦기 시작해요. 아기 칫솔에 불소 치약을 쌀알만큼 아주 조금 묻혀서 하루 두 번, 자기 전에는 꼭 닦아 주세요. 닦은 뒤 물로 헹구지 않아도 괜찮아요.","warn":null,"src":["https://www.nhs.uk/baby/babys-development/teething/looking-after-your-babys-teeth/","https://www.healthychildren.org/English/healthy-living/oral-health/Pages/FAQ-Fluoride-and-Children.aspx"]}]},{"m":10,"tips":[{"q":"자꾸 깨물어요","a":"어린아이가 가끔 깨물고 때리는 건 흔한 일이고, 커서 거친 아이가 된다는 뜻은 아니에요. 같이 깨물거나 때리지 말고, 차분하게 '아파, 깨무는 건 안 돼' 하고 분명히 알려 준 뒤 다른 놀이로 관심을 돌려 주세요.","warn":null,"src":["https://www.nhs.uk/baby/babys-development/behaviour/temper-tantrums/","https://www.healthychildren.org/English/ages-stages/toddler/Pages/Aggressive-Behavior.aspx"]},{"q":"뜻대로 안 되면 드러누워요","a":"하고 싶은 걸 말로 못 하니 답답한 마음이 울음과 떼로 나와요. 다치지 않게 곁을 지키며 차분하게 기다리고, 일찍 다른 데로 관심을 돌려 보세요. 떼를 멈추려고 '안 돼'를 바꾸면 떼가 통한다고 배우게 돼요.","warn":null,"src":["https://www.nhs.uk/baby/babys-development/behaviour/temper-tantrums/"]},{"q":"먹던 것만 먹으려 해요","a":"어제 잘 먹던 걸 오늘 밀어내는 일도 흔해요. 억지로 먹이지 말고, 새 음식은 익숙한 음식 옆에 조금씩 여러 번 내 주세요. 함께 먹는 모습을 보여 주는 것도 좋아요. 잘 놀고 몸무게가 늘고 있다면 충분히 먹고 있는 거예요.","warn":null,"src":["https://www.nhs.uk/baby/weaning-and-feeding/fussy-eaters/","https://www.healthychildren.org/English/ages-stages/toddler/nutrition/Pages/Picky-Eaters.aspx"]},{"q":"뭘 삼킨 것 같아요","a":"뭐든 입에 넣는 때라 놀라는 일이 잦아요. 작고 매끈한 물건은 대개 탈 없이 지나가지만, 무엇을 삼켰는지가 중요해요. 단추형 건전지나 자석은 겉으로 멀쩡해 보여도 급하니 지켜보지 말고 바로 움직여요.","warn":"단추형 건전지·자석·뾰족한 것을 삼켰거나, 침을 흘리고 잘 못 삼키거나 토하면 바로 응급실에 가요. 숨쉬기 힘들어하면 119에 전화해요.","src":["https://www.healthychildren.org/English/tips-tools/Symptom-Checker/Pages/symptomviewer.aspx?symptom=Swallowed+Foreign+Object","https://www.nhs.uk/baby/first-aid-and-safety/first-aid/what-to-do-if-your-child-has-an-accident/","https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=32299","https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=32320"]},{"q":"신발 신겨야 해요?","a":"집 안에서는 맨발이나 양말이면 충분해요. 밖에서 걷기 시작하면 발을 보호하도록 편하고 잘 구부러지는, 미끄럼 방지 밑창 신발을 골라 주세요. 발이 금방 자라니 끼지 않는지 자주 확인해요. 꽉 끼는 신발은 차라리 안 신는 게 나아요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/toddler/Pages/Shoes-for-Active-Toddlers.aspx","https://www.healthychildren.org/English/ages-stages/baby/Pages/Movement-8-to-12-Months.aspx"]}]},{"m":11,"tips":[{"q":"아직 혼자 못 걸어요","a":"첫걸음은 돌 무렵에 많이 떼지만, 더 늦게 걷는 아기도 많아요. 잡고 서고 가구를 잡고 옆으로 걷는 것도 잘 크고 있다는 신호예요. 보행기 대신 튼튼한 가구나 밀고 노는 장난감으로 맘껏 연습하게 해 주세요.","warn":"잡아 줘도 서지 못하거나 한쪽 몸을 끌며 기거나, 18개월이 돼도 걸으려는 기미가 없으면 소아청소년과에 상담해요.","src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Movement-8-to-12-Months.aspx","https://www.healthychildren.org/English/ages-stages/baby/Pages/Developmental-Milestones-12-Months.aspx","https://www.whittington.nhs.uk/default.asp?c=46649"]},{"q":"젖병은 언제 끊어요?","a":"컵을 쓰기 시작했다면 젖병은 천천히 줄여서 12~18개월 사이에 마무리하면 돼요. 식사 때 것은 남겨 두고 낮잠·잠자리 젖병부터 하나씩 빼 보세요. 그 자리는 안아 주기나 책 읽기 같은 새 잠자리 의식으로 채워 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Discontinuing-the-Bottle.aspx","https://www.nhs.uk/baby/weaning-and-feeding/drinks-and-cups-for-babies-and-young-children/"]},{"q":"생우유는 언제부터요?","a":"생우유는 돌이 지나야 주된 음료로 바꿀 수 있어요. 그 전까지는 모유나 분유가 기본이에요. 돌~두 돌 사이엔 일반 우유를 권하고, 성장기용 분유는 따로 필요하지 않아요. 바꿀 땐 젖병 말고 컵에 담아 주세요.","warn":null,"src":["https://www.nhs.uk/best-start-in-life/baby/weaning/what-to-feed-your-baby/from-around-6-months/","https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Recommended-Drinks-for-Young-Children-Ages-0-5.aspx","https://www.nhs.uk/baby/weaning-and-feeding/drinks-and-cups-for-babies-and-young-children/"]},{"q":"다리가 휘어 보여요","a":"두 돌 무렵까지는 다리가 O자로 휘어 보이는 아기가 많아요. 대부분 자라면서 저절로 펴지니 너무 걱정하지 않아도 돼요. 교정 신발이나 보조기는 거의 도움이 안 되니 따로 살 필요 없어요.","warn":"한쪽 다리만 휘었거나, 휜 정도가 아주 심하거나, 두 돌이 지나 더 심해지면 소아청소년과에 상담해요.","src":["https://www.healthychildren.org/English/health-issues/conditions/orthopedic/Pages/Bowlegs-and-Knock-Knees.aspx","https://www.nhs.uk/conditions/baby/health/leg-and-foot-problems-in-children/"]},{"q":"애착 인형, 같이 재워도 돼요?","a":"8~12개월 사이에 아끼는 담요나 인형이 생기는 경우가 많아요. 마음을 달래는 건강한 방법이니 말리지 않아도 돼요. 다만 돌 전에는 잠자리에 인형·이불을 넣지 말고, 잠들기 전 의식에서만 함께해 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/baby/Pages/Transitional-Objects.aspx","https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/Preventing-SIDS.aspx"]}]},{"m":12,"tips":[{"q":"열나다가 경련했어요","a":"열이 오를 때 생기는 경련은 6개월~6살 사이에 생길 수 있어요. 보기엔 무섭지만 대개 아이에게 해를 남기지 않아요. 주변 물건을 치우고 머리를 받쳐 주되, 억지로 붙잡거나 입에 아무것도 넣지 마세요. 시작한 시각을 기억해 두세요.","warn":"처음 경련했거나 5분 넘게 이어지면 바로 119에 전화해요.","src":["https://www.nhs.uk/conditions/febrile-seizures/"]},{"q":"돌 지나고 밥을 덜 먹어요","a":"돌이 지나면 크는 속도가 느려져서 먹는 양이 확 줄어드는 게 자연스러워요. 하루하루보다 며칠 단위로 보면 골고루 맞춰져요. 억지로 먹이지 말고, 하루 세 끼와 간식 두 번을 규칙적으로 내 주세요.","warn":null,"src":["https://www.healthychildren.org/English/ages-stages/toddler/nutrition/Pages/Feeding-and-Nutrition-Your-One-Year-Old.aspx"]},{"q":"말이 늦은 것 같아요","a":"돌 무렵엔 단어 한두 개, 이름 부르면 돌아보기, 원하는 걸 손가락으로 가리키기가 나타나요. 아기가 가리키는 걸 같이 보며 이름을 말해 주고, 책을 읽을 땐 동물·자동차 소리를 흉내 내 주세요.","warn":"이름을 불러도 거의 반응이 없거나, 무언가를 가리키지 않거나, 하던 말·행동을 못 하게 되면 소아청소년과에 상담해요.","src":["https://www.healthychildren.org/English/ages-stages/toddler/Pages/language-delay.aspx","https://www.healthychildren.org/English/ages-stages/baby/Pages/Developmental-Milestones-12-Months.aspx","https://www.childcare.go.kr/?menuno=452"]},{"q":"주스 줘도 돼요?","a":"주스는 꼭 먹이지 않아도 돼요. 같은 과일이라도 통째로 먹는 게 더 좋아요. 준다면 물에 타서 식사 때만 조금 주고, 젖병에 담아 주면 충치가 생기기 쉬워요. 평소 마실 건 물과 우유면 충분해요.","warn":null,"src":["https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Recommended-Drinks-for-Young-Children-Ages-0-5.aspx","https://www.nhs.uk/baby/weaning-and-feeding/drinks-and-cups-for-babies-and-young-children/","https://www.nhs.uk/baby/babys-development/teething/looking-after-your-babys-teeth/"]},{"q":"영상 보여줘도 돼요?","a":"18개월 전 아기는 화면보다 사람과 직접 주고받으며 배워요. 혼자 오래 보는 건 말과 사회성 발달에 방해가 될 수 있어요. 멀리 사는 가족과 영상통화는 괜찮고, 아무도 안 보는 TV는 꺼 두는 게 좋아요.","warn":null,"src":["https://www.healthychildren.org/English/family-life/Media/Pages/helping-kids-thrive-in-a-digital-world-AAP-policy-explained.aspx","https://www.healthychildren.org/English/family-life/Media/Pages/infants-and-screen-time-5-cs-questions-to-ask.aspx"]}]}]/*END*/;   // 개월별 자주 하는 고민 — 원본 고민모음-0-12개월.json (10-12)

$('copy-code').onclick = async () => {
  try { await navigator.clipboard.writeText(baby.invite_code); toast(`코드 ${baby.invite_code} 복사했어요`); }
  catch (_) { prompt('초대 코드를 복사하세요', baby.invite_code); }
};
$('leave-baby').onclick = async () => {
  const others = Object.keys(nickById).filter(id => id !== me.id).length;
  const sole = baby.created_by === me.id && others === 0;
  const msg = sole ? `"${baby.name}" 기록표를 통째로 지우고 나갈까요? 기록 ${logs.length}건도 같이 지워져요.` : `"${baby.name}" 기록표에서 나갈까요? 기록은 남고, 초대 코드로 다시 들어올 수 있어요.`;
  if (!confirm(msg)) return;
  if (MOCK) { toast('(미리보기) 나갔어요'); return; }
  try {
    if (sole) { const { error } = await sb.from('babies').delete().eq('id', baby.id); if (error) throw error; }
    else { const { error } = await sb.from('baby_members').delete().eq('baby_id', baby.id).eq('user_id', me.id); if (error) throw error; }
    if (channel) { sb.removeChannel(channel); channel = null; }
    baby = null; logs = []; notes = []; nickById = {}; avatarById = {};
    show('s-setup'); stepBaby(); toast('나왔어요');
  } catch (e) { alert('나가기 실패: ' + e.message); }
};
$('reload-app').onclick = async () => {   // 캐시 무시하고 최신 판 받기: SW 해제 + 캐시 비우고 새 주소로 다시 열기
  toast('새로 불러오는 중…');
  try { if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (_) {}
  setTimeout(() => location.replace(location.pathname + '?r=' + Date.now()), 300);
};
$('logout').onclick = async () => { if (MOCK) return; await sb.auth.signOut(); location.reload(); };

// ── 로그인·설정 흐름
$('kakao-login').onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'kakao', options: { redirectTo: SITE } });
  if (error) alert('카카오 로그인 시작 실패: ' + error.message);
};
$('nick-save').onclick = async () => {
  const n = $('nick').value.trim().slice(0, 12); if (!n) return;
  const { data: taken } = await sb.from('profiles').select('id').eq('nickname', n).neq('id', me.id);
  if (taken && taken.length) { $('nick-msg').textContent = '이미 쓰고 있는 이름이에요'; return; }
  const { error } = await sb.from('profiles').upsert({ id: me.id, nickname: n });
  if (error) { $('nick-msg').textContent = '저장 실패: ' + error.message; return; }
  me.nickname = n; stepBaby();
};
function stepBaby() { $('setup-nick').classList.add('hidden'); $('setup-baby').classList.remove('hidden'); }
const genCode = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
$('baby-create').onclick = async () => {
  const name = $('baby-name').value.trim(), birth = $('baby-birth').value;
  if (!name || !birth) { $('baby-msg').textContent = '이름과 생년월일을 적어주세요'; return; }
  if ($('baby-create').disabled) return; $('baby-create').disabled = true; setTimeout(() => $('baby-create').disabled = false, 4000);   // 두 번 눌러 기록표가 둘 생기는 것 방지 (09-27 실측)
  const { data, error } = await sb.from('babies').insert({ name, birth_date: birth, invite_code: genCode(), created_by: me.id }).select().single();
  if (error) { $('baby-msg').textContent = '만들기 실패: ' + error.message; return; }
  const { error: e2 } = await sb.from('baby_members').insert({ baby_id: data.id, user_id: me.id, avatar_url: 'char:dad' });
  if (e2) { $('baby-msg').textContent = '등록 실패: ' + e2.message; return; }
  baby = data;
  if (setupPhoto) { try { const url = await uploadPhoto(setupPhoto, baby.id); await db.updBaby({ photo_url: url }); } catch (e) { toast('사진은 나중에 설정에서 다시 올려주세요'); } }
  await enterHome();
};
$('join-go').onclick = async () => {
  const code = $('join-code').value.trim().toUpperCase(); if (code.length < 6) { $('join-msg').textContent = '6자리 코드를 적어주세요'; return; }
  if ($('join-go').disabled) return; $('join-go').disabled = true; setTimeout(() => $('join-go').disabled = false, 4000);
  const { data, error } = await sb.rpc('join_baby', { code, avatar: 'char:mom' });
  if (error) { $('join-msg').textContent = error.message.replace(/^.*?: /, ''); return; }
  const { data: b } = await sb.from('babies').select('*').eq('id', data).single();
  baby = b; await enterHome();
};
async function enterHome() { await db.loadAll(); lastSync = Date.now(); subscribe(); day = dstr(new Date()); show('s-home'); render(); }

async function boot() {
  if (MOCK) { mock(); show('s-home'); render(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('s-login'); return; }
  const u = session.user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  me = { id: u.id, nickname: profile?.nickname || '', avatar: u.user_metadata?.avatar_url || u.user_metadata?.picture || '' };
  const { data: mem } = await sb.from('baby_members').select('baby_id').eq('user_id', u.id).limit(1);
  if (mem && mem.length) { const { data: b } = await sb.from('babies').select('*').eq('id', mem[0].baby_id).single(); baby = b; await enterHome(); return; }
  show('s-setup');
  if (me.nickname) stepBaby(); else $('nick').value = u.user_metadata?.name || u.user_metadata?.full_name || '';
}
if (!MOCK) sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !me) boot(); });
if (!MOCK && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ── 로컬 확인용 가짜 데이터 (?mock=1)
function mock() {
  me = { id: 'u-dad', nickname: '아빠' }; nickById = { 'u-dad': '아빠', 'u-mom': '엄마' };
  avatarById = {};   // 사진 없음 → 기본 캐릭터(미지 2R 채택본)
  baby = { id: 'b1', name: '콩이', birth_date: '2026-09-15', invite_code: 'K7M2PQ', created_by: 'u-dad' };
  const T = (h, m, dayOff = 0) => { const d = new Date(); d.setDate(d.getDate() + dayOff); d.setHours(h, m, 0, 0); return d.toISOString(); };
  logs = [
    { id: 'a1', kind: 'feed', at: T(0, 40), detail: { type: 'formula', ml: 60 }, note: '', user_id: 'u-dad' },
    { id: 'a2', kind: 'diaper', at: T(0, 55), detail: { pee: true, poo: false }, note: '', user_id: 'u-dad' },
    { id: 'a3', kind: 'sleep', at: T(1, 10), ended_at: T(3, 30), detail: {}, note: '', user_id: 'u-dad' },
    { id: 'a4', kind: 'feed', at: T(3, 40), detail: { type: 'breast', min: 20 }, note: '트림 안 시킴', user_id: 'u-mom' },
    { id: 'a5', kind: 'diaper', at: T(3, 55), detail: { pee: true, poo: true }, note: '', user_id: 'u-mom' },
    { id: 'a6', kind: 'sleep', at: T(4, 10), ended_at: T(6, 50), detail: {}, note: '', user_id: 'u-mom' },
    { id: 'a7', kind: 'feed', at: T(7, 0), detail: { type: 'formula', ml: 80 }, note: '', user_id: 'u-mom' },
    { id: 'a8', kind: 'temp', at: T(7, 20), detail: { c: 36.9 }, note: '', user_id: 'u-mom' },
    { id: 'a9', kind: 'diaper', at: T(9, 15), detail: { pee: true, poo: false }, note: '', user_id: 'u-dad' },
    { id: 'a10', kind: 'feed', at: T(10, 10), detail: { type: 'formula', ml: 80 }, note: '조금 남김', user_id: 'u-dad' },
    { id: 'a11', kind: 'sleep', at: T(10, 40), ended_at: null, detail: {}, note: '', user_id: 'u-dad' },
  ].filter(l => new Date(l.at) <= Date.now() || true);
  for (let off = 1; off <= 9; off++) for (const [h, k, d] of [[1, 'feed', { type: 'formula', ml: 40 + off * 5 }], [4, 'diaper', { pee: true, poo: off % 3 === 0 }], [5, 'feed', { type: 'formula', ml: 60 }], [9, 'diaper', { pee: true }], [12, 'feed', { type: 'breast', min: 15 }], [18, 'feed', { type: 'formula', ml: 70 }]])
    logs.push({ id: `p${off}-${h}`, kind: k, at: T(h, 0, -off), detail: d, note: '', user_id: off % 2 ? 'u-dad' : 'u-mom' });
  for (let off = 1; off <= 9; off++) logs.push({ id: `s${off}`, kind: 'sleep', at: T(22, 0, -off - 1), ended_at: T(3, 30, -off), detail: {}, note: '', user_id: 'u-mom' });
  const gd = off => { const d = new Date(); d.setDate(d.getDate() - off); return dstr(d); };
  checks = { hepb1: { item: 'hepb1', done_on: '2026-09-15', note: '출산 병원', user_id: 'u-mom' } };
  growth = [
    { id: 'g1', day: '2026-09-15', weight_kg: 3.28, length_cm: 50.2, head_cm: 34.1, note: '출생 (병원)', user_id: 'u-dad' },
    { id: 'g2', day: '2026-09-18', weight_kg: 3.12, length_cm: null, head_cm: null, note: '조리원', user_id: 'u-mom' },
    { id: 'g3', day: '2026-09-22', weight_kg: 3.41, length_cm: null, head_cm: null, note: '조리원', user_id: 'u-mom' },
    { id: 'g4', day: gd(0), weight_kg: 3.86, length_cm: 52.4, head_cm: 35.9, note: '소아과', user_id: 'u-dad' },
  ];
  notes = [
    { id: 'n1', day: dstr(new Date()), user_id: 'u-mom', text: '새벽 두 번 봐줘서 고마워. 오후엔 내가 볼게', created_at: T(7, 25) },
  ];
}
boot();
</script>
