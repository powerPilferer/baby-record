<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>기특일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180-bottle.png">
<script>(function(){var p=localStorage.getItem("bb-theme")||"system";document.documentElement.dataset.theme=(p==="light"||(p==="system"&&matchMedia("(prefers-color-scheme: light)").matches))?"light":"dark";})();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0b0b0d; --card: #151518; --card2: #1d1d22; --line: #222228;
    --line2: #19191d; --fg: #f1f1f4; --fg2: #8f8f99; --fg3: #55555e;
    --feed: #6f9ee0; --diaper: #cfae63; --sleep: #9d93d6; --temp: #d98079; --ok: #7fc39c;
    --kakao: #fee500;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  :root { --bg1: #101013; --dim: rgba(0,0,0,.6); color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f4f6; --bg1: #ececef; --card: #ffffff; --card2: #eeeef1; --line: #e4e4e9; --line2: #ededf1;
    --fg: #1b1b1f; --fg2: #6b6b75; --fg3: #9a9aa3;
    --feed: #3b7bd4; --diaper: #b3841f; --sleep: #7565cf; --temp: #d4554d; --ok: #2f9e63;
    --dim: rgba(0,0,0,.35); color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; font-size: 17px; line-height: 1.35;
    letter-spacing: -.015em; }
  body { padding-top: var(--sat); min-height: 100dvh; overscroll-behavior-y: none; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }   /* 빠른 두 번 탭이 확대로 먹히지 않게 */
  html, body, * { touch-action: manipulation; }
  .hidden { display: none !important; }
  .screen { max-width: 480px; margin: 0 auto; padding: 0 16px calc(28px + var(--sab)); }

  /* ── 로그인 / 첫 설정 ── */
  .onb { padding: 14vh 0 40px; max-width: 360px; margin: 0 auto; }
  #s-login .onb { text-align: center; padding-top: 18vh; }
  .onb h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.03em; }
  .onb > p, .onb > div > p:not(.msg) { color: var(--fg2); font-size: 15px; margin: 0 0 22px; }
  .family { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .family img { width: 76px; height: 76px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg); position: relative; }
  .family img:nth-child(1) { margin-right: -18px; z-index: 1; }
  .family img.baby { z-index: 3; }
  .family img:nth-child(3) { margin-left: -18px; z-index: 2; }
  #kakao-login { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 15px; border-radius: 999px; background: var(--kakao); color: #191600; font-weight: 700; font-size: 17px; }
  .foot { color: var(--fg3); font-size: 14px; margin-top: 14px; }
  .card { background: var(--card); border-radius: 16px; }
  .card.form { padding: 6px 16px 14px; }
  .card.form label { display: block; font-size: 13px; color: var(--fg3); font-weight: 500; margin: 12px 0 6px; }
  .card.form label small { color: var(--fg3); font-weight: 400; margin-left: 4px; }
  .card.form input { width: 100%; background: var(--card2); border: 0; border-radius: 10px; padding: 12px 14px; font-size: 17px; outline: none; color: var(--fg); }
  .card.form input:focus { box-shadow: 0 0 0 1.5px var(--fg3); }
  .card.form input[type=date] { font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; min-height: 46px; }
  .card.form input.code-in { font-family: ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; font-size: 19px; }
  .photo-pick { display: flex; align-items: center; gap: 12px; }
  .photo-pick .pv { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--card2); }
  .pbtn { padding: 8px 14px; border-radius: 999px; background: var(--card2); color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pbtn.ghost { background: none; color: var(--fg2); }
  .card.form label.pbtn { display: inline-block; margin: 0; font-size: 14px; color: var(--fg); font-weight: 600; }
  header .who { cursor: pointer; border-radius: 999px; }
  header .who:active { opacity: .7; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 17px; margin-top: 4px; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .btn:disabled { opacity: .4; }
  .or { color: var(--fg3); font-size: 14px; margin: 26px 0 8px; text-align: center; }
  .msg { color: var(--temp); font-size: 14px; min-height: 18px; margin: 8px 2px; }

  /* ── 홈 ── */
  header { display: flex; align-items: center; justify-content: space-between; height: 46px; margin: 12px 0 10px; padding: 0; }
  header .who { display: flex; align-items: center; }
  #s-home header .who { position: fixed; top: calc(var(--sat) + 12px); left: 16px; z-index: 31; max-width: calc(100% - 94px); height: 46px; padding: 0 14px 0 6px; border-radius: 999px; background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  :root[data-theme="light"] #s-home header .who { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  #s-home header .bf { width: 34px; height: 34px; margin-right: 9px; }
  header .bf { width: 31px; height: 31px; border-radius: 50%; margin-right: 10px; }
  header .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  header .dday { color: var(--ok); font-size: 13px; margin-left: 8px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 14%, var(--bg)); font-variant-numeric: tabular-nums; }
  header .gear { width: 40px; height: 40px; margin-right: -8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg2); }
  header .gear svg { width: 25px; height: 25px; fill: currentColor; }
  header .gear:active { background: var(--card); }
  .daynav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 21px; }
  .daynav button { color: var(--fg2); width: 44px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .daynav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .daynav button:active { background: var(--card); }
  .daynav button:disabled { color: var(--fg3); opacity: .35; }
  .daynav .date { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .daynav .date small { color: var(--fg3); font-weight: 400; margin-left: 5px; font-size: 14px; }

  /* 간편 상태 두 칸 */
  .status { background: var(--bg1); border-radius: 14px; padding: 13px 15px; margin-bottom: 19px; display: flex; flex-direction: column; gap: 8px; }
  .status .chip { display: flex; align-items: center; gap: 10px; }
  .status .chip b { display: inline-flex; align-items: center; font-size: 13px; color: var(--c); font-weight: 500; flex: none; padding: 4px 9px; border-radius: 7px; background: color-mix(in srgb, var(--c) 14%, var(--bg1)); }
  .status .chip span { font-size: 15px; font-weight: 500; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .status .chip span small { color: var(--fg3); font-weight: 400; font-size: 13px; margin-left: 5px; }
  .status .chip.feed { --c: var(--feed); } .status .chip.sleep { --c: var(--sleep); }

  /* 카테고리 버튼 2×2 */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .quick button { --c: var(--fg); height: 70px; border-radius: 16px; background: var(--card); display: flex; align-items: center; padding: 0 15px; gap: 13px; position: relative; overflow: hidden; }
  .quick .ic { flex: none; width: 38px; height: 38px; border-radius: 11px; background: var(--card2); display: flex; align-items: center; justify-content: center; }
  .quick .ic img { width: 27px; height: 27px; object-fit: contain; display: block; }
  .quick .tx { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; text-align: left; }
  .quick button:active { background: var(--card2); }
  .quick .k { font-size: 16px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; }
  .quick .s { font-size: 13px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .quick .feed { --c: var(--feed); } .quick .diaper { --c: var(--diaper); } .quick .sleep { --c: var(--sleep); } .quick .temp { --c: var(--temp); }
  .quick .sleep.on { background: var(--card2); }
  .quick .sleep.on .s { color: var(--fg2); }
  .quick .sleep.on .ic { background: color-mix(in srgb, var(--sleep) 22%, var(--card2)); }

  /* 오늘의 표 */
  .sheet-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 9px; padding: 0 2px; }
  .sheet-title h2 { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 0; }
  .sheet-title span { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .vt { display: inline-flex; gap: 2px; background: var(--card); border-radius: 999px; padding: 3px; }
  .vt button { width: 44px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--fg3); }
  .vt button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vt button.on { background: var(--card2); color: var(--fg); }
  .clock { padding: 18px 12px 6px; }
  .clock svg { width: 100%; height: auto; display: block; }
  .clock .ck { cursor: pointer; }
  .clock .ck.feed { fill: var(--feed); } .clock .ck.diaper { fill: var(--diaper); } .clock .ck.temp { fill: var(--temp); }
  .clock .ck.sleep { fill: color-mix(in srgb, var(--sleep) 55%, var(--card)); } .clock .ck.sleep.open { fill: color-mix(in srgb, var(--sleep) 35%, var(--card)); }
  .clock .lg { display: flex; justify-content: center; gap: 6px; padding: 12px 0 6px; font-size: 13px; color: var(--fg2); }
  .clock .lg span { padding: 5px 10px; border-radius: 999px; background: var(--card2); }
  .clock .lg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }
  .clock .lg .feed { --c: var(--feed); } .clock .lg .diaper { --c: var(--diaper); } .clock .lg .sleep { --c: var(--sleep); } .clock .lg .temp { --c: var(--temp); }
  .rows { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 22px; }
  .row { --c: var(--fg2); display: grid; grid-template-columns: 52px 22px 1fr auto; gap: 0 8px; align-items: stretch; padding: 0 15px 0 13px; width: 100%; text-align: left; }
  .row:active { background: var(--card2); }
  .row.feed { --c: var(--feed); } .row.diaper { --c: var(--diaper); } .row.sleep { --c: var(--sleep); } .row.temp { --c: var(--temp); }
  .row .t { align-self: center; justify-self: start; padding: 4px 8px; border-radius: 7px; background: var(--card2); color: var(--fg2); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row.feed .t, .row.diaper .t, .row.sleep .t { background: color-mix(in srgb, var(--c) 14%, var(--card)); color: var(--c); }
  .row .rl { position: relative; }
  .row .rl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--line); }
  .row:first-child .rl::before { top: 50%; } .row.last .rl::before { bottom: 50%; }
  .row .rl::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--card); }
  .row .d { padding: 22px 0; border-top: 1px solid var(--line2); min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .row:first-child .d, .row:first-child .w { border-top: 0; }
  .row .d b { color: var(--fg); font-size: 15px; font-weight: 400; }
  .row .d small { color: var(--fg3); display: block; font-size: 13px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .w { border-top: 1px solid var(--line2); display: flex; align-items: center; margin-left: -8px; padding-left: 12px; }
  .av { width: 31px; height: 31px; border-radius: 50%; background: var(--card2); color: var(--fg2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { padding: 26px 14px; text-align: center; color: var(--fg3); font-size: 16px; }
  .sum { display: flex; gap: 14px; padding: 15px 16px; border-top: 1px solid var(--line); margin-top: 2px; font-size: 14px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .sum b { color: var(--fg2); font-weight: 500; }

  /* 서로에게 한마디 */
  .notes { background: var(--card); border-radius: 16px; padding: 15px 17px; }
  .notes h2 { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 0 0 8px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; }
  .note .who { flex: none; padding-top: 1px; }
  .note .tx { flex: 1; font-size: 16px; white-space: pre-wrap; }
  .note .nx { flex: none; width: 32px; height: 32px; border-radius: 50%; color: var(--fg3); font-size: 16px; margin: -6px -8px 0 0; }
  .note .nx:active { background: var(--card2); color: var(--temp); }
  .note .tm { font-size: 13px; color: var(--fg3); padding-top: 4px; font-variant-numeric: tabular-nums; }
    .noteform { display: flex; gap: 8px; margin-top: 8px; }
  .noteform input { flex: 1; min-width: 0; background: var(--bg); border: 0; border-radius: 999px; padding: 13px 17px; outline: none; }
  .noteform button { padding: 0 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; }
  .noteform button:disabled { opacity: .3; }

  /* ── 하단 탭 ── */
  .gear-fab { position: fixed; top: calc(var(--sat) + 12px); right: 16px; z-index: 31; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg);
    background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .gear-fab svg { width: 24px; height: 24px; fill: currentColor; }
  .back-fab { right: auto; left: 16px; }
  .back-fab svg.chev { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #s-settings header.sub { display: flex; justify-content: center; align-items: center; height: 46px; margin: 12px 0 10px; padding: 0; }
  .gear-fab:active { background: var(--card2); }
  :root[data-theme="light"] .gear-fab { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  .tabbed header { padding-right: 56px; }
  .tabbed { padding-bottom: calc(112px + var(--sab)) !important; }
  .tabs { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 30; display: flex; gap: 2px; padding: 6px; border-radius: 999px;
    background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: 448px; margin: 0 auto; }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 999px; color: var(--fg3); font-size: 11px; font-weight: 600; transition: background .15s, color .15s; }
  .tabs button img { width: 28px; height: 28px; object-fit: contain; opacity: .55; transition: opacity .15s, transform .15s; }
  .tabs button img.tab-face { border-radius: 50%; }
  .tabs button.on { background: rgba(255,255,255,.12); color: var(--ok); }
  :root[data-theme="light"] .tabs button.on { background: rgba(0,0,0,.07); }
  .tabs button.on img { opacity: 1; transform: translateY(-1px); }
  :root[data-theme="light"] .tabs { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  /* ── 일지 달력 ── */
  .cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cal .d { aspect-ratio: 1 / 1.1; border-radius: 16px; background: var(--card); padding: 12px 11px 11px; display: flex; flex-direction: column; text-align: left; position: relative; }
  .cal .d.future { opacity: .35; }
  .cal .d .n { font-size: 19px; font-weight: 600; color: var(--fg); line-height: 1; display: flex; align-items: baseline; gap: 5px; }
  .cal .d .n small { font-size: 12px; color: var(--fg3); font-weight: 500; }
  .cal .d .n small.sun { color: var(--temp); }
  .cal .d.today .n { color: var(--ok); }
  .cal .d.sel { outline: 1.5px solid var(--fg2); }
  .cal .d .tx { font-size: 12px; color: var(--fg2); line-height: 1.35; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cal .d .m { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; max-height: 13px; overflow: hidden; }
  .cal .d .m i { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .cal .d .m i.feed { --c: var(--feed); } .cal .d .m i.diaper { --c: var(--diaper); } .cal .d .m i.sleep { --c: var(--sleep); } .cal .d .m i.nt { --c: var(--ok); }
  .cal .d .stk { position: absolute; right: -4px; top: -8px; font-size: 30px; line-height: 1; filter: drop-shadow(0 1.5px 2px rgba(0,0,0,.35)); pointer-events: none; }
  .diary-in { width: 100%; background: var(--bg); border: 0; border-radius: 14px; padding: 13px 15px; font-size: 15px; line-height: 1.45; outline: none; resize: none; color: var(--fg); margin-top: 4px; }
  .diary-in:focus { box-shadow: 0 0 0 1.5px var(--fg3); }
  .emo { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .emo button { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); font-size: 22px; line-height: 1; }
  .emo button.on { background: var(--card2); box-shadow: 0 0 0 1.5px var(--fg2); }
  .cal .d .stl { font-size: 11px; font-weight: 700; color: var(--ok); margin-top: 5px; line-height: 1; }
  .cal-legend { display: flex; justify-content: center; gap: 12px; margin-top: 14px; font-size: 11px; color: var(--fg3); }
  .cal-legend span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; background: var(--c); }
  .cal-legend .feed { --c: var(--feed); } .cal-legend .diaper { --c: var(--diaper); } .cal-legend .sleep { --c: var(--sleep); } .cal-legend .nt { --c: var(--ok); }
  /* ── 통계 ── */
  .stat-tools { display: flex; justify-content: flex-end; margin: 4px 0 12px; }
  .stat-card { background: var(--card); border-radius: 16px; padding: 14px 16px 12px; margin-bottom: 12px; }
  .stat-card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .stat-card h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .stat-card.feed { --c: var(--feed); } .stat-card.sleep { --c: var(--sleep); } .stat-card.diaper { --c: var(--diaper); }
  .stat-card .sub { font-size: 12px; color: var(--fg3); margin-bottom: 10px; }
  .stat-card .sub b { color: var(--fg2); font-weight: 600; }
  .stat-card svg { width: 100%; height: auto; display: block; }
  /* 성장곡선 (v0.10) */
  .stat-card.grow { --c: var(--ok); }
  .g-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .g-head h3 { margin: 0; }
  .g-add { padding: 7px 13px; border-radius: 999px; background: var(--card2); font-size: 13px; font-weight: 600; color: var(--fg); }
  .seg.mini.g-metric { margin: 0 0 12px; }
  .seg.mini.g-metric button { flex: 1; font-size: 14px; }
  .g-now { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; }
  .g-now b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .g-now .pc { font-size: 13px; font-weight: 600; color: var(--ok); padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 14%, var(--card)); }
  .g-now .dl { font-size: 13px; color: var(--fg3); }
  .g-sex { padding: 12px; border-radius: 12px; background: var(--bg1, var(--bg)); font-size: 13px; color: var(--fg2); margin: 6px 0 10px; }
  .g-sex .gs-btns { display: flex; gap: 8px; margin-top: 10px; }
  .g-sex button { flex: 1; padding: 10px 0; border-radius: 999px; background: var(--card2); font-weight: 600; font-size: 14px; color: var(--fg); }
  .g-cnt { font-size: 12px; color: var(--fg3); }
  .g-quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .g-quick button { position: relative; min-height: 78px; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding: 12px 13px; text-align: left; }
  .g-quick button:active { background: var(--card2); }
  .g-quick .k { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .g-quick .v { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .frow.focus label { color: var(--ok); font-weight: 600; }
  .g-src { font-size: 11px; color: var(--fg3); margin-top: 6px; }
  .g-list { margin-top: 10px; border-top: 1px solid var(--line); }
  .g-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .g-row:last-child { border-bottom: 0; }
  .g-row .dt { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .g-row .v { font-size: 15px; font-variant-numeric: tabular-nums; grid-column: 1; }
  .g-row .nt { font-size: 12px; color: var(--fg3); grid-column: 1; }
  .g-row .av { grid-column: 2; grid-row: 1 / span 3; }
  .g-empty { padding: 4px 0 8px; color: var(--fg3); font-size: 14px; }
  .g-more { display: block; width: 100%; padding: 10px 0 2px; color: var(--fg3); font-size: 13px; }
  .sheet h3.grow { --c: var(--ok); }
  .stat-empty { padding: 30px 0; text-align: center; color: var(--fg3); font-size: 14px; }

  /* ── 바텀 시트 ── */
  .dim { position: fixed; inset: 0; background: var(--dim); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 22px 22px 0 0;
    padding: 14px 20px calc(20px + var(--sab)); max-width: 480px; margin: 0 auto; }
  .sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--card2); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .sheet h3 { display: flex; align-items: center; gap: 8px; }
  .sheet h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .sheet h3.feed { --c: var(--feed); } .sheet h3.diaper { --c: var(--diaper); } .sheet h3.sleep { --c: var(--sleep); } .sheet h3.temp { --c: var(--temp); }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 10px 0; border-radius: 999px; font-weight: 600; color: var(--fg2); }
  .seg button.on { background: var(--card2); color: var(--fg); }
  .frow { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); }
  .frow label { color: var(--fg2); font-size: 16px; }
  .frow input { background: var(--bg); border: 0; border-radius: 10px; padding: 10px 12px; width: 140px; text-align: right; font-size: 20px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums; }
  .frow input[type=time] { width: 150px; }
  .frow input.wide { width: 100%; text-align: left; font-size: 17px; font-weight: 400; }
  .frow.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .ml { display: flex; gap: 6px; margin: 6px 0 4px; }
  .ml button { flex: 1; padding: 12px 0; border-radius: 999px; background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg2); }
  .ml button.on { background: var(--card2); color: var(--fg); }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts button { flex: 1; padding: 15px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  .acts .save { background: var(--fg); color: var(--bg); flex: 2; }
  .acts .cancel { background: var(--bg); color: var(--fg2); white-space: nowrap; }
  .acts .del { background: none; color: var(--temp); flex: 0 0 auto; padding: 14px 12px; }

  /* 설정 */
  .menu { background: var(--card); border-radius: 16px; margin: 12px 0; padding: 0 16px; }
  .menu > button, .menu > div { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 0; border-top: 1px solid var(--line2); text-align: left; font-size: 16px; }
  .menu > :first-child { border-top: 0; }
  .menu .v { color: var(--fg2); font-size: 15px; }
  .menu .lab { color: var(--fg); }
  .seg.mini { margin: -6px 0; padding: 3px; gap: 2px; background: var(--card2); }
  .seg.mini button { flex: none; white-space: nowrap; padding: 6px 12px; font-size: 15px; }
  .seg.mini button.on { background: var(--card); }
  .menu > .pick-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .pick { display: flex; justify-content: center; gap: 28px; padding: 4px 0 6px; }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg3); font-size: 14px; font-weight: 500; }
  .pick button img { width: 72px; height: 72px; border-radius: 50%; opacity: .45; transition: opacity .15s, box-shadow .15s; }
  .pick button.on { color: var(--fg); }
  .pick button.on img { opacity: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--fg); }
  .seg.mini button img { width: 20px; height: 20px; border-radius: 50%; margin-right: 6px; vertical-align: -5px; }
  :root[data-theme="light"] .seg.mini button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .back { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .back svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .back:active { background: var(--card); }
  #s-settings .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .inl { display: inline-flex; align-items: center; gap: 8px; }
  .copy { padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--fg2); font-size: 13px; font-weight: 600; }
  .copy:active { background: var(--fg); color: var(--bg); }
  .pen { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--fg3); background: var(--card2); }
  .pen svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .inl input { width: 120px; background: var(--card2); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 16px; outline: none; text-align: right; color: var(--fg); }
  .inl .ok { padding: 6px 12px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600; }
  .ver { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 18px; }
  .menu-title { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 22px 2px 6px; }
  .menu-title:first-of-type { margin-top: 10px; }
  #logout { color: var(--temp); justify-content: center; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; font-weight: 600; color: var(--fg); font-size: 16px; }
  .cropper { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 10px) 16px calc(24px + var(--sab)); }
  .cr-top { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 17px; }
  .cr-top button { color: #bbb; padding: 10px 6px; font-size: 17px; }
  .cr-top button.ok { color: #fff; font-weight: 700; }
  .cr-view { position: relative; width: min(320px, calc(100vw - 32px)); aspect-ratio: 1; margin: auto 0; overflow: hidden; touch-action: none; border-radius: 12px; background: #111; }
  .cr-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; pointer-events: none; }
  .cr-mask { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 999px rgba(0,0,0,.62); pointer-events: none; outline: 1.5px solid rgba(255,255,255,.55); outline-offset: -1px; }
  .cr-zoom { display: flex; align-items: center; gap: 12px; width: min(320px, calc(100vw - 32px)); margin-top: 22px; color: #999; font-size: 19px; }
  .cr-zoom input { flex: 1; accent-color: #fff; }
  .cr-hint { color: #777; font-size: 13px; margin-top: 12px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(118px + var(--sab)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 16px; font-weight: 600; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>

<!-- 로그인 -->
<section id="s-login" class="screen hidden">
  <div class="onb">
    <div class="family"><img src="img/아빠.png" alt=""><img class="baby" src="img/아기-얼굴-4e.png" alt=""><img src="img/엄마.png" alt=""></div>

<!-- 첫 설정: 닉네임 → 아기 만들기 / 초대 코드 -->
<section id="s-setup" class="screen hidden">

      </div>
      <p class="msg" id="nick-msg"></p>
      <button type="button" class="btn" id="nick-save">이 이름으로 할게요</button>
    </div>
    <div id="setup-baby" class="hidden">
      <h1>기특일기 시작하기</h1>

        <label>아기 사진 <small>안 넣으면 기본 캐릭터</small></label>

      </div>
      <p class="msg" id="baby-msg"></p>
      <button type="button" class="btn" id="baby-create">새 기록표 만들기</button>
      <div class="or">배우자가 이미 만들었다면</div>
      <div class="card form">
        <label for="join-code">초대 코드</label>
        <input id="join-code" class="code-in" maxlength="6" placeholder="6자리" autocomplete="off" autocapitalize="characters">

</section>

<!-- 홈: 오늘의 표 -->
<section id="s-home" class="screen tabbed hidden">

  </header>

<script>

// iOS 사파리 두 번 탭 확대 막기: 350ms 안의 두 번째 탭은 확대 대신 그 자리의 버튼 클릭으로 처리 (touch-action만으론 홈 화면 앱에서 새는 경우가 있음)

  if (Date.now() - _lastTap < 300 && e.target.closest('button, a, label, .row, .ev')) e.preventDefault();   // 버튼 위 두 번째 탭만 확대 차단
}, { passive: false });

// ── 테마: system(기기 따라감) / dark / light — localStorage 'bb-theme'

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localDay = ts => dstr(new Date(ts));
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = s => { const d = new Date(s + 'T00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 <small>${WD[d.getDay()]}</small>`; };
const ago = ts => { const m = Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000)); return m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
const dur = (a, b) => { const m = Math.max(0, Math.round((new Date(b || Date.now()) - new Date(a)) / 60000)); return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`; };
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800); };

// ── 상태
let me = null;          // { id, nickname }
let baby = null;        // { id, name, birth_date, invite_code }
let nickById = {};      // user_id → nickname
let logs = [];          // 현재 아기 전체 (최근 30일)
let notes = [];
let growth = [];       // baby_growth 측정 기록 (v0.10)
let stickers = {};      // day → 이모지 (baby_days)
let tilts = {};         // day → 1/-1 (붙일 때 랜덤으로 정해진 기울기 방향)
let diaries = {};       // day → 일기 글 (baby_days.diary) — 홈의 한마디(baby_notes)와 별개
let day = dstr(new Date());
let channel = null;

// ── 데이터 계층 (mock 은 메모리)
const db = {
  async loadAll() {
    if (MOCK) return;
    const since = new Date(Date.now() - 30 * 86400000).toISOString();
    const [l, n, m, sd, gr] = await Promise.all([
      sb.from('baby_logs').select('*').eq('baby_id', baby.id).gte('at', since).order('at'),
      sb.from('baby_notes').select('*').eq('baby_id', baby.id).order('created_at'),
      sb.from('baby_members').select('user_id, avatar_url').eq('baby_id', baby.id),
      sb.from('baby_days').select('day, sticker, tilt, diary').eq('baby_id', baby.id),
      sb.from('baby_growth').select('*').eq('baby_id', baby.id).order('day')
    ]);
    logs = l.data || []; notes = n.data || []; growth = gr.data || [];
    stickers = Object.fromEntries((sd.data || []).filter(x => x.sticker).map(x => [x.day, x.sticker]));
    tilts = Object.fromEntries((sd.data || []).map(x => [x.day, x.tilt || 1]));
    diaries = Object.fromEntries((sd.data || []).filter(x => x.diary).map(x => [x.day, x.diary]));
    const ids = (m.data || []).map(x => x.user_id);
    avatarById = Object.fromEntries((m.data || []).map(x => [x.user_id, x.avatar_url || '']));
    const { data: ps } = await sb.from('profiles').select('id,nickname').in('id', ids);
    nickById = Object.fromEntries((ps || []).map(p => [p.id, p.nickname]));
  },
  loaded: new Set(),                       // 추가로 불러온 달 'YYYY-MM'
  async loadMonth(ym) {                    // 일지에서 지난달로 가면 그 달치를 더 불러옴 (기본은 최근 30일)
    if (MOCK || this.loaded.has(ym)) return;
    const from = new Date(ym + '-01T00:00'), to = new Date(from); to.setMonth(to.getMonth() + 1);
    const [l, n] = await Promise.all([
      sb.from('baby_logs').select('*').eq('baby_id', baby.id).gte('at', from.toISOString()).lt('at', to.toISOString()),
      sb.from('baby_notes').select('*').eq('baby_id', baby.id).gte('day', dstr(from)).lt('day', dstr(to))
    ]);
    for (const r of l.data || []) upsertLocal(logs, r); for (const r of n.data || []) upsertLocal(notes, r);
    this.loaded.add(ym);
  },
  async addLog(row) {
    if (MOCK) { row.id = 'm' + Date.now(); logs.push(row); return row; }
    const { data, error } = await sb.from('baby_logs').insert(row).select().single();
    if (error) throw error; upsertLocal(logs, data); return data;
  },
  async updLog(id, patch) {
    if (MOCK) { Object.assign(logs.find(x => x.id === id), patch); return; }
    const { data, error } = await sb.from('baby_logs').update(patch).eq('id', id).select().single();
    if (error) throw error; upsertLocal(logs, data);
  },
  async delLog(id) {
    logs = logs.filter(x => x.id !== id);
    if (MOCK) return;
    const { error } = await sb.from('baby_logs').delete().eq('id', id); if (error) throw error;
  },
  async updBaby(patch) {
    if (MOCK) { Object.assign(baby, patch); return; }
    const { data, error } = await sb.from('babies').update(patch).eq('id', baby.id).select().single();
    if (error) throw error; baby = data;
  },
  async delNote(id) {
    notes = notes.filter(x => x.id !== id);
    if (MOCK) return;
    const { error } = await sb.from('baby_notes').delete().eq('id', id); if (error) throw error;
  },
  async setSticker(dayStr, emoji) {
    const tilt = Math.random() < .5 ? -1 : 1;                       // 붙이는 순간 좌우 랜덤, 저장돼서 계속 같은 방향
    if (emoji) { stickers[dayStr] = emoji; tilts[dayStr] = tilt; } else delete stickers[dayStr];
    if (MOCK) return;
    const { error } = await sb.from('baby_days').upsert({ baby_id: baby.id, day: dayStr, sticker: emoji || '', tilt, updated_by: me.id, updated_at: new Date().toISOString() });
    if (error) throw error;
  },
  async setDiary(dayStr, text) {
    if (text) diaries[dayStr] = text; else delete diaries[dayStr];
    if (MOCK) return;
    const { error } = await sb.from('baby_days').upsert({ baby_id: baby.id, day: dayStr, diary: text, updated_by: me.id, updated_at: new Date().toISOString() });
    if (error) throw error;
  },
  async addGrowth(row) {
    if (MOCK) { row.id = 'g' + Date.now(); growth.push(row); return; }
    const { data, error } = await sb.from('baby_growth').insert(row).select().single();
    if (error) throw error; upsertLocal(growth, data);
  },
  async updGrowth(id, patch) {
    if (MOCK) { Object.assign(growth.find(x => x.id === id), patch); return; }
    const { data, error } = await sb.from('baby_growth').update(patch).eq('id', id).select().single();
    if (error) throw error; upsertLocal(growth, data);
  },
  async delGrowth(id) {
    growth = growth.filter(x => x.id !== id);
    if (MOCK) return;
    const { error } = await sb.from('baby_growth').delete().eq('id', id); if (error) throw error;
  },
  async addNote(text, forDay) {
    const row = { baby_id: baby.id, user_id: me.id, day: forDay || day, text };
    if (MOCK) { row.id = 'n' + Date.now(); row.created_at = new Date().toISOString(); notes.push(row); return; }
    const { data, error } = await sb.from('baby_notes').insert(row).select().single();
    if (error) throw error; upsertLocal(notes, data);
  }
};
function upsertLocal(arr, row) { const i = arr.findIndex(x => x.id === row.id); if (i < 0) arr.push(row); else arr[i] = row; }

// ── 실시간: 다른 폰이 적으면 바로 반영
function subscribe() {
  if (MOCK || channel) return;
  channel = sb.channel('baby-' + baby.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_logs', filter: 'baby_id=eq.' + baby.id }, p => {
      if (p.eventType === 'DELETE') logs = logs.filter(x => x.id !== p.old.id); else upsertLocal(logs, p.new);
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_days', filter: 'baby_id=eq.' + baby.id }, p => { const d = (p.old || p.new).day; if (p.eventType === 'DELETE') { delete stickers[d]; delete diaries[d]; } else { if (p.new.sticker) { stickers[d] = p.new.sticker; tilts[d] = p.new.tilt || 1; } else delete stickers[d]; if (p.new.diary) diaries[d] = p.new.diary; else delete diaries[d]; } if (!$('s-diary').classList.contains('hidden')) renderDiary(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_growth', filter: 'baby_id=eq.' + baby.id }, p => { if (p.eventType === 'DELETE') growth = growth.filter(x => x.id !== p.old.id); else upsertLocal(growth, p.new); if (!$('s-growth').classList.contains('hidden')) renderGrowth(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_notes', filter: 'baby_id=eq.' + baby.id }, p => { if (p.eventType === 'DELETE') notes = notes.filter(x => x.id !== p.old.id); else upsertLocal(notes, p.new); render(); })
    .subscribe();
}

// ── 렌더
const KIND = { feed: '수유', diaper: '기저귀', sleep: '잠', temp: '체온' };
const FEED = { formula: '분유', breast: '모유', pumped: '유축' };
let avatarById = {};   // user_id → 이미지 URL (profiles.avatar_url, 없으면 첫 글자)
const CHAR = { dad: 'img/아빠.png', mom: 'img/엄마.png' };   // 프로필은 카카오 사진이 아니라 캐릭터 (09-27 사장님)
const charOf = id => { const v = avatarById[id] || ''; return v === 'char:mom' ? 'mom' : v === 'char:dad' ? 'dad' : (id === baby.created_by ? 'dad' : 'mom'); };   // 기본: 만든 사람=아빠, 합류=엄마
const avatarSrc = id => CHAR[charOf(id)];
const avatar = id => `<span class="av" title="${esc(nickById[id] || '')}"><img src="${esc(avatarSrc(id))}" alt=""></span>`;
function detailOf(l) {
  const d = l.detail || {};
  if (l.kind === 'feed') return `${FEED[d.type] || '수유'} ${d.type === 'breast' ? (d.min ? d.min + '분' : '') : (d.ml ? d.ml + 'ml' : '')}`.trim();
  if (l.kind === 'diaper') return [d.pee && '소변', d.poo && '대변'].filter(Boolean).join(' + ') || '기저귀';
  if (l.kind === 'sleep') return l.ended_at ? `→ ${hhmm(l.ended_at)} 깸 · ${dur(l.at, l.ended_at)}` : `자는 중 · ${dur(l.at)}`;
  if (l.kind === 'temp') return `${d.c ?? '—'}℃`;
  return '';
}
// ── 날짜 도장: 생일 기준 자동 (출생일 = 1일)
const MILESTONES = { 50: '50일', 100: '100일', 200: '200일', 300: '300일', 365: '첫돌' };
const dayNo = d => Math.floor((new Date(d + 'T00:00') - new Date(baby.birth_date + 'T00:00')) / 86400000) + 1;
const stampOf = d => MILESTONES[dayNo(d)] || '';
const MILESTONE_EMOJI = { '50일': '🎂', '100일': '🎂', '200일': '🎈', '300일': '🎈', '첫돌': '🎉' };
const EMOJIS = ['👶', '🥰', '😊', '😭', '😴', '🍼', '💩', '🤒', '🏥', '💉', '🙃', '👣', '🦷', '🛁', '📸', '🧸', '🎉', '❤️', '⭐'];   // 🙃 = 뒤집은 날(웃는 얼굴 180°). 👼는 뺌(다른 뜻 오해)   // 우선 이모지로 (사장님 09-27). 그림 스티커는 나중에
const stickerOf = d => stickers[d] || MILESTONE_EMOJI[stampOf(d)] || '';

// ── 기록일지: 달력 (칸 = 그날 요약 점 + 도장, 누르면 홈에서 그날 표)
let ym = dstr(new Date()).slice(0, 7);
async function renderDiary() {
  await db.loadMonth(ym);
  const today = dstr(new Date());
  const first = new Date(ym + '-01T00:00'), y = first.getFullYear(), mo = first.getMonth();
  $('mon-label').innerHTML = `${y}년 ${mo + 1}월`;
  $('mon-next').disabled = ym >= today.slice(0, 7);
  const days = new Date(y, mo + 1, 0).getDate();
  const byDay = {};
  for (const l of logs) { const d = localDay(l.at); if (d.startsWith(ym)) (byDay[d] ||= { feed: 0, diaper: 0, sleep: 0, ml: 0, slp: 0, note: 0 })[l.kind] += 1, byDay[d].ml += l.kind === 'feed' ? (+(l.detail || {}).ml || 0) : 0, byDay[d].slp += (l.kind === 'sleep' && l.ended_at) ? (new Date(l.ended_at) - new Date(l.at)) : 0; }
  for (const n of notes) if (n.day.startsWith(ym)) (byDay[n.day] ||= { feed: 0, diaper: 0, sleep: 0, ml: 0, slp: 0, note: 0 }).note += 1;
  let h = '';
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad(d)}`, v = byDay[ds], st = stampOf(ds), future = ds > today, born = ds >= baby.birth_date;
    const dots = v ? ['feed', 'diaper', 'sleep'].map(k => `<i class="${k}"></i>`.repeat(Math.min(v[k], 3))).join('') : '';
    const sum = v ? `${v.feed ? `수유 ${v.feed}` : ''}${v.ml ? ` · ${v.ml}ml` : ''}${v.slp ? `<br>잠 ${Math.round(v.slp / 3600000 * 10) / 10}h` : ''}` : '';
    const wd = new Date(ds + 'T00:00').getDay(), ln = diaries[ds];
    h += `<button type="button" class="d ${ds === today ? 'today' : ''} ${future || !born ? 'future' : ''}" data-d="${ds}" ${future ? 'disabled' : ''}>
      <span class="n">${d}<small class="${wd === 0 ? 'sun' : ''}">${WD[wd]}</small></span>${stickerOf(ds) ? `<span class="stk" style="transform:rotate(${(stickers[ds] ? (tilts[ds] || 1) : ((d * 7 + mo * 3) % 2 ? 1 : -1)) * 10}deg)">${stickerOf(ds)}</span>` : ''}${st ? `<span class="stl">${st}</span>` : ''}${ln ? `<span class="tx">${esc(ln)}</span>` : ''}<span class="m">${dots}</span></button>`;
  }
  $('cal').innerHTML = h;
}
$('mon-prev').onclick = () => { const d = new Date(ym + '-01T00:00'); d.setMonth(d.getMonth() - 1); ym = dstr(d).slice(0, 7); renderDiary(); };
$('mon-next').onclick = () => { const d = new Date(ym + '-01T00:00'); d.setMonth(d.getMonth() + 1); ym = dstr(d).slice(0, 7); renderDiary(); };
$('cal').addEventListener('click', e => { const b = e.target.closest('.d[data-d]'); if (!b || b.disabled) return; openDayNotes(b.dataset.d); });
// ── 일지에서 날짜를 누르면: 그날 한마디 보기 + 쓰기 (지난 날에도 남길 수 있음) + 그날 표로 가기
function openDayNotes(ds) {
  const d = new Date(ds + 'T00:00');
  $('sheet').innerHTML = `<h3>${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]} <small style="color:var(--fg3);font-weight:500;font-size:13px;margin-left:6px">D+${dayNo(ds)}${stampOf(ds) ? ' · ' + stampOf(ds) : ''}</small></h3>
    <div class="emo" id="dn-emo">${EMOJIS.map(e => `<button type="button" data-e="${e}" class="${stickers[ds] === e ? 'on' : ''}">${e}</button>`).join('')}</div>
    <textarea id="dn-text" class="diary-in" maxlength="1000" rows="4" placeholder="이날의 일기 — 예: 많이 운 날 ㅜㅜ, 처음 뒤집은 날">${esc(diaries[ds] || '')}</textarea>
    <div class="acts"><button type="button" class="cancel" id="dn-go">이날 기록 보기</button><button type="button" class="save" id="dn-save">저장</button></div>`;
  $('sheet').dataset.kind = 'daynotes';
  $('dim').classList.remove('hidden'); $('sheet').classList.remove('hidden'); $('dim').onclick = closeSheet;
  $('dn-emo').addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return; const next = stickers[ds] === b.dataset.e ? '' : b.dataset.e;   // 같은 걸 다시 누르면 뗌
    try { await db.setSticker(ds, next); for (const x of $('dn-emo').children) x.classList.toggle('on', x.dataset.e === next); renderDiary(); } catch (err) { alert('스티커 실패: ' + err.message); } });

function growthChart(m, pts) {
