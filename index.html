<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>기특일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180-bottle.png">
<script>(function(){var p=localStorage.getItem("bb-theme")||"system";document.documentElement.dataset.theme=(p==="light"||(p==="system"&&matchMedia("(prefers-color-scheme: light)").matches))?"light":"dark";})();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0b0b0d; --card: #151518; --card2: #1d1d22; --line: #222228;
    --line2: #19191d; --fg: #f1f1f4; --fg2: #8f8f99; --fg3: #55555e;
    --feed: #6f9ee0; --diaper: #f2c94c; --sleep: #9d93d6; --temp: #d98079; --ok: #7fc39c;
    --kakao: #fee500;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  :root { --bg1: #101013; --dim: rgba(0,0,0,.6); color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f4f6; --bg1: #ececef; --card: #ffffff; --card2: #eeeef1; --line: #e4e4e9; --line2: #ededf1;
    --fg: #1b1b1f; --fg2: #6b6b75; --fg3: #9a9aa3;
    --feed: #3b7bd4; --diaper: #e8b10e; --sleep: #7565cf; --temp: #d4554d; --ok: #2f9e63;
    --dim: rgba(0,0,0,.35); color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; font-size: 17px; line-height: 1.35;
    letter-spacing: -.015em; }
  body { padding-top: var(--sat); min-height: 100dvh; overscroll-behavior-y: none; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }   /* 빠른 두 번 탭이 확대로 먹히지 않게 */
  html, body, * { touch-action: manipulation; }
  .hidden { display: none !important; }
  .screen { max-width: 480px; margin: 0 auto; padding: 0 16px calc(28px + var(--sab)); }

  /* ── 로그인 / 첫 설정 ── */
  .onb { padding: 14vh 0 40px; max-width: 360px; margin: 0 auto; }
  #s-login .onb { text-align: center; padding-top: 18vh; }
  .onb h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.03em; }
  .onb > p, .onb > div > p:not(.msg) { color: var(--fg2); font-size: 15px; margin: 0 0 22px; }
  .family { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .family img { width: 76px; height: 76px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg); position: relative; }
  .family img:nth-child(1) { margin-right: -18px; z-index: 1; }
  .family img.baby { z-index: 3; }
  .family img:nth-child(3) { margin-left: -18px; z-index: 2; }
  #kakao-login { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 15px; border-radius: 999px; background: var(--kakao); color: #191600; font-weight: 700; font-size: 17px; }
  .foot { color: var(--fg3); font-size: 14px; margin-top: 14px; }
  .card { background: var(--card); border-radius: 16px; }
  .card.form { padding: 6px 16px 14px; }
  .card.form label { display: block; font-size: 13px; color: var(--fg3); font-weight: 500; margin: 12px 0 6px; }
  .card.form label small { color: var(--fg3); font-weight: 400; margin-left: 4px; }
  .card.form input { width: 100%; background: var(--card2); border: 0; border-radius: 10px; padding: 12px 14px; font-size: 17px; outline: none; color: var(--fg); }
  .card.form input:focus { box-shadow: 0 0 0 1.5px var(--fg3); }
  .card.form input[type=date] { font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; min-height: 46px; }
  .card.form input.code-in { font-family: ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; font-size: 19px; }
  .photo-pick { display: flex; align-items: center; gap: 12px; }
  .photo-pick .pv { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--card2); }
  .pbtn { padding: 8px 14px; border-radius: 999px; background: var(--card2); color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pbtn.ghost { background: none; color: var(--fg2); }
  .card.form label.pbtn { display: inline-block; margin: 0; font-size: 14px; color: var(--fg); font-weight: 600; }
  header .who { cursor: pointer; border-radius: 999px; }
  header .who:active { opacity: .7; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 17px; margin-top: 4px; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .btn:disabled { opacity: .4; }
  .or { color: var(--fg3); font-size: 14px; margin: 26px 0 8px; text-align: center; }
  .msg { color: var(--temp); font-size: 14px; min-height: 18px; margin: 8px 2px; }

  /* ── 홈 ── */
  header { display: flex; align-items: center; justify-content: space-between; height: 46px; margin: 12px 0 10px; padding: 0; }
  header .who { display: flex; align-items: center; }
  #s-home header .who, #s-stats header .who { position: fixed; top: calc(var(--sat) + 12px); left: 16px; z-index: 31; max-width: calc(100% - 150px); height: 46px; padding: 0 14px 0 6px; border-radius: 999px; background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  :root[data-theme="light"] #s-stats header .who { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  :root[data-theme="light"] #s-home header .who { background: rgba(255,255,255,.34); border-color: rgba(0,0,0,.06); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  #s-stats header .bf, #s-home header .who .bf { width: 34px; height: 34px; margin-right: 9px; }
  /* ── 홈 상단 (10-07): 큰 프로필은 흐름 안에 그대로, 위로 사라지면 좌상단 알약이 나타남 */
  #s-home header { display: block; height: auto; margin: 0 0 6px; padding: 64px 0 0; }   /* .tabbed header의 오른쪽 56px 여백 무효 — 가운데 정렬 */
  #s-home header .hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 22px; }
  /* 프로필 좌우 엄마·아빠 전신 (10-07, 원본 배경 지움) */
  #s-home header .hav { position: relative; }
  #s-home header .hav .par { position: absolute; bottom: 4px; height: 66px; width: auto; z-index: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
  #s-home header .hav .bf { position: relative; z-index: 1; }
  #s-home header .hav .par.dad { right: calc(100% + 6px); } #s-home header .hav .par.mom { left: calc(100% + 6px); }   /* 작게, 원과 떨어져 둘 다 온전히 (10-07 D안) */
  #s-home header .hero .bf { width: 112px; height: 112px; margin: 0 0 10px; box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 6px 18px rgba(0,0,0,.35); }
  :root[data-theme="light"] #s-home header .hero .bf { box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0,0,0,.14); }
  #s-home header .hero .wl { display: flex; align-items: center; gap: 8px; height: 34px; white-space: nowrap; }
  #s-home header .hero .name { font-size: 27px; }
  #s-home header .hero .dday { margin-left: 0; }
  #s-home header .sub { font-size: 13px; color: var(--fg2); white-space: nowrap; line-height: 18px; }
  #s-home header .who { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .22s ease, transform .22s ease; }
  #s-home header .who.on { opacity: 1; transform: none; pointer-events: auto; }
  header .bf { width: 31px; height: 31px; border-radius: 50%; margin-right: 10px; }
  header .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  header .dday { color: var(--ok); font-size: 13px; margin-left: 8px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 14%, var(--bg)); font-variant-numeric: tabular-nums; }
  header .gear { width: 40px; height: 40px; margin-right: -8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg2); }
  header .gear svg { width: 25px; height: 25px; fill: currentColor; }
  header .gear:active { background: var(--card); }
  .daynav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 21px; }
  #s-home .daynav { margin-top: 24px; }   /* 고정 알약과 날짜 줄 사이 10→24px (v0.17, 사장님 "여백이 너무 좁아") */
  .daynav button { color: var(--fg2); width: 44px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .daynav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .daynav button:active { background: var(--card); }
  .daynav button:disabled { color: var(--fg3); opacity: .35; }
  .daynav .date { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .date-pick { position: relative; display: flex; align-items: center; gap: 3px; padding: 8px 10px; margin: -8px -10px; border-radius: 10px; }
  .date-pick:active { background: var(--card); }
  .date-pick .dd { width: 16px; height: 16px; fill: none; stroke: var(--fg3); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .date-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0; -webkit-appearance: none; appearance: none; }
  .daynav .date small { color: var(--fg3); font-weight: 400; margin-left: 5px; font-size: 14px; }

  /* 간편 상태 두 칸 */
  .status { background: var(--bg1); border-radius: 14px; padding: 13px 15px; margin-bottom: 19px; display: flex; flex-direction: column; gap: 8px; }
  .status .chip { display: flex; align-items: center; gap: 10px; }
  .status .chip b { display: inline-flex; align-items: center; font-size: 13px; color: var(--c); font-weight: 500; flex: none; padding: 4px 9px; border-radius: 7px; background: color-mix(in srgb, var(--c) 14%, var(--bg1)); }
  .status .chip span { font-size: 15px; font-weight: 500; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .status .chip span small { color: var(--fg3); font-weight: 400; font-size: 13px; margin-left: 5px; }
  .status .chip.feed { --c: var(--feed); } .status .chip.sleep { --c: var(--sleep); } .status .chip.diaper { --c: var(--diaper); }
  :root[data-theme="light"] .status .chip.diaper b { color: #9a7400; }
  .sheet-title h2 { flex: none; }
  .sum-pill { display: flex; gap: 16px; margin: 0 0 10px; padding: 11px 15px; border-radius: 12px; background: var(--card); white-space: nowrap; overflow: hidden; }   /* 오늘의 표 제목 아래 한 줄 (v0.20, 사장님 "오늘의 표 아래로 한줄로") */
  .sum-pill::-webkit-scrollbar { display: none; }
  .sum-pill i { font-style: normal; font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; flex: none; }
  .sum-pill b { color: var(--fg2); font-weight: 600; }
  .sum-pill .feed b { color: var(--feed); } .sum-pill .diaper b { color: var(--diaper); } .sum-pill .sleep b { color: var(--sleep); }   /* 굵은 숫자만 항목 색 (사장님) */
  :root[data-theme="light"] .sum-pill .diaper b { color: #9a7400; }

  /* 카테고리 버튼 2×2 */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .quick button { --c: var(--fg); height: 70px; border-radius: 16px; background: var(--card); display: flex; align-items: center; padding: 0 15px; gap: 13px; position: relative; overflow: hidden; }
  .quick .ic { flex: none; width: 38px; height: 38px; border-radius: 11px; background: var(--card2); display: flex; align-items: center; justify-content: center; }
  .quick .ic img { width: 27px; height: 27px; object-fit: contain; display: block; }
  .quick .tx { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; text-align: left; }
  .quick button:active { background: var(--card2); }
  .quick .k { font-size: 16px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; }
  .quick .s { font-size: 13px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .quick .feed { --c: var(--feed); } .quick .diaper { --c: var(--diaper); } .quick .sleep { --c: var(--sleep); } .quick .temp { --c: var(--temp); }
  .quick .sleep.on { background: var(--card2); }
  .quick .sleep.on .s { color: var(--fg2); }
  .quick .sleep.on .ic { background: color-mix(in srgb, var(--sleep) 22%, var(--card2)); }

  /* 오늘의 표 */
  .sheet-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 9px; padding: 0 2px; }
  .sheet-title h2 { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 0; }
  .sheet-title span { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .vt { display: inline-flex; gap: 2px; background: var(--card); border-radius: 999px; padding: 3px; }
  .vt button { width: 44px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--fg3); }
  .vt button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vt button.on { background: var(--card2); color: var(--fg); }
  .clock { padding: 18px 12px 6px; }
  .clock svg { width: 100%; height: auto; display: block; }
  .clock .ck { cursor: pointer; }
  .clock .ck.feed { fill: var(--feed); } .clock .ck.diaper { fill: var(--diaper); } .clock .ck.temp { fill: var(--temp); }
  .clock .ck.sleep { fill: color-mix(in srgb, var(--sleep) 55%, var(--card)); } .clock .ck.sleep.open { fill: color-mix(in srgb, var(--sleep) 35%, var(--card)); }
  .clock .lg { display: flex; justify-content: center; gap: 6px; padding: 12px 0 6px; font-size: 13px; color: var(--fg2); }
  .clock .lg span { padding: 5px 10px; border-radius: 999px; background: var(--card2); }
  .clock .lg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }
  .clock .lg .feed { --c: var(--feed); } .clock .lg .diaper { --c: var(--diaper); } .clock .lg .sleep { --c: var(--sleep); } .clock .lg .temp { --c: var(--temp); }
  .rows { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 22px; }
  .row { --c: var(--fg2); display: grid; grid-template-columns: 52px 22px 1fr auto; gap: 0 8px; align-items: stretch; padding: 0 15px 0 13px; width: 100%; text-align: left; }
  .row:active { background: var(--card2); }
  .row.feed { --c: var(--feed); } .row.diaper { --c: var(--diaper); } .row.sleep { --c: var(--sleep); } .row.temp { --c: var(--temp); }
  .row .t { align-self: center; justify-self: start; padding: 4px 8px; border-radius: 7px; background: var(--card2); color: var(--fg2); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row.feed .t, .row.diaper .t, .row.sleep .t { background: color-mix(in srgb, var(--c) 14%, var(--card)); color: var(--c); }
  /* 기저귀 = 버터 옐로 (v0.17, 사장님 "너무 똥색" → 추천 A). 라이트에선 노란 글자가 흐려서 글자만 한 단계 진하게, 노란 채움 위 글자는 검정 */
  :root[data-theme="light"] .row.diaper .t { color: #9a7400; background: color-mix(in srgb, var(--diaper) 20%, var(--card)); }
  .sheet[data-kind="diaper"] { --on-fg: #1c1a14 !important; }
  .row .rl { position: relative; }
  .row .rl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--line); }
  .row:first-child .rl::before { top: 50%; } .row.last .rl::before { bottom: 50%; }
  .row .rl::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--card); }
  .row .d { padding: 22px 0; border-top: 1px solid var(--line2); min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .row:first-child .d, .row:first-child .w { border-top: 0; }
  .row .d b { color: var(--fg); font-size: 15px; font-weight: 400; }
  .row .d small { color: var(--fg3); display: block; font-size: 13px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .w { border-top: 1px solid var(--line2); display: flex; align-items: center; margin-left: -8px; padding-left: 12px; }
  .av { width: 31px; height: 31px; border-radius: 50%; background: var(--card2); color: var(--fg2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { padding: 26px 14px; text-align: center; color: var(--fg3); font-size: 16px; }
  .sum { display: flex; gap: 14px; padding: 15px 16px; border-top: 1px solid var(--line); margin-top: 2px; font-size: 14px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .sum b { color: var(--fg2); font-weight: 500; }

  /* 서로에게 한마디 */
  .notes { background: var(--card); border-radius: 16px; padding: 15px 17px; }
  .notes h2 { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 0 0 8px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; }
  .note .who { flex: none; padding-top: 1px; }
  .note .tx { flex: 1; font-size: 16px; white-space: pre-wrap; }
  .note .nx { flex: none; width: 32px; height: 32px; border-radius: 50%; color: var(--fg3); font-size: 16px; margin: -6px -8px 0 0; }
  .note .nx:active { background: var(--card2); color: var(--temp); }
  .note .tm { font-size: 13px; color: var(--fg3); padding-top: 4px; font-variant-numeric: tabular-nums; }
    .noteform { display: flex; gap: 8px; margin-top: 8px; }
  .noteform input { flex: 1; min-width: 0; background: var(--bg); border: 0; border-radius: 999px; padding: 13px 17px; outline: none; }
  .noteform button { padding: 0 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; }
  .noteform button:disabled { opacity: .3; }

  /* ── 하단 탭 ── */
  .gear-fab { position: fixed; top: calc(var(--sat) + 12px); right: 16px; z-index: 31; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg);
    background: rgba(28,28,32,.42); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .gear-fab svg { width: 24px; height: 24px; fill: currentColor; }
  .back-fab { right: auto; left: 16px; }
  .back-fab svg.chev { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #s-settings header.sub { display: flex; justify-content: center; align-items: center; height: 46px; margin: 12px 0 10px; padding: 0; }
  .gear-fab:active { background: var(--card2); }
  .ai-fab { right: 70px; padding: 3px; }   /* 설정 버튼 왼쪽, 같은 유리 원형 */
  .ai-fab img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  /* 자온 채팅 시트 */
  .ai-head { display: flex; align-items: center; justify-content: space-between; }
  .ai-head h3 img { width: 28px; height: 28px; border-radius: 50%; }
  .sheet h3.grow:has(img)::before { display: none; }
  .ai-new { padding: 6px 12px; border-radius: 999px; background: var(--card2); font-size: 13px; font-weight: 600; color: var(--fg2); }
  .ai-log { height: min(52vh, 440px); overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; margin: 0 -2px; overscroll-behavior: contain; }
  .ai-hello { margin: auto 0; text-align: center; color: var(--fg2); font-size: 15px; line-height: 1.6; }
  .ai-hello img { width: 64px; height: 64px; border-radius: 50%; display: block; margin: 0 auto 10px; }

  .g-row:last-child { border-bottom: 0; }
  .g-row .dt { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .g-row .v { font-size: 15px; font-variant-numeric: tabular-nums; grid-column: 1; }
  .g-row .nt { font-size: 12px; color: var(--fg3); grid-column: 1; }
  .g-row .av { grid-column: 2; grid-row: 1 / span 3; }
  .g-empty { padding: 4px 0 8px; color: var(--fg3); font-size: 14px; }
  .g-more { display: block; width: 100%; padding: 10px 0 2px; color: var(--fg3); font-size: 13px; }
  .sheet h3.grow { --c: var(--ok); }
  .stat-empty { padding: 30px 0; text-align: center; color: var(--fg3); font-size: 14px; }

  /* ── 바텀 시트 ── */
  .dim { position: fixed; inset: 0; background: var(--dim); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 22px 22px 0 0;
    padding: 14px 20px calc(20px + var(--sab)); max-width: 480px; margin: 0 auto; }
  .sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--fg3); opacity: .45; margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .sheet h3 { display: flex; align-items: center; gap: 8px; }
  .sheet h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .sheet h3.feed { --c: var(--feed); } .sheet h3.diaper { --c: var(--diaper); } .sheet h3.sleep { --c: var(--sleep); } .sheet h3.temp { --c: var(--temp); }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 10px 0; border-radius: 999px; font-weight: 600; color: var(--fg2); }
  .seg button.on { background: var(--card2); color: var(--fg); }
  .frow { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); }
  .frow label { color: var(--fg2); font-size: 16px; }
  .frow input { background: var(--bg); border: 0; border-radius: 10px; padding: 10px 12px; width: 140px; text-align: right; font-size: 20px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums; }
  .frow input[type=time] { width: 150px; }
  .frow input.wide { width: 100%; text-align: left; font-size: 17px; font-weight: 400; }
  .frow.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .ml { display: flex; gap: 6px; margin: 6px 0 4px; }
  .ml button { flex: 1; padding: 12px 0; border-radius: 999px; background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg2); }
  .ml button.on { background: var(--card2); color: var(--fg); }
  .ml button.clr { flex: 1.1; color: var(--fg2); font-size: 14px; }
  /* 시트 안 선택 표시 = 그 항목 색으로 채움 (v0.16, 사장님 "선택된건지 잘 모르겠음") */
  .sheet { --c: var(--ok); --on-fg: #0b0b0d; }
  :root[data-theme="light"] .sheet { --on-fg: #fff; }
  .sheet[data-kind="feed"] { --c: var(--feed); } .sheet[data-kind="diaper"] { --c: var(--diaper); } .sheet[data-kind="sleep"] { --c: var(--sleep); } .sheet[data-kind="temp"] { --c: var(--temp); }
  .sheet .seg button, .sheet .ml button { transition: background .12s, color .12s; }
  .sheet .seg button.on, .sheet .ml button.on { background: var(--c); color: var(--on-fg); font-weight: 700; box-shadow: 0 3px 10px color-mix(in srgb, var(--c) 30%, transparent); }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts button { flex: 1; padding: 15px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  .acts .save { background: var(--fg); color: var(--bg); flex: 2; }
  .acts .cancel { background: var(--bg); color: var(--fg2); white-space: nowrap; }
  .acts .del { background: none; color: var(--temp); flex: 0 0 auto; padding: 14px 12px; }

  /* 설정 */
  .menu { background: var(--card); border-radius: 16px; margin: 12px 0; padding: 0 16px; }
  .menu > button, .menu > div { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 0; border-top: 1px solid var(--line2); text-align: left; font-size: 16px; }
  .menu > :first-child { border-top: 0; }
  .menu .v { color: var(--fg2); font-size: 15px; }
  .menu .lab { color: var(--fg); }
  .seg.mini { margin: -6px 0; padding: 3px; gap: 2px; background: var(--card2); }
  .seg.mini button { flex: none; white-space: nowrap; padding: 6px 12px; font-size: 15px; }
  .seg.mini button.on { background: var(--card); }
  .menu > .pick-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .pick { display: flex; justify-content: center; gap: 28px; padding: 4px 0 6px; }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg3); font-size: 14px; font-weight: 500; }
  .pick button img { width: 72px; height: 72px; border-radius: 50%; opacity: .45; transition: opacity .15s, box-shadow .15s; }
  .pick button.on { color: var(--fg); }
  .pick button.on img { opacity: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--fg); }
  .seg.mini button img { width: 20px; height: 20px; border-radius: 50%; margin-right: 6px; vertical-align: -5px; }
  :root[data-theme="light"] .seg.mini button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  /* 시트 안 작은 세그먼트(성별 등)도 선택 = 항목 색 채움. 위 .seg.mini 규칙이 배경만 카드색으로 덮어 글자가 안 보이던 것 (v0.21, 사장님 "성별 고르는 탭이 이상해") */
  .sheet .seg.mini button.on { background: var(--c); color: var(--on-fg); }
  .back { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .back svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .back:active { background: var(--card); }
  #s-settings .name { font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .inl { display: inline-flex; align-items: center; gap: 8px; }
  .copy { padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--fg2); font-size: 13px; font-weight: 600; }
  .copy:active { background: var(--fg); color: var(--bg); }
  .pen { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--fg3); background: var(--card2); }
  .pen svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .inl input { width: 120px; background: var(--card2); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 16px; outline: none; text-align: right; color: var(--fg); }
  .inl .ok { padding: 6px 12px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600; }
  .ver { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 18px; }
  .menu-title { font-size: 14px; color: var(--fg3); font-weight: 500; margin: 22px 2px 6px; }
  .menu-title:first-of-type { margin-top: 10px; }
  #logout { color: var(--temp); justify-content: center; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; font-weight: 600; color: var(--fg); font-size: 16px; }
  .cropper { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 10px) 16px calc(24px + var(--sab)); }
  .cr-top { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 17px; }
  .cr-top button { color: #bbb; padding: 10px 6px; font-size: 17px; }
  .cr-top button.ok { color: #fff; font-weight: 700; }
  .cr-view { position: relative; width: min(320px, calc(100vw - 32px)); aspect-ratio: 1; margin: auto 0; overflow: hidden; touch-action: none; border-radius: 12px; background: #111; }
  .cr-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; pointer-events: none; }
  .cr-mask { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 999px rgba(0,0,0,.62); pointer-events: none; outline: 1.5px solid rgba(255,255,255,.55); outline-offset: -1px; }
  .cr-zoom { display: flex; align-items: center; gap: 12px; width: min(320px, calc(100vw - 32px)); margin-top: 22px; color: #999; font-size: 19px; }
  .cr-zoom input { flex: 1; accent-color: #fff; }
  .cr-hint { color: #777; font-size: 13px; margin-top: 12px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(118px + var(--sab)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 16px; font-weight: 600; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="s-login" class="screen hidden">
  <div class="onb">
    <div class="family"><img src="img/아빠-2g.png" alt=""><img class="baby" src="img/아기-2g-원형.png" alt=""><img src="img/엄마-2g-b.png" alt=""></div>
    <h1>기특일기</h1>
    <p>부부가 같은 표를 보며 적어요</p>
    <button type="button" id="kakao-login">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#191600" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.2 4.6 6.6L5.5 21l4.4-2.9c.7.1 1.4.2 2.1.2 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
      카카오로 시작하기
    </button>
    <div class="foot">이메일·연락처는 받지 않아요. 카카오 닉네임만 써요.</div>
  </div>
</section>

<!-- 첫 설정: 닉네임 → 아기 만들기 / 초대 코드 -->
<section id="s-setup" class="screen hidden">
  <div class="onb">
    <div id="setup-nick">
      <h1 id="setup-title">표에 표시될 이름</h1>
      <p>아빠, 엄마, 또는 부르는 이름</p>
      <div class="card form">
        <label for="nick">내 이름</label>
        <input id="nick" maxlength="12" placeholder="예: 아빠" autocomplete="off">
      </div>
      <p class="msg" id="nick-msg"></p>
      <button type="button" class="btn" id="nick-save">이 이름으로 할게요</button>
    </div>
    <div id="setup-baby" class="hidden">
      <h1>기특일기 시작하기</h1>
      <p>먼저 만든 사람이 배우자를 초대해요</p>
      <div class="card form">
        <label>아기 사진 <small>안 넣으면 기본 캐릭터</small></label>
        <div class="photo-pick"><img id="setup-photo" class="pv" src="img/아기-2g-원형.png" alt=""><button type="button" class="pbtn" id="setup-pick">사진 고르기</button><input type="file" id="setup-file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><button type="button" class="pbtn ghost hidden" id="setup-photo-clear">기본 캐릭터로</button></div>
        <label for="baby-name">아기 이름 <small>태명도 좋아요</small></label>
        <input id="baby-name" maxlength="12" placeholder="예: 콩이" autocomplete="off">
        <label for="baby-birth">생년월일</label>
        <input id="baby-birth" type="date">
      </div>
      <p class="msg" id="baby-msg"></p>
      <button type="button" class="btn" id="baby-create">새 기록표 만들기</button>
      <div class="or">배우자가 이미 만들었다면</div>
      <div class="card form">
        <label for="join-code">초대 코드</label>
        <input id="join-code" class="code-in" maxlength="6" placeholder="6자리" autocomplete="off" autocapitalize="characters">
      </div>
      <p class="msg" id="join-msg"></p>
      <button type="button" class="btn ghost" id="join-go">코드로 합류하기</button>
    </div>
  </div>
</section>

<!-- 홈: 오늘의 표 -->
<section id="s-home" class="screen tabbed hidden">
  <header>
    <div class="hero" id="h-hero"><div class="hav"><img class="par dad" src="img/아빠-2g-전신.png" alt=""><img class="par mom" src="img/엄마-2g-전신.png" alt=""><img class="bf" src="img/아기-2g-원형.png" alt=""></div><div class="wl"><span class="name" id="h-name">아기</span><span class="dday" id="h-dday"></span></div><div class="sub" id="h-sub"></div></div>
    <div class="who" id="h-pill"><img class="bf" src="img/아기-2g-원형.png" alt=""><span class="name" id="hp-name">아기</span><span class="dday" id="hp-dday"></span></div>
    
  </header>
  <div class="daynav">
    <button type="button" id="day-prev" aria-label="어제"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="date-pick"><div class="date" id="h-date"></div><svg class="dd" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg><input type="date" id="h-pick" aria-label="날짜 고르기"></div>
    <button type="button" id="day-next" aria-label="다음 날"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="status">
    <div class="chip feed"><b>마지막 수유</b><span id="st-feed">—</span></div>
    <div class="chip sleep"><b>잠</b><span id="st-sleep">—</span></div>
  </div>
  <div class="status vx-box hidden" id="st-vax-wrap"></div>
  <div class="quick">
    <button type="button" class="feed" data-kind="feed"><span class="ic"><img src="img/ic-feed.png" alt=""></span><span class="tx"><span class="k">수유</span><span class="s">분유 · 모유 · 유축</span></span></button>
    <button type="button" class="diaper" data-kind="diaper"><span class="ic"><img src="img/ic-diaper.png" alt=""></span><span class="tx"><span class="k">기저귀</span><span class="s">소변 · 대변</span></span></button>
    <button type="button" class="sleep" data-kind="sleep" id="q-sleep"><span class="ic"><img src="img/ic-sleep.png" alt=""></span><span class="tx"><span class="k">잠듦</span><span class="s">지금부터</span></span></button>
    <button type="button" class="temp" data-kind="temp"><span class="ic"><img src="img/ic-temp.png" alt=""></span><span class="tx"><span class="k">체온</span><span class="s">℃</span></span></button>
  </div>
  <div class="sheet-title"><h2>오늘의 표</h2><span class="vt" id="view-seg"><button type="button" data-v="list" aria-label="목록"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><button type="button" data-v="clock" aria-label="24시간"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></button></span></div>
  <div class="sum-pill hidden" id="day-sum"></div>
  <div class="rows" id="rows"></div>
  <div class="rows clock hidden" id="clock"></div>
  <div class="notes">
    <h2>서로에게 한마디</h2>

      <input id="note-in" maxlength="300" placeholder="한 줄 남기기" autocomplete="off">
      <button type="submit" id="note-btn" disabled>남기기</button>
    </form>
  </div>
</section>

<!-- 기록일지: 달력 -->
<section id="s-diary" class="screen tabbed hidden">

  <div class="daynav"><button type="button" id="mon-prev" aria-label="지난달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="date" id="mon-label"></div><button type="button" id="mon-next" aria-label="다음달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>

  <div class="cal-legend"><span class="feed">수유</span><span class="diaper">기저귀</span><span class="sleep">잠</span></div>

fill="#9aa3ad"/></g></svg><span>검진/접종</span></button></div>
  <div id="growth"></div>
  <div id="g-vax" class="hidden"></div>
  <div id="g-info" class="hidden"></div>
  </div>
</section>

<!-- 통계 -->
<section id="s-stats" class="screen tabbed hidden">
  <header><div class="who" id="st-who"><img class="bf" src="img/아기-2g-원형.png" alt=""><span class="name st-name"></span><span class="dday st-dday"></span></div></header>
  <div class="stat-head"><h2>통계</h2><span class="seg mini" id="stat-range"><button type="button" data-v="7">7일</button><button type="button" data-v="30">30일</button></span></div>
  <div id="stats"></div>
</section>

<!-- 좌상단 고정 뒤로 (설정 화면) -->
<button type="button" class="gear-fab back-fab hidden" id="close-settings" aria-label="뒤로"><svg viewBox="0 0 24 24" class="chev"><path d="M15 5l-7 7 7 7"/></svg></button>

<!-- 우상단 고정 설정 -->

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ago = ts => { const m = Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000)); return m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
const dur = (a, b) => { const m = Math.max(0, Math.round((new Date(b || Date.now()) - new Date(a)) / 60000)); return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`; };
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800); };

// ── 상태
let me = null;          // { id, nickname }
let baby = null;        // { id, name, birth_date, invite_code }
let nickById = {};      // user_id → nickname
let logs = [];          // 현재 아기 전체 (최근 30일)
let notes = [];
let growth = [];       // baby_growth 측정 기록 (v0.10)
let stickers = {};      // day → 이모지 (baby_days)

let channel = null;

// ── 데이터 계층 (mock 은 메모리)
const db = {
  async loadAll() {
    if (MOCK) return;
    const since = new Date(Date.now() - 30 * 86400000).toISOString();
    const [l, n, m, sd, gr, ck, xv] = await Promise.all([
      sb.from('baby_logs').select('*').eq('baby_id', baby.id).gte('at', since).order('at'),
      sb.from('baby_notes').select('*').eq('baby_id', baby.id).order('created_at'),
      sb.from('baby_members').select('user_id, avatar_url').eq('baby_id', baby.id),
      sb.from('baby_days').select('day, sticker, tilt, diary').eq('baby_id', baby.id),
      sb.from('baby_growth').select('*').eq('baby_id', baby.id).order('day'),
      sb.from('baby_checks').select('*').eq('baby_id', baby.id),
      sb.from('baby_extra_vax').select('*').eq('baby_id', baby.id)
    ]);
    extras = xv.data || [];
    checks = Object.fromEntries((ck.data || []).map(r => [r.item, r]));
    logs = l.data || []; notes = n.data || []; growth = gr.data || [];
    stickers = Object.fromEntries((sd.data || []).filter(x => x.sticker).map(x => [x.day, x.sticker]));
    tilts = Object.fromEntries((sd.data || []).map(x => [x.day, x.tilt || 1]));
    diaries = Object.fromEntries((sd.data || []).filter(x => x.diary).map(x => [x.day, x.diary]));
    const ids = (m.data || []).map(x => x.user_id);
    avatarById = Object.fromEntries((m.data || []).map(x => [x.user_id, x.avatar_url || '']));
    const { data: ps } = await sb.from('profiles').select('id,nickname').in('id', ids);
    nickById = Object.fromEntries((ps || []).map(p => [p.id, p.nickname]));
  },
  loaded: new Set(),                       // 추가로 불러온 달 'YYYY-MM'
  async loadMonth(ym) {                    // 일지에서 지난달로 가면 그 달치를 더 불러옴 (기본은 최근 30일)
    if (MOCK || this.loaded.has(ym)) return;
    const from = new Date(ym + '-01T00:00'), to = new Date(from); to.setMonth(to.getMonth() + 1);
    const [l, n] = await Promise.all([
      sb.from('baby_logs').select('*').eq('baby_id', baby.id).gte('at', from.toISOString()).lt('at', to.toISOString()),
      sb.from('baby_notes').select('*').eq('baby_id', baby.id).gte('day', dstr(from)).lt('day', dstr(to))
    ]);
    for (const r of l.data || []) upsertLocal(logs, r); for (const r of n.data || []) upsertLocal(notes, r);
    this.loaded.add(ym);
  },
  async addLog(row) {
    if (MOCK) { row.id = 'm' + Date.now(); logs.push(row); return row; }
    const { data, error } = await sb.from('baby_logs').insert(row).select().single();
    if (error) throw error; upsertLocal(logs, data); return data;
  },
  async updLog(id, patch) {
    if (MOCK) { Object.assign(logs.find(x => x.id === id), patch); return; }
    const { data, error } = await sb.from('baby_logs').update(patch).eq('id', id).select().single();
    if (error) throw error; upsertLocal(logs, data);
  },
  async delLog(id) {
    logs = logs.filter(x => x.id !== id);
    if (MOCK) return;
    const { error } = await sb.from('baby_logs').delete().eq('id', id); if (error) throw error;
  },
  async updBaby(patch) {

    const { data, error } = await sb.from('babies').update(patch).eq('id', baby.id).select().single();

  async delNote(id) {

  },
  async setSticker(dayStr, list) {                                // list = 이모지 최대 2개 (v0.21, 사장님 "두개정도까지")
    const v = list.join('|');
    const tilt = stickers[dayStr] && tilts[dayStr] ? tilts[dayStr] : (Math.random() < .5 ? -1 : 1);   // 첫 스티커 붙일 때 좌우 랜덤, 두 번째는 반대로
    if (v) { stickers[dayStr] = v; tilts[dayStr] = tilt; } else delete stickers[dayStr];
    if (MOCK) return;
    const { error } = await sb.from('baby_days').upsert({ baby_id: baby.id, day: dayStr, sticker: v, tilt, updated_by: me.id, updated_at: new Date().toISOString() });

  },
  async setDiary(dayStr, text) {
    if (text) diaries[dayStr] = text; else delete diaries[dayStr];
    if (MOCK) return;
    const { error } = await sb.from('baby_days').upsert({ baby_id: baby.id, day: dayStr, diary: text, updated_by: me.id, updated_at: new Date().toISOString() });
    if (error) throw error;
  },
  async addGrowth(row) {
    if (MOCK) { row.id = 'g' + Date.now(); growth.push(row); return; }
    const { data, error } = await sb.from('baby_growth').insert(row).select().single();
    if (error) throw error; upsertLocal(growth, data);

  async updGrowth(id, patch) {
    if (MOCK) { Object.assign(growth.find(x => x.id === id), patch); return; }
    const { data, error } = await sb.from('baby_growth').update(patch).eq('id', id).select().single();

    const { data, error } = await sb.from('baby_notes').insert(row).select().single();

function upsertLocal(arr, row) { const i = arr.findIndex(x => x.id === row.id); if (i < 0) arr.push(row); else arr[i] = row; }

// ── 실시간: 다른 폰이 적으면 바로 반영
// ── 자동 동기화 (v0.23, 사장님 "누군가 작성하면 바로 보여야 하는데 새로고침 안 하면 안 보임")
// 아이폰은 화면이 꺼지거나 다른 앱으로 가면 실시간 연결을 끊고, 끊긴 사이 기록은 다시 보내주지 않는다.
// 그래서 ① 앱이 다시 보일 때 ② 하단 탭을 옮길 때(10초 간격) ③ 연결이 끊겼다 알려올 때 기록을 통째로 다시 받고 연결을 새로 잇는다.
let lastSync = 0, syncing = false, chanDropped = false, chanClosing = false;
async function resync(minGap) {
  if (MOCK && !window.__syncTest) return; if (!baby || !me || syncing) return;
  if (minGap && Date.now() - lastSync < minGap) return;
  syncing = true;
  try {
    await db.loadAll(); db.loaded = new Set();
    const need = new Set([day.slice(0, 7)]); if (!$('s-diary').classList.contains('hidden')) need.add(ym);
    for (const m of need) if (new Date(m + '-01T00:00') < new Date(Date.now() - 30 * 86400000)) await db.loadMonth(m);   // 30일 넘은 달을 보고 있었으면 그 달도
    if (!MOCK && (!channel || channel.state !== 'joined')) { chanClosing = true; if (channel) await sb.removeChannel(channel); channel = null; chanClosing = false; subscribe(); }
    lastSync = Date.now(); redrawCurrent();
  } catch (e) { console.warn('동기화 실패', e); }
  finally { syncing = false; }
}
function redrawCurrent() {
  if (!$('s-home').classList.contains('hidden')) render();
  else if (!$('s-diary').classList.contains('hidden')) renderDiary();
  else if (!$('s-growth').classList.contains('hidden')) { renderGrowth(); if (!$('g-vax').classList.contains('hidden')) renderVax(); if (!$('g-info').classList.contains('hidden')) renderInfo(); }
  else if (!$('s-stats').classList.contains('hidden')) renderStats();
}
function subscribe() {
  if (MOCK || channel) return;
  const ch = channel = sb.channel('baby-' + baby.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_logs', filter: 'baby_id=eq.' + baby.id }, p => {
      if (p.eventType === 'DELETE') logs = logs.filter(x => x.id !== p.old.id); else upsertLocal(logs, p.new);
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_days', filter: 'baby_id=eq.' + baby.id }, p => { const d = (p.old || p.new).day; if (p.eventType === 'DELETE') { delete stickers[d]; delete diaries[d]; } else { if (p.new.sticker) { stickers[d] = p.new.sticker; tilts[d] = p.new.tilt || 1; } else delete stickers[d]; if (p.new.diary) diaries[d] = p.new.diary; else delete diaries[d]; } if (!$('s-diary').classList.contains('hidden')) renderDiary(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_extra_vax', filter: 'baby_id=eq.' + baby.id }, p => { if (p.eventType === 'DELETE') extras = extras.filter(x => x.id !== p.old.id); else upsertLocal(extras, p.new); render(); if (!$('g-vax').classList.contains('hidden')) renderVax(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'baby_checks', filter: 'baby_id=eq.' + baby.id }, p => { if (p.eventType === 'DELETE') delete checks[p.old.item]; else checks[p.new.item] = p.new; render(); if (!$('g-vax').classList.contains('hidden')) renderVax(); })

  const nowA = ageMon(dstr(new Date()));
  const lastA = pts.length ? ageMon(pts[pts.length - 1].day) : 0;
  const xmax = Math.min(24, Math.max(3, Math.ceil(Math.max(nowA, lastA) + 1)));
  const Z = { 3: -1.8808, 15: -1.0364, 50: 0, 85: 1.0364, 97: 1.8808 };
  const sex = baby.sex, lines = {};
  if (sex) for (const [k, z] of Object.entries(Z)) { lines[k] = []; for (let a = 0; a <= xmax + 1e-9; a += xmax / 48) lines[k].push([a, valAtZ(lmsAt(sex, m, a), z)]); }
  let lo = Infinity, hi = -Infinity;
  for (const k in lines) for (const [, v] of lines[k]) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for (const p of pts) { lo = Math.min(lo, +p[GM[m].key]); hi = Math.max(hi, +p[GM[m].key]); }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const padY = (hi - lo) * .06 || 1; lo -= padY; hi += padY;
  const X = a => pl + a / xmax * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const path = arr => arr.map(([a, v], i) => (i ? 'L' : 'M') + X(a).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const band = (a, b) => path(lines[a]) + [...lines[b]].reverse().map(([x, v]) => 'L' + X(x).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + 'Z';
  let g = '';
  // 눈금: 세로 = 개월, 가로 = 값
  const step = xmax <= 6 ? 1 : xmax <= 12 ? 2 : 3;
  for (let a = 0; a <= xmax; a += step) g += `<line x1="${X(a)}" x2="${X(a)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)" stroke-width="1"/><text x="${X(a)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--fg3)">${a ? a + '개월' : '출생'}</text>`;
  const ys = (hi - lo) > 8 ? Math.ceil((hi - lo) / 4) : (hi - lo) > 3 ? 1 : .5;
  for (let v = Math.ceil(lo / ys) * ys; v <= hi; v += ys) g += `<text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--fg3)">${+v.toFixed(1)}</text>`;
  if (sex) {
    g += `<path d="${band(3, 97)}" fill="var(--ok)" opacity=".07"/><path d="${band(15, 85)}" fill="var(--ok)" opacity=".10"/>`;
    for (const k of [3, 97]) g += `<path d="${path(lines[k])}" fill="none" stroke="var(--fg3)" stroke-width="1" opacity=".5"/>`;
    g += `<path d="${path(lines[50])}" fill="none" stroke="var(--fg3)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    for (const k of [3, 50, 97]) { const e = lines[k][lines[k].length - 1]; g += `<text x="${W - pr + 4}" y="${Y(e[1]) + 3}" font-size="10" fill="var(--fg3)">${k}</text>`; }
  }
  if (nowA <= xmax) g += `<line x1="${X(nowA)}" x2="${X(nowA)}" y1="${pt}" y2="${H - pb}" stroke="var(--temp)" stroke-width="1" opacity=".5"/>`;
  const pp = pts.map(p => [ageMon(p.day), +p[GM[m].key]]).filter(([a]) => a >= 0 && a <= xmax);
  if (pp.length > 1) g += `<path d="${path(pp)}" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pp.forEach(([a, v], i) => { const last = i === pp.length - 1; g += `<circle cx="${X(a)}" cy="${Y(v)}" r="${last ? 5 : 3.5}" fill="${last ? 'var(--ok)' : 'var(--card)'}" stroke="var(--ok)" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function renderGrowth() {
  const el = $('growth'); if (!el) return;
  const m = gMetric, key = GM[m].key;
  const pts = growth.filter(r => r[key] != null && r[key] !== '').sort((a, b) => a.day < b.day ? -1 : 1);
  const last = pts[pts.length - 1], prev = pts[pts.length - 2];
  let now = `<div class="g-empty">${GM[m].label} 기록이 아직 없어요</div>`;
  if (last) {
    const p = pctOf(m, last.day, +last[key]);
    let dl = '';
    if (prev) { const dv = +last[key] - +prev[key], dd = Math.round((new Date(last.day) - new Date(prev.day)) / 86400000);
      dl = `${dv >= 0 ? '+' : '−'}${m === 'w' ? Math.round(Math.abs(dv) * 1000) + 'g' : Math.abs(dv).toFixed(1) + 'cm'} · ${dd}일 동안`; }
    now = `<div class="g-now"><b>${fmtV(m, last[key])}</b>${p != null ? `<span class="pc">백분위 ${fmtPct(p)}</span>` : ''}<span class="dl">${fmtDate(last.day).replace(/<[^>]+>/g, ' ')} · D+${dayNo(last.day)}</span></div>${dl ? `<div class="sub" style="margin:0 0 8px">${dl}</div>` : ''}`;
  }
  const sexAsk = baby.sex ? '' : `<div class="g-sex">성별을 고르면 WHO 기준 곡선과 백분위가 같이 보여요<div class="gs-btns"><button type="button" data-sex="m">남아</button><button type="button" data-sex="f">여아</button></div></div>`;
  const rows = [...growth].sort((a, b) => a.day < b.day ? 1 : -1);
  const shown = gShowAll ? rows : rows.slice(0, 3);
  const list = rows.length ? `<div class="g-list" style="border-top:0;margin-top:0">${shown.map(r => `<button type="button" class="g-row" data-id="${r.id}">
      <span class="dt">${fmtDate(r.day).replace(/<[^>]+>/g, ' ')} · D+${dayNo(r.day)}</span>
      <span class="v">${['w', 'l', 'h'].filter(k => r[GM[k].key] != null).map(k => fmtV(k, r[GM[k].key])).join(' · ')}</span>
      ${r.note ? `<span class="nt">${esc(r.note)}</span>` : ''}${avatar(r.user_id)}</button>`).join('')}</div>
      ${rows.length > 3 && !gShowAll ? `<button type="button" class="g-more" id="g-more">이전 기록 ${rows.length - 3}개 더 보기</button>` : ''}` : '';
  const lastOf = k => growth.filter(r => r[GM[k].key] != null).sort((a, b) => a.day < b.day ? -1 : 1).pop();
  // 측정 버튼 3개 = v0.13 카드 디자인 그대로 (사장님 "버튼은 기존 디자인대로 밑으로")
  const quick = ['w', 'l', 'h'].map(k => { const g = GM[k], lp = lastOf(k), pc = lp ? pctOf(k, lp.day, +lp[g.key]) : null;
    return `<button type="button" data-gq="${k}"><span class="plus">+</span><span class="k">${g.label}</span><span class="v ${lp ? '' : 'none'}">${lp ? fmtV(k, lp[g.key]) : '기록 없음'}</span>${pc != null ? `<span class="p">백분위 ${fmtPct(pc)}</span>` : ''}</button>`; }).join('');
  const bd = new Date(baby.birth_date + 'T00:00');
  // 프로필 = 사진 + 이름·D+n·설명 (v0.18)
  const profile = `<div class="gp"><div class="gp-top"><button type="button" class="gp-av" id="gp-av" aria-label="아기 정보"><img src="${esc(babyFace())}" alt=""></button>
      <div class="gp-info"><div class="gp-name">${esc(baby.name)}<span class="dday">D+${dayNo(dstr(new Date()))}</span></div>
      <div class="gp-bio">${bd.getFullYear()}년 ${bd.getMonth() + 1}월 ${bd.getDate()}일생 · ${baby.sex === 'f' ? '여아' : baby.sex === 'm' ? '남아' : '성별 미정'}</div></div></div></div>`;
  $('g-prof').innerHTML = profile;
  el.innerHTML = `<div class="g-quick" id="g-quick">${quick}</div><div class="stat-card grow">
    <div class="g-head"><h3>성장곡선</h3></div>
    <div class="seg mini g-metric" id="g-metric">${Object.entries(GM).map(([k, v]) => `<button type="button" data-v="${k}" class="${k === m ? 'on' : ''}">${v.label}</button>`).join('')}</div>
    ${now}${sexAsk}${growthChart(m, pts)}
    ${baby.sex ? `<div class="g-src">점선 = 50백분위 · 띠 = 3~97 / 15~85 · WHO 성장기준(0~24개월)</div>` : ''}</div>
    <div class="stat-card grow"><div class="g-head" style="margin-bottom:4px"><h3>측정 기록</h3><span class="g-cnt">${rows.length ? rows.length + '회' : ''}</span></div>
    ${list || '<div class="g-empty">아직 측정 기록이 없어요. 맨 위 버튼으로 시작해요</div>'}</div>`;
  el.querySelectorAll('[data-gq]').forEach(b => b.onclick = () => openGrowthSheet(null, b.dataset.gq));
  $('gp-av').onclick = () => openBabySheet();
  $('g-metric').onclick = e => { const b = e.target.closest('button'); if (!b) return; gMetric = b.dataset.v; localStorage.setItem('bb-gm', gMetric); renderGrowth(); };
  el.querySelectorAll('.g-row').forEach(b => b.onclick = () => openGrowthSheet(growth.find(r => r.id === b.dataset.id)));
  el.querySelectorAll('[data-sex]').forEach(b => b.onclick = async () => { try { await db.updBaby({ sex: b.dataset.sex }); renderGrowth(); toast('기준 곡선을 켰어요'); } catch (e) { alert('저장 실패: ' + e.message); } });
  if ($('g-more')) $('g-more').onclick = () => { gShowAll = true; renderGrowth(); };
}

function openGrowthSheet(rec, focus) {
  // 두 모드 (v0.15 버그 수정): ① 입력(focus 있음, 상단 버튼) = 날짜가 대상을 정한다. 그날 기록이 있으면 불러와 이어 적고, 없으면 새 줄.
  //   날짜를 바꿔도 다른 날 기록을 옮기거나 덮지 않는다. ② 고치기(목록에서) = 그 한 줄만 고친다. 기록 있는 다른 날로 옮기기는 막는다.
  const entry = !!focus, today = dstr(new Date());
  let target = entry ? (growth.find(r => r.day === today) || null) : rec;
  const val = (r, k) => r && r[GM[k].key] != null ? +r[GM[k].key] : '';
  $('sheet').innerHTML = `<h3 class="grow" id="g-title"></h3>
    <div class="frow"><label>날짜</label><input type="date" id="g-day" value="${entry ? today : rec.day}" max="${today}" style="width:170px"></div>
    <div class="frow${focus === 'w' ? ' focus' : ''}"><label>몸무게 <small style="color:var(--fg3)">kg</small></label><input type="number" inputmode="decimal" step="0.01" id="g-w" placeholder="3.52"></div>
    <div class="frow${focus === 'l' ? ' focus' : ''}"><label>키 <small style="color:var(--fg3)">cm</small></label><input type="number" inputmode="decimal" step="0.1" id="g-l" placeholder="51.5"></div>
    <div class="frow${focus === 'h' ? ' focus' : ''}"><label>머리둘레 <small style="color:var(--fg3)">cm</small></label><input type="number" inputmode="decimal" step="0.1" id="g-h" placeholder="35.0"></div>
    <div class="frow col"><label>메모</label><input class="wide" id="g-note" maxlength="60" placeholder="1차 검진, 소아과, 집 체중계…"></div>
    <div class="foot" style="margin:2px 0 0" id="g-foot">재지 않은 칸은 비워두세요</div>
    <div class="acts">${!entry ? '<button type="button" class="del" id="sh-del">삭제</button>' : ''}<button type="button" class="cancel" id="sh-cancel">취소</button><button type="button" class="save" id="sh-save"></button></div>`;
  const fill = r => { for (const k of ['w', 'l', 'h']) $('g-' + k).value = val(r, k); $('g-note').value = r ? r.note || '' : '';
    $('g-title').textContent = !entry ? '성장 측정 고치기' : r ? (r.day === today ? '오늘 측정 이어 적기' : '이날 측정 이어 적기') : '성장 측정';
    $('sh-save').textContent = entry && !r ? '기록' : '저장';
    $('g-foot').textContent = entry && r ? '이날 적어둔 값이에요. 바꾸거나 빈칸을 채워주세요' : '재지 않은 칸은 비워두세요'; };
  fill(target);
  if (entry) $('g-day').addEventListener('change', () => { target = growth.find(r => r.day === $('g-day').value) || null; fill(target); });
  $('sheet').dataset.kind = 'growth';
  $('dim').classList.remove('hidden'); $('sheet').classList.remove('hidden'); $('dim').onclick = closeSheet; $('sh-cancel').onclick = closeSheet;
  if (focus) { const f = $('g-' + focus); f.focus(); if (f.value) f.select(); }   // 누른 항목 칸에 바로 커서 (같은 탭 제스처 안이라 iOS 키보드도 뜸)
  if ($('sh-del')) $('sh-del').onclick = async () => { if (!confirm('이 측정 기록을 지울까요?')) return; try { await db.delGrowth(rec.id); closeSheet(); renderGrowth(); toast('지웠어요'); } catch (e) { alert('삭제 실패: ' + e.message); } };
  $('sh-save').onclick = async () => {
    const num = id => { const x = $(id).value.trim().replace(',', '.'); return x === '' ? null : +x; };
    const w = num('g-w'), l = num('g-l'), h = num('g-h'), dayV = $('g-day').value;
    if (!dayV) { toast('날짜를 골라주세요'); return; }
    if (w == null && l == null && h == null) { toast('하나는 적어주세요'); return; }
    if ((w != null && !(w >= 1 && w <= 30)) || (l != null && !(l >= 30 && l <= 130)) || (h != null && !(h >= 25 && h <= 60))) { toast('숫자를 확인해주세요 (몸무게는 kg)'); return; }
    const fields = { day: dayV, weight_kg: w, length_cm: l, head_cm: h, note: $('g-note').value.trim() };
    try {
      if (entry) {
        const t = growth.find(r => r.day === dayV);          // 저장 순간 다시 확인 (다른 폰이 방금 적었을 수도)
        if (t) await db.updGrowth(t.id, fields); else await db.addGrowth({ baby_id: baby.id, user_id: me.id, ...fields });
        gMetric = focus; localStorage.setItem('bb-gm', gMetric);
        closeSheet(); renderGrowth(); toast(`${GM[focus].label} 기록했어요`);
      } else {
        if (dayV !== rec.day && growth.some(r => r.day === dayV && r.id !== rec.id)) { toast('그날엔 이미 기록이 있어요. 그 줄을 눌러 고쳐주세요'); return; }
        await db.updGrowth(rec.id, fields); closeSheet(); renderGrowth(); toast('고쳤어요');
      }
    } catch (e) { alert('저장 실패: ' + e.message); }
  };
}

// ═══ 월별정보 (v0.24) — 개월별 "이 시기의 아기는? / 엄마와 아빠는?" ═══
// 내용: 임신육아종합포털 아이사랑 등 공공 자료를 확인해 짧게 다시 씀(각 달 sources). 평균 키·몸무게는 WHO 50백분위(WHO_LMS).
const MONTHLY = /*MONTHLY*/[{"m":0,"headline":"엄마 배 속을 떠나 세상에 적응하는 중이에요","feed":{"count":"8~12회","interval":"2~3시간","amount":"1회 50~100ml","note":"밤에도 아기가 원할 때마다 먹여요. 모유는 시간을 재기보다 배고파할 때 물려요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["갓 태어난 아기는 20~30cm 거리를 가장 잘 봐요. 안았을 때 엄마·아빠 얼굴이 딱 그쯤이라, 가까이서 눈을 맞춰 주면 좋아요. 목소리도 벌써 구분해서 2~3주쯤이면 익숙한 목소리를 알아들어요.","지금은 울음이 아기의 유일한 말이에요. 처음엔 왜 우는지 헷갈려도, 지내다 보면 배고픈 울음과 졸린 울음이 조금씩 구분돼요. 밤낮 구분 없이 2~3시간씩 자고 깨는 게 보통이에요.","탯줄은 보통 1~2주면 말라서 떨어져요. 그때까지는 깨끗하고 뽀송하게만 지켜 주면 돼요. 첫 영유아건강검진은 생후 14~35일 사이에 있으니 미리 챙겨 두세요."],"parent_headline":"몸이 회복되는 산욕기예요","parent":["출산 후 4~6주는 몸이 임신 전으로 돌아가는 산욕기예요. 오로가 몇 주 이어지고 훗배앓이가 있을 수 있어요. 지금은 다이어트보다 잘 먹고 쉬는 게 먼저예요.","밤중 수유는 한 사람이 다 떠안지 않게 나눠요. 수유하는 사람에게 물과 베개를 챙기고, 아기를 건네주거나 다시 재우는 것만 맡아도 큰 힘이 돼요. 기분이 가라앉는 날이 2주 넘게 이어지면 함께 전문의를 찾아가 보세요."],"sources":["https://www.childcare.go.kr/?menuno=420","https://www.childcare.go.kr/?menuno=422","https://www.childcare.go.kr/?menuno=423","https://www.childcare.go.kr/?menuno=424","https://www.childcare.go.kr/?menuno=276","https://www.childcare.go.kr/?menuno=416","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":1,"headline":"엄마·아빠 목소리에 반응하기 시작해요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유는 2~3시간마다 하루 8~12번쯤 먹어요. 1~6개월 모유 섭취량은 하루 평균 750~800ml지만 아기마다 달라요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["꼭 쥐고 있던 손이 조금씩 펴지고 손가락을 빨기도 해요. 팔다리 움직임이 활발해지고, 엎드린 자세에서 고개를 좌우로 돌리기도 해요. 목은 아직 완전히 가누지 못하니 안을 때 꼭 받쳐 주세요.","생후 4주 무렵 BCG와 B형간염 예방접종이 있어요. 첫 검진 때 함께 챙기면 편해요. 체중은 한 번 재는 것보다 일주일~열흘 간격으로 꾸준히 재서 흐름을 보는 게 좋아요.","수유, 목욕, 기저귀 갈기 같은 일상 속에서 말을 걸어 주세요. 아기는 따로 가르치지 않아도 함께 있는 시간 속에서 가장 잘 배워요."],"parent_headline":"엄마도 함께 검진받는 달이에요","parent":["생후 1개월쯤엔 아기만이 아니라 엄마도 산후 회복을 확인받는 게 좋아요. 궁금한 점을 미리 메모해 가면 진료 때 놓치지 않아요.","요리·빨래 같은 집안일은 수유하지 않는 쪽이 최대한 맡아 주세요. 수유가 끝나면 트림시키기나 기저귀 갈기를 번갈아 하면서 두 사람 모두 아기와 가까워질 수 있어요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=429","https://www.childcare.go.kr/?menuno=431","https://www.childcare.go.kr/?menuno=432","https://www.childcare.go.kr/?menuno=433","https://www.childcare.go.kr/?menuno=422","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":2,"headline":"첫 사회적 미소를 보여 줘요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유는 2개월이 지나면 하루 5~8번 정도로 줄어들어요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["엄마·아빠 얼굴을 보고 방긋 웃는 사회적 미소가 나타나요. 기분이 좋으면 옹알이도 하고, 대답해 주면 더 신나서 소리를 내요. 소리 나는 쪽으로 고개를 돌리기도 해요.","이 무렵 아기 울음이 가장 많아져요. 이유 없이 오래, 특히 늦은 오후나 저녁에 우는 경우가 많은데 3~5개월쯤이면 줄어드는 게 보통이에요.","2개월에는 DTaP, 소아마비, 폐렴구균, b형 헤모필루스 인플루엔자 예방접종이 있어요. 로타바이러스는 선택접종이에요. 땀이 많아지는 시기라 시원하고 청결하게 해 주면 땀띠 예방에 좋아요."],"parent_headline":"울음이 가장 힘든 시기예요","parent":["아무리 달래도 울음이 안 그칠 때가 있어요. 부모 탓이 아니에요. 너무 지치면 아기를 안전한 침대에 눕혀 두고 잠깐 다른 방에서 숨을 돌려도 괜찮아요.","아무리 힘들어도 아기를 흔들면 안 돼요. 한 사람이 한계에 다다르면 다른 한 사람이 바로 교대하기로 미리 약속해 두세요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=427","https://www.childcare.go.kr/?menuno=428","https://www.childcare.go.kr/?menuno=429","https://www.childcare.go.kr/?menuno=432","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":3,"headline":"목에 힘이 생기고 밤잠이 길어져요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"수유 횟수와 양이 조금씩 규칙적으로 잡혀 가요."},"sleep":{"total":"14~17시간","nap":null,"source":"미국수면재단"},"baby":["눈앞에서 천천히 움직이는 물건을 180도까지 따라 봐요. 차츰 목을 가누고, 3개월쯤부터는 뒤집기를 시도하는 아기도 있어요. 머리 위에 딸랑이를 들어 손을 뻗게 해 보세요.","2~3개월부터 밤낮 수면 패턴이 생기기 시작해요. 3개월이 되면 자다가 덜 깨고, 저녁에 4~5시간 정도 이어서 자기도 해요. 밤에는 어둡고 조용하게, 수유도 간단하게 해 주세요.","하루에 잠깐씩 엎드려 놀기를 하면 목과 등 근육이 튼튼해져요. 영아산통은 대개 3~4개월이 지나면 자연스럽게 줄어들어요."],"parent_headline":"몸과 마음의 변화를 살필 때예요","parent":["출산 후 2~5개월 사이에 머리카락이 많이 빠질 수 있어요. 호르몬 변화 때문이고 보통 6개월이 지나면 회복돼요.","산후우울증은 출산 후 1년 안에 언제든 올 수 있어요. 잠을 못 이루거나 눈물이 잦고 쉽게 화가 나는 날이 2주 넘게 이어지면 혼자 참지 말고 함께 상담을 받아 보세요."],"sources":["https://www.childcare.go.kr/?menuno=425","https://www.childcare.go.kr/?menuno=427","https://www.childcare.go.kr/?menuno=431","https://www.childcare.go.kr/?menuno=433","https://www.childcare.go.kr/?menuno=276","https://www.childcare.go.kr/?menuno=415","https://www.childcare.go.kr/?menuno=416","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":4,"headline":"뒤집기를 시작하고 까꿍에 까르르 웃어요","feed":{"count":"4~10회","interval":"2~4시간","amount":"1회 100~200ml","note":"모유수유라면 생후 6개월까지는 모유만 먹이는 걸 권해요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["색을 구별할 만큼 눈이 좋아지고 자기 이름에 반응하기도 해요. 누워 있다가 뒤집기를 시작하고, 장난감을 양손으로 잡고 입으로 가져가요.","사물이 안 보여도 있다는 걸 조금씩 알게 돼서 까꿍 놀이를 정말 좋아해요. 소리 내어 웃고, 옹알이로 엄마·아빠와 주고받기를 즐겨요.","4개월에는 2개월 때 맞은 접종의 2차가 있어요. 4~6개월 사이에 2차 영유아건강검진도 있으니 일정을 확인해 두세요."],"parent_headline":"역할을 다시 나눠 볼 때예요","parent":["하루 동안 집에서 하는 일을 적어 보고, 아이를 위한 일과 어른을 위한 일로 나눠 보세요. 누가 더 하느냐보다 각자 잘하는 일로 나누는 게 오래가요.","배우자가 아기를 보는 시간은 온전히 내 휴식으로 써도 괜찮아요. 서로 그런 시간을 일주일에 한 번이라도 만들어 주세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=439","https://www.childcare.go.kr/?menuno=440","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":5,"headline":"낯가림이 시작되고 감정 표현이 풍부해져요","feed":{"count":"4~6회","interval":"4~6시간 (낮 시간)","amount":"1회 160~200ml (하루 800~1,000ml)","note":"이유식을 시작했다면 하루 1번 정도예요. 아직은 수유가 주된 영양이에요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["가족 얼굴을 알아보고 낯선 사람을 구분하기 시작해요. 즐거우면 환하게 웃고 싫으면 울면서 감정을 잘 드러내요. 거울 속 자기 모습을 보고 웃기도 해요.","‘아, 에, 오’ 같은 모음 옹알이에 ‘ㅁ, ㅂ’ 같은 자음 소리가 섞이기 시작해요. 아기가 소리를 내면 따라 해 주세요.","이유식은 서두르지 않아도 돼요. 시작한다면 묽은 미음 한 숟가락부터, 새 재료는 한 번에 한 가지씩 며칠 두고 살펴보며 늘려 가요. 시작 시기는 검진 때 상의해 보세요."],"parent_headline":"몸은 천천히 돌아와도 괜찮아요","parent":["임신 전 몸무게로는 보통 6개월에 걸쳐 천천히 돌아와요. 모유수유 중이라면 무리한 다이어트보다 끼니를 거르지 않는 게 더 중요해요.","나들이는 보통 이 무렵부터 시작해요. 아기 기분이 좋고 열이 없는 날, 가까운 공원처럼 짧은 외출부터 해 보세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=439","https://www.childcare.go.kr/?menuno=277","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":6,"headline":"잠깐 앉고 첫니가 보이기 시작해요","feed":{"count":"4~6회","interval":"4~6시간 (낮 시간)","amount":"1회 160~200ml (하루 800~1,000ml)","note":"고기는 만 6개월부터 줄 수 있어요. 과일주스는 6개월 전에는 주지 않아요."},"sleep":{"total":"12~15시간","nap":"하루 2~3번, 한 번에 최대 2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["목을 완전히 가눠서 잠깐 앉아 있을 수 있고, 엎드리면 상체를 번쩍 들어요. 슬슬 기려는 시도를 하는 아기도 있어요.","첫니는 보통 6~8개월 사이 아래 앞니부터 나와요. 이 나는 시기는 아기마다 많이 달라서 돌 전에만 나면 괜찮아요. 이가 나면 가제로 살살 닦아 주세요.","6개월에는 DTaP·소아마비·폐렴구균·b형 헤모필루스 인플루엔자 3차와 B형간염 3차 접종이 있어요. 가을 이후라면 독감 접종도 챙겨요. 밤에 6시간쯤 길게 자는 날도 생겨요."],"parent_headline":"복직과 밤중 수유를 계획해 볼 때예요","parent":["밤중 수유는 아기가 잘 크고 있다면 이 무렵부터 천천히 줄여 볼 수 있어요. 꼭 끊어야 하는 건 아니니 두 사람에게 맞는 방법을 골라요.","복직을 앞두고 있다면 2주 전부터 회사에서 유축할 시간에 맞춰 연습해 두면 좋아요. 아빠가 하루를 통째로 맡아 보는 날도 만들어 보세요."],"sources":["https://www.childcare.go.kr/?menuno=434","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=438","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=282","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":7,"headline":"혼자 앉고 배밀이를 시작해요","feed":{"count":"3~5회","interval":"5~6시간","amount":"1회 160~240ml (하루 700~800ml)","note":"이유식은 하루 2번, 간식은 1번 정도예요. 혀로 으깰 수 있는 정도로 부드럽게 만들어요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["많은 아기가 기대지 않고 혼자 앉을 수 있어요. 배밀이를 시작하고, 물건을 한 손에서 다른 손으로 옮겨 쥐어요.","엄마·아빠가 안 보이면 불안해서 우는 분리불안이 나타나요. 애착이 잘 생겼다는 자연스러운 신호예요. 자주 안아 주고 까꿍·숨바꼭질 놀이를 해 주세요.","갑자기 이유식을 덜 먹는 때가 있는데 흔한 일이에요. 잘 놀고 변을 잘 보면 억지로 먹이지 않아도 돼요."],"parent_headline":"서로 다른 육아 방식을 맞춰 가요","parent":["자란 환경이 다르니 육아 방식이 다른 건 당연해요. 다만 아기 앞에서 다투거나 서로 다른 지시를 하지 않도록, 둘만 있을 때 차분히 이야기해 보세요.","대화할 땐 휴대폰을 내려놓고 상대에게 집중해요. 몸이 지치면 말이 날카로워지기 쉬우니 피곤한 날엔 쉬고 나서 이야기해도 돼요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=442","https://www.childcare.go.kr/?menuno=443","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":8,"headline":"가구를 잡고 일어서요","feed":{"count":"3~5회","interval":"5~6시간","amount":"1회 160~240ml (하루 700~800ml)","note":"새 재료는 2~3일 간격으로 한 가지씩 더해요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["가구를 붙잡고 일어서는 아기가 많아요. 빠른 아기는 손을 잡고 한두 걸음 떼기도 하는데, 이때 넘어지기 쉬우니 주변을 잘 살펴 주세요.","8개월이 되면 대부분 부모 도움 없이도 잠들 수 있어요. 대신 기어 다니기 시작하고 분리불안이 생기면서 잠투정이 늘기도 해요.","위쪽 앞니 2개가 나와 이가 4개쯤 되는 시기예요. 기어 다니며 뭐든 입에 넣으니 바닥에 작은 물건이 없는지 한번 엎드려서 살펴봐 주세요."],"parent_headline":"각자의 시간을 확보해요","parent":["두 사람의 하루 일과를 각자 적어 보고 비교해 보세요. 누가 더 많이 하느냐보다 서로의 시간이 어디로 가는지 보는 게 먼저예요.","일주일 중 각자 아기와 노는 시간을 정하고, 그동안 다른 한 사람은 쉬거나 하고 싶은 일을 해요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=443","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=448","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":9,"headline":"말의 뜻을 조금씩 알아들어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 이유식 하루 3번, 간식 1번 정도로 진밥처럼 조금 되게 만들어요."},"sleep":{"total":"12~15시간","nap":"하루 1~2번, 한 번에 1~2시간","source":"미국수면재단 (낮잠은 아이사랑)"},"baby":["9개월쯤이면 단어의 뜻을 이해하기 시작해요. 이름을 부르면 돌아보고, 손가락으로 가리키기도 해요. 짝짜꿍, 바이바이 놀이를 좋아해요.","숟가락을 휘젓고 손으로 음식을 만지느라 반은 흘리지만, 스스로 먹는 걸 배우는 과정이에요. 새 음식을 거부하면 다음 날 다시 줘 보세요. 열 번 넘게 시도해야 받아들이기도 해요.","9~12개월 사이에 3차 영유아건강검진이 있어요. 이유식 진행과 빈혈 여부를 살펴봐요."],"parent_headline":"함께 밥 먹는 시간을 만들어요","parent":["아기 밥을 먼저 먹이고 어른은 따로 먹기 쉬운데, 이유식 시간을 온 가족 식사 시간으로 삼아 보세요. 일주일에 한두 번이라도 좋아요.","먹이는 일에만 집중하기보다 함께 식탁에 앉는 경험을 쌓아 가면 아기의 식습관에도 도움이 돼요."],"sources":["https://www.childcare.go.kr/?menuno=441","https://www.childcare.go.kr/?menuno=444","https://www.childcare.go.kr/?menuno=446","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":10,"headline":"잡고 걷고 손끝으로 집어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 생우유는 돌 전에는 삼가요."},"sleep":{"total":"12~15시간","nap":null,"source":"미국수면재단"},"baby":["혼자 일어나고 가구나 손을 잡고 걸어요. 엄지와 검지로 작은 것을 집을 수 있게 되고, 컵을 들고 마셔 보기도 해요.","칭찬과 꾸중을 구별하고, 자주 보는 사람은 며칠이 지나도 알아봐요. 물건을 통에 넣었다 빼는 놀이를 한참 해요.","보행기는 되도록 쓰지 않는 게 좋아요. 대신 매트 위에서 마음껏 움직이게 해 주세요. 계단이 있다면 안전문을 달고, 약과 세제는 손이 닿지 않는 곳에 둬요."],"parent_headline":"아기와 1:1 시간을 챙겨요","parent":["함께하는 시간이 짧은 쪽이라면 퇴근 후 짧게라도 아기와 둘만의 시간을 정해 두세요. 그림책을 읽거나 마사지를 해 주며 이야기하는 걸로 충분해요.","아기가 빠르게 움직이는 만큼 집 안 점검은 두 사람이 같이 해요. 조부모님 댁처럼 자주 가는 곳도 함께 살펴봐 주세요."],"sources":["https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=448","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":11,"headline":"엄마 아빠 말고도 단어가 늘어요","feed":{"count":"2~3회","interval":null,"amount":"하루 600~800ml","note":"수유는 아침·점심·저녁 즈음이에요. 이유식은 하루 3번, 간식 1번 정도예요."},"sleep":{"total":"12~15시간","nap":null,"source":"미국수면재단"},"baby":["‘엄마’, ‘아빠’ 말고도 단어 몇 개를 말하기 시작해요. 고개 젓기, 손 흔들기 같은 몸짓으로도 뜻을 전해요.","아래 앞니 양옆으로 2개가 더 나서 이가 6개쯤 돼요. 분유병을 문 채 잠들면 충치가 생기기 쉬우니 돌 전후로 병 수유를 줄여 가요.","좋아하는 사람과 물건이 뚜렷해지고 엄마·아빠가 떠나면 울기도 해요. 책을 가져와 읽어 달라고 건네기도 해요."],"parent_headline":"내 감정도 돌봐 주세요","parent":["몸이 지치면 상대의 말을 나쁘게 받아들이기 쉬워요. 육아 스트레스를 배우자에게 쏟고 있지는 않은지 가끔 돌아봐요.","말수나 감정 표현은 사람마다 달라요. 내 기준 대신 상대의 성향을 이해하려고 하면 대화가 한결 편해져요."],"sources":["https://www.childcare.go.kr/?menuno=445","https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=452","https://www.childcare.go.kr/?menuno=283","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]},{"m":12,"headline":"첫 걸음을 향해 가는 돌이에요","feed":{"count":"2회","interval":null,"amount":"하루 400~600ml","note":"오전·오후에 먹어요. 식사 3번, 간식 2번으로 점차 가족 식사 시간에 맞춰 가요."},"sleep":{"total":"11~14시간","nap":null,"source":"미국수면재단"},"baby":["빠른 아기는 혼자 걷기 시작해요. 아직 잡고 걷는 아기도 많으니 조급해하지 않아도 돼요. 공 주고받기처럼 간단한 놀이를 할 수 있어요.","돌 무렵이면 가족과 같은 건강한 음식을 조금 부드럽고 작게 해서 먹을 수 있어요. 땅콩, 포도, 사탕처럼 목에 걸리기 쉬운 음식은 조심해 주세요.","MMR(홍역·유행성이하선염·풍진) 1차는 12~15개월, A형간염 1차는 12개월 이후에 맞아요. 할 줄 알던 것을 못 하게 되는 등 걱정되는 변화가 있으면 소아청소년과에 상담해 보세요."],"parent_headline":"1년을 함께 해낸 두 사람이에요","parent":["아기가 커 갈수록 정해야 할 일이 늘어나요. 놀아 주는 것뿐 아니라 육아의 방향을 정하는 일도 두 사람이 함께해요.","1년 동안 서로 수고 많았다고 말해 주세요. 앞으로도 가족 식사와 각자의 쉬는 시간을 계속 지켜 가요."],"sources":["https://www.childcare.go.kr/?menuno=447","https://www.childcare.go.kr/?menuno=449","https://www.childcare.go.kr/?menuno=451","https://www.childcare.go.kr/?menuno=437","https://www.childcare.go.kr/?menuno=282","https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1107","https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1109","https://www.thensf.org/how-many-hours-of-sleep-do-you-really-need/"]}]/*END*/;

// ── 24시간 원형 생활계획표: 0시가 위, 시계 방향. 잠은 실제 길이 띠, 수유·기저귀·체온은 짧은 조각
let view = localStorage.getItem('bb-view') || 'list';
function renderClock(sorted, dayLogs, today) {
  const C = 170, R = 138, r = 66, LR = 158;                      // 두꺼운 도넛, 가운데 구멍엔 아기 캐릭터                      // 중심, 바깥/안쪽 반지름, 라벨 반지름

  const pt = (rad, a) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];

    if (m1 - m0 < 4) { const mid = (m0 + m1) / 2; m0 = mid - 2; m1 = mid + 2; }
    const a0 = ang(m0), a1 = ang(m1), big = (m1 - m0) > 720 ? 1 : 0;
    const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
    return `<path class="${cls}" ${id ? `data-id="${id}"` : ''} d="M${x0} ${y0}A${ro} ${ro} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${big} 0 ${x3} ${y3}Z"/>`;

  let g = '';

  for (let h = 0; h < 24; h++) {                                  // 짝수 시각 = 숫자, 홀수 시각 = 짧은 눈금 (마미톡 문법)
    const a = ang(h * 60);
    if (h % 2 === 0) { const [lx, ly] = pt(LR, a); g += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" fill="var(--fg3)" font-size="12">${h}</text>`; }
    else { const [x0, y0] = pt(LR, a); g += `<circle cx="${x0}" cy="${y0}" r="1.8" fill="var(--fg3)" opacity=".7"/>`; }   // 숫자 사이는 점
  }
  for (const l of sorted.filter(l => l.kind === 'sleep')) {       // 잠 띠 (자정 넘기면 잘라서)
    const s0 = +new Date(l.at), e0 = l.ended_at ? +new Date(l.ended_at) : Date.now();
    if (e0 <= dayStart || s0 >= dayEnd) continue;

  return `<svg viewBox="0 0 340 340" style="max-width:340px;margin:0 auto">${g}</svg><div class="lg"><span class="feed">수유</span><span class="diaper">기저귀</span><span class="sleep">잠</span><span class="temp">체온</span></div>`;

// ── 자온 AI 비서 (v0.32) — 채팅만. 기록은 안 보냄(사장님 10-01), 보내는 건 질문·최근 대화·생후 일수·이름

async function aiSend() {

        body: JSON.stringify({ question: q, history, ageDays: dayNo(dstr(new Date())) - 1, babyName: baby.name }) });

}
